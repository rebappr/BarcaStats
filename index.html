<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FC Barcelona Matches</title>

    <link rel="icon.png
    <linkicon-16x16.png
    <linkle-touch-icon.png
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --barca-blue:#004D98;
    --barca-red:#A50044;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Roboto',sans-serif;
    background:#f4f6f9;
    color:#1f2937;6
    font-size:12px;
}

th{
    font-size:12px;
}

td{
    font-size:12px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.header{
    background:linear-gradient(
        135deg,
        var(--barca-blue),
        var(--barca-red)
    );
    color:white;
    padding:24px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
}

.header h1{
    margin:0;
    font-size:24px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.filter-group{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:180px;
}

.filter-group label{
    font-weight:700;
    font-size:12px;
}

input[list]{
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:8px 10px;
    font-family:inherit;
    font-size:12px;
}

.table-wrapper{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.table-scroll{
    overflow:auto;
    max-height:800px;
    display:flex;
    justify-content:center;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    white-space:nowrap;
}


th:nth-child(1),
td:nth-child(1),
th:nth-child(2),
td:nth-child(2),
th:nth-child(3),
td:nth-child(3){
    width:1%;
}

th{
    background:var(--barca-blue);
    color:white;
    text-align:left;
    padding:12px;
    position:sticky;
    top:0;
    z-index:10;
}

td{
    padding:8px;
    border-bottom:1px solid #edf2f7;
}

tbody tr:hover{
    background:#dfe9f5;
    cursor: pointer;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    background:#dbeafe;
    color:#1e40af;
    font-weight:600;
}

.result-badge{
    display:inline-block;
    min-width:52px;
    text-align:center;
    border-radius:999px;
    padding:4px 10px;
    font-weight:700;
}

.result-win{
    background:#dcfce7;
    color:#166534;
}

.result-draw{
    background:#fef9c3;
    color:#854d0e;
}

.result-loss{
    background:#fee2e2;
    color:#991b1b;
}

.result-empty{
    background:#f3f4f6;
    color:#6b7280;
}

.empty{
    padding:40px;
    text-align:center;
}

@media(max-width:768px){

    .container{
        padding:10px;
    }

    .header h1{
        font-size:16px;
    }

    .filters{
        flex-direction:column;
    }

    .filter-group{
        min-width:0;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>FC Barcelona</h1>
    </div>

    <div class="filters">

        <div class="filter-group">
            <label for="seasonFilter">Season</label>
            <input id="seasonFilter" list="seasonList">
            <datalist id="seasonList"></datalist>
        </div>

        <div class="filter-group">
            <label for="competitionFilter">Competition</label>
            <input id="competitionFilter" list="competitionList">
            <datalist id="competitionList"></datalist>
        </div>

        <div class="filter-group">
            <label for="opponentFilter">Opponent</label>
            <input id="opponentFilter" list="opponentList">
            <datalist id="opponentList"></datalist>
        </div>

    </div>

    <div id="matches">
        Loading...
    </div>

</div>

<script>

let allMatches = [];

fetch("data.json")
.then(response => response.json())
.then(data => {

    allMatches = data;

    createFilters(data);

})
.catch(error => {

    console.error(error);

    document.getElementById("matches").innerHTML =
        "<div class='empty'>Chyba pri načítaní data.json</div>";

});

function createFilters(data){

    const seasons = [
        ...new Set(
            data.map(x => x["Season"])
            .filter(Boolean)
        )
    ];

    seasons.sort().reverse();

    seasons.forEach(season => {

        const option =
            document.createElement("option");

        option.value = season;

        document
            .getElementById("seasonList")
            .appendChild(option);

    });

    const competitions = [
        ...new Set(
            data.map(x => x["Competition"])
            .filter(Boolean)
        )
    ];

    competitions.sort();

    competitions.forEach(comp => {

        const option =
            document.createElement("option");

        option.value = comp;

        document
            .getElementById("competitionList")
            .appendChild(option);

    });

    const opponents = [
        ...new Set(
            data.map(x => x["Opp. Team"])
            .filter(Boolean)
        )
    ];

    opponents.sort();

    opponents.forEach(opponent => {

        const option =
            document.createElement("option");

        option.value = opponent;

        document
            .getElementById("opponentList")
            .appendChild(option);

    });

    document
        .getElementById("seasonFilter")
        .addEventListener("input", applyFilters);

    document
        .getElementById("competitionFilter")
        .addEventListener("input", applyFilters);

    document
        .getElementById("opponentFilter")
        .addEventListener("input", applyFilters);

    applyFilters();

}

function applyFilters(){

    let filtered = [...allMatches];

    const season =
        document
            .getElementById("seasonFilter")
            .value
            .trim();

    const competition =
        document
            .getElementById("competitionFilter")
            .value
            .trim();

    const opponent =
        document
            .getElementById("opponentFilter")
            .value
            .trim();

    if(season){

        filtered = filtered.filter(
            x => x["Season"] === season
        );

    }

    if(competition){

        filtered = filtered.filter(
            x => x["Competition"] === competition
        );

    }

    if(opponent){

        filtered = filtered.filter(
            x => x["Opp. Team"] === opponent
        );

    }

    render(filtered);

}

function getResultClass(match){

    if(match.Result === "-:-"){
        return "result-badge result-empty";
    }

    switch(match["Result type"]){

        case "W":
            return "result-badge result-win";

        case "D":
            return "result-badge result-draw";

        case "L":
            return "result-badge result-loss";

        default:
            return "result-badge";
    }

}

function render(matches){

    if(matches.length === 0){

        document.getElementById("matches").innerHTML =
            "<div class='empty'>Žiadne zápasy</div>";

        return;

    }

    let html = `
    <div class="table-wrapper">
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Competition</th>
                        <th>Matchday</th>
                        <th>Opponent</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>
    `;

matches.forEach(match => {

    html += `
    <tr onclick="window.location.href='match.html?id=${match.ID}'">

        <td>
            ${match.Date || ""}
        </td>

        <td>
            ${match.Competition || ""}
        </td>

        <td>
            ${match.Matchday || ""}
        </td>

        <td>
            ${match["Opp. Team"] || ""}
        </td>

        <td class="result-column">
            <span class="${getResultClass(match)}">
                ${match.Result || "-:-"}
            </span>
        </td>

    </tr>
    `;

});
    html += `
                </tbody>
            </table>
        </div>
    </div>
    `;

    document.getElementById("matches").innerHTML =
        html;

}

</script>

</body>
</html>

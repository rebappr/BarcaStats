<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FC Barcelona Matches</title>

    <link rel="icon.png
    <linkicon-16x16.png
    <linkle-touch-icon.png
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --barca-blue:#004D98;
    --barca-red:#A50044;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Roboto',sans-serif;
    background:#f4f6f9;
    color:#1f2937;
    font-size:12px;
}

th{
    font-size:12px;
}

td{
    font-size:12px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.header{
    background:linear-gradient(
        135deg,
        var(--barca-blue),
        var(--barca-red)
    );
    color:white;
    padding:24px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
}

.header h1{
    margin:0;
    font-size:24px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.filter-group{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:180px;
}

.filter-group label{
    font-weight:700;
    font-size:12px;
}

.table-wrapper{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.table-scroll{
    overflow-x:auto;
    overflow-y:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th:nth-child(1),
td:nth-child(1), 
th:nth-child(3),
td:nth-child(3){
    width:1%;
    white-space:nowrap;
    text-align:center;
}

th:nth-child(2),
td:nth-child(2){
    width:1%;
    white*space:nowrap;
}

th:nth-child(4),
td:nth-child(4){
    width:auto;
}

th:nth-child(5),
td:nth-child(5){
    width:1%;
    white-space:nowrap;
    text-align:center;
}
    
th:first-child,
td:first-child{
    padding-left:16px;
}

th,
td{
    padding:8px;
}

th{
    background:var(--barca-blue);
    color:white;
    text-align:left;
    padding:12px;
    position:sticky;
    top:0;
    z-index:10;
}

td{
    padding:8px;
    border-bottom:1px solid #edf2f7;
}

tbody tr:hover{
    background:#dfe9f5;
    cursor: pointer;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    background:#dbeafe;
    color:#1e40af;
    font-weight:600;
}

.result-badge{
    display:inline-block;
    min-width:52px;
    text-align:center;
    border-radius:999px;
    padding:4px 10px;
    font-weight:700;
}

.result-win{
    background:#dcfce7;
    color:#166534;
}

.result-draw{
    background:#fef9c3;
    color:#854d0e;
}

.result-loss{
    background:#fee2e2;
    color:#991b1b;
}

.result-empty{
    background:#f3f4f6;
    color:#6b7280;
}

.empty{
    padding:40px;
    text-align:center;
}

input[list],
select{
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:8px 10px;
    font-family:inherit;
    font-size:12px;
    background:white;
}

@media(max-width:768px){

    .container{
        padding:6px;
    }

    .filters{
        flex-direction:column;
        gap:8px;
        padding:12px;
    }

    .filter-group{
        width:100%;
        min-width:0;
    }

    input[list],
    select,
    .toggle-btn{
        width:100%;
    }

    th,
    td{
        padding:6px 4px;
        font-size:11px;
    }

    th:first-child,
    td:first-child{
        padding-left:12px;
    }

    .result-badge{
        min-width:44px;
        padding:3px 8px;
    }

    .header h1{
        font-size:16px;
    }

    
    table{
    min-width:0;
    }
    
    .header h1{
        font-size:16px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>FC Barcelona</h1>
    </div>

    <div class="filters">

        <div class="filter-group">
            <label for="seasonFilter">Season</label>
            <select id="seasonFilter"></select>
        </div>
        
        <div class="filter-group">
            <label for="competitionFilter">Competition</label>
            <input id="competitionFilter" list="competitionList">
            <datalist id="competitionList"></datalist>
        </div>
        
        <div class="filter-group">
            <label for="opponentFilter">Opponent</label>
            <input id="opponentFilter" list="opponentList">
            <datalist id="opponentList"></datalist>
        </div>
        
    </div>

    <div id="matches">
        Loading...
    </div>

</div>

<script>

let allMatches = [];

function saveFilters(){

    localStorage.setItem(
        "seasonFilter",
        document.getElementById("seasonFilter").value
    );

    localStorage.setItem(
        "competitionFilter",
        document.getElementById("competitionFilter").value
    );

    localStorage.setItem(
        "opponentFilter",
        document.getElementById("opponentFilter").value
    );

}

function loadFilters(){

    document.getElementById("competitionFilter").value =
        localStorage.getItem("competitionFilter") || "";

    document.getElementById("opponentFilter").value =
        localStorage.getItem("opponentFilter") || "";

}

fetch("data.json")
.then(response => response.json())
.then(data => {

if (!Array.isArray(data)) {

    document.getElementById("matches").innerHTML =
        "<div class='empty'>Data sa nepodarilo načítať.</div>";

    console.error("Namiesto poľa prišlo:", data);

    return;
}

allMatches = data;

    console.log("allMatches:", allMatches);
    console.log("isArray:", Array.isArray(allMatches));
    
    createFilters(data);

})
.catch(error => {

    console.error(error);

    document.getElementById("matches").innerHTML =
        "<div class='empty'>Chyba pri načítaní data.json</div>";

});

function updateFilterOptions() {

    const seasonValue =
        document.getElementById("seasonFilter")
            .value.trim();

    const competitionValue =
        document.getElementById("competitionFilter")
            .value.trim();

    const opponentValue =
        document.getElementById("opponentFilter")
            .value.trim();

    let filtered = [...allMatches];

    if (seasonValue) {
        filtered = filtered.filter(
            x => x["Season"] === seasonValue
        );
    }

    if (competitionValue) {
        filtered = filtered.filter(
            x => x["Competition"] === competitionValue
        );
    }

    if (opponentValue) {
        filtered = filtered.filter(
            x => x["Opp. Team"] === opponentValue
        );
    }

    const seasons = [
        ...new Set(
            allMatches
                .map(x => x["Season"])
                .filter(Boolean)
        )
    ];

    const competitions = [
        ...new Set(
            filtered
                .map(x => x["Competition"])
                .filter(Boolean)
        )
    ];

    const opponents = [
        ...new Set(
            filtered
                .map(x => x["Opp. Team"])
                .filter(Boolean)
        )
    ];

    seasons.sort().reverse();
    competitions.sort();
    opponents.sort();

const seasonSelect = document.getElementById("seasonFilter");
const currentSeason = seasonSelect.value;

seasonSelect.innerHTML = "";

// vytvor možnosti sezón
seasons.sort().reverse().forEach(season => {

    const option = document.createElement("option");

    option.value = season;
    option.textContent = season;

    seasonSelect.appendChild(option);

});

// obnov predchádzajúcu hodnotu
if (currentSeason && seasons.includes(currentSeason)) {

    seasonSelect.value = currentSeason;

} else if (seasons.length > 0) {

    seasonSelect.value = seasons[0];

}

document.getElementById("competitionList").innerHTML = "";
document.getElementById("opponentList").innerHTML = "";

    competitions.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        document.getElementById("competitionList")
            .appendChild(option);
    });

    opponents.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        document.getElementById("opponentList")
            .appendChild(option);
    });

}

function createFilters(){

    loadFilters();

    updateFilterOptions();

    const savedSeason =
        localStorage.getItem("seasonFilter");

    const seasonSelect =
        document.getElementById("seasonFilter");

    if(
        savedSeason &&
        [...seasonSelect.options]
            .some(o => o.value === savedSeason)
    ){

        seasonSelect.value = savedSeason;

    }

    document
        .getElementById("seasonFilter")
        .addEventListener("change", applyFilters);

    document
        .getElementById("competitionFilter")
        .addEventListener("input", applyFilters);

    document
        .getElementById("opponentFilter")
        .addEventListener("input", applyFilters);

    applyFilters();

}

function applyFilters(){

    const seasonFilter =
        document.getElementById("seasonFilter");

    if(!seasonFilter.value){

        seasonFilter.value = [...new Set(
            allMatches
                .map(x => x["Season"])
                .filter(Boolean)
        )]
        .sort()
        .reverse()[0];
    }

    let filtered = [...allMatches];

    const season =
        document
            .getElementById("seasonFilter")
            .value
            .trim();

    const competition =
        document
            .getElementById("competitionFilter")
            .value
            .trim();

    const opponent =
        document
            .getElementById("opponentFilter")
            .value
            .trim();

    if(season){

        filtered = filtered.filter(
            x => x["Season"] === season
        );

    }

    if(competition){

        filtered = filtered.filter(
            x => x["Competition"] === competition
        );

    }

    if(opponent){

        filtered = filtered.filter(
            x => x["Opp. Team"] === opponent
        );

    }

    filtered.sort((a, b) =>
        new Date(a.Date.split(".").reverse().join("-")) -
        new Date(b.Date.split(".").reverse().join("-"))
    );

    saveFilters();
    updateFilterOptions();

    render(filtered);

}

function getResultClass(match){

    if(match.Result === "-:-"){
        return "result-badge result-empty";
    }

    switch(match["Result type"]){

        case "W":
            return "result-badge result-win";

        case "D":
            return "result-badge result-draw";

        case "L":
            return "result-badge result-loss";

        default:
            return "result-badge";
    }

}

function render(matches){

    if(matches.length === 0){

        document.getElementById("matches").innerHTML =
            "<div class='empty'>Žiadne zápasy</div>";

        return;

    }

    const grouped = {};

    matches.forEach(match => {

        const competition =
            match.Competition || "Unknown";

        if(!grouped[competition]){
            grouped[competition] = [];
        }

        grouped[competition].push(match);

    });

    let html = "";

    Object.keys(grouped).forEach(competition => {
    
        if (competition === "La Liga") {
    
            grouped[competition].sort((a, b) =>
                Number(a.Matchday || 0) -
                Number(b.Matchday || 0)
            );
    
        } else {
    
            grouped[competition].sort((a, b) =>
                new Date(a.Date.split(".").reverse().join("-")) -
                new Date(b.Date.split(".").reverse().join("-"))
            );
    
        }
    
    });

const competitionOrder = [
    "La Liga",
    "UEFA Champions League"
];

Object.keys(grouped)
    .sort((a, b) => {

        const aIndex = competitionOrder.indexOf(a);
        const bIndex = competitionOrder.indexOf(b);

        if (aIndex !== -1 && bIndex !== -1) {
            return aIndex - bIndex;
        }

        if (aIndex !== -1) {
            return -1;
        }

        if (bIndex !== -1) {
            return 1;
        }

        return a.localeCompare(b);
    })
    .forEach(competition => {

        html += `
        <h2 style="
            margin:20px 0 10px;
            color:var(--barca-blue);
        ">
            ${competition}
        </h2>

        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Matchday</th>
                            <th>Date</th>
                            <th>Venue</th>
                            <th>Opponent</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        grouped[competition].forEach(match => {

            html += `
            <tr onclick="window.location.href='match.html?id=${match.ID}'">

                <td class="matchday-cell">
                    ${match.Matchday || ""}
                </td>
                
                <td>
                    ${match.Date || ""}
                </td>
                
                <td>
                    ${match["Home/Away"] || ""}
                </td>
                
                <td>
                    ${match["Opp. Team"] || ""}
                </td>
                
                <td>
                    <span class="${getResultClass(match)}">
                        ${match.Result || "-:-"}
                    </span>
                </td>

            </tr>
            `;

        });

        html += `
                    </tbody>
                </table>
            </div>
        </div>
        `;

    });

    document.getElementById("matches").innerHTML = html;

}
</script>

</body>
</html>

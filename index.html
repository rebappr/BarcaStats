<h1>Barca Stats</h1>

<select id="competitionFilter">
    <option value="all">Všetky súťaže</option>
</select>

<div id="data"></div>

<script>

let allData = [];

fetch("data.json")
  .then(res => res.json())
  .then(data => {

    // odstránenie prázdnych riadkov
    allData = data.filter(
      row => row["2026/27"] &&
             row["2026/27"] !== "" &&
             row["Season:"] &&
             row["Season:"] !== ""
    );

    // jedinečné súťaže
    const competitions = [
      ...new Set(allData.map(row => row["2026/27"]))
    ];

    const select = document.getElementById("competitionFilter");

    competitions.forEach(comp => {
      const option = document.createElement("option");
      option.value = comp;
      option.textContent = comp;
      select.appendChild(option);
    });

    render(allData);

    select.addEventListener("change", function() {

      const selected = this.value;

      const filtered =
        selected === "all"
        ? allData
        : allData.filter(
            row => row["2026/27"] === selected
          );

      render(filtered);
    });
  });

function render(rows) {

  let html = `
  <table border="1">
    <tr>
      <th>Dátum</th>
      <th>Súťaž</th>
    </tr>
  `;

  rows.forEach(row => {

    html += `
      <tr>
        <td>${row["Season:"]}</td>
        <td>${row["2026/27"]}</td>
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("data").innerHTML = html;
}

</script>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" rel="stylesheet">
<link href="s.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
    
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top left,#004D98 0%,transparent 35%),
    radial-gradient(circle at top right,#A50044 0%,transparent 35%),
    var(--bg);

    color:var(--text);
    min-height:100vh;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.header{
    background:
    linear-gradient(
        135deg,
        rgba(0,77,152,.95),
        rgba(165,0,68,.95)
    );

    padding:24px;
    border-radius:28px;
    color:white;
    margin-bottom:20px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);
}

.header h1{
    margin:0;
    font-size:32px;
}

.hero-subtitle{
    opacity:.85;
    margin-top:8px;
}

.navbar{
    display:flex;
    gap:12px;
    margin-top:20px;
    flex-wrap:wrap;
}

.nav-link{
    text-decoration:none;
    color:white;
    padding:10px 16px;
    border-radius:999px;

    background:
    rgba(255,255,255,.15);

    border:
    1px solid rgba(255,255,255,.2);

    transition:.3s;
}

.nav-link:hover{
    background:
    rgba(255,255,255,.25);
}

.dashboard{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:14px;
}

.left-column,
.right-column{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.widget{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(15px);
    border-radius:24px;
    padding:16px;
}

.widget-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:12px;
}

.match-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.match-main{
    flex:1;
}

.match-main h3{
    margin:0 0 5px;
}

.match-meta{
    color:var(--muted);
    font-size:13px;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.summary-box{
    text-align:center;
    border-radius:18px;
    padding:15px;
    background:var(--meta-bg);
}

.summary-box b{
    display:block;
    font-size:22px;
    margin-bottom:6px;
}

.stats-table{
    width:100%;
    border-collapse:collapse;
}

.stats-table th,
.stats-table td{
    padding:10px;
    border-bottom:1px solid var(--meta-border);
}

.stats-table th{
    text-align:left;
}

.form-list{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.form-win,
.form-draw,
.form-loss{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-weight:700;
}

.form-win{
    background:#22c55e;
    color:white;
}

.form-draw{
    background:#f59e0b;
    color:white;
}

.form-loss{
    background:#ef4444;
    color:white;
}

.btn{
    display:inline-block;

    background:
    linear-gradient(
        135deg,
        #004D98,
        #A50044
    );

    color:white;
    text-decoration:none;

    padding:10px 16px;
    border-radius:16px;
    margin-top:10px;
}

.theme-toggle{
    position:fixed;
    bottom:20px;
    left:20px;

    width:52px;
    height:52px;

    border:none;
    border-radius:50%;

    cursor:pointer;

    background:#A50044;
    color:white;

    font-size:20px;

    z-index:9999;
}

@media(max-width:900px){

.dashboard{
    grid-template-columns:1fr;
}

.summary-grid{
    grid-template-columns:repeat(2,1fr);
}

.header h1{
    font-size:24px;
}

}

</style>
</head>
<body>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

<div class="container">

    <div class="header">

        <h1>FC Barcelona</h1>

        <div class="hero-subtitle">
            Statistics & Historical Database
        </div>

        <div class="navbar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="seasons.html" class="nav-link">Seasons</a>
            <a href="matches.html" class="nav-link">Matches</a>
            <a href="players.html" class="nav-link">Players</a>
        </div>

    </div>

    <div class="dashboard">

        <div class="left-column">

            <div class="widget">
                <div class="widget-title">
                    Last Match
                </div>

                <div id="lastMatch">
                    Loading...
                </div>
            </div>

            <div class="widget">
                <div class="widget-title">
                    Next Match
                </div>

                <div id="nextMatch">
                    Loading...
                </div>
            </div>

            <div class="widget">

                <div class="widget-title">
                    Current Season
                </div>

                <div id="seasonSummary">
                    Loading...
                </div>

            </div>

        </div>

        <div class="right-column">

            <div class="widget">

                <div class="widget-title">
                    Top Scorers
                </div>

                <div id="topScorers">
                    Loading...
                </div>

            </div>

            <div class="widget">

                <div class="widget-title">
                    Top Assists
                </div>

                <div id="topAssists">
                    Loading...
                </div>

            </div>

            <div class="widget">

                <div class="widget-title">
                    Recent Form
                </div>

                <div id="recentForm">
                    Loading...
                </div>

            </div>

        </div>

    </div>

</div>

<script>

let allMatches=[];

fetch("data.json")
.then(r=>r.json())
.then(data=>{

    allMatches=data;

    renderHome();

});

function renderHome(){

    renderLastMatch();
    renderNextMatch();
    renderCurrentSeason();
    renderTopScorers();
    renderTopAssists();
    renderRecentForm();

}

function parseDate(date){

    return new Date(
        date.split(".")
        .reverse()
        .join("-")
    );

}

function renderLastMatch(){

    const played=allMatches
    .filter(m=>parseDate(m.Date)<=new Date())
    .sort((a,b)=>
        parseDate(b.Date)-parseDate(a.Date)
    );

    const match=played[0];

    if(!match)return;

    document.getElementById("lastMatch").innerHTML=`

        <div class="match-card">

            <div class="match-main">

                <h3>
                    FC Barcelona ${match.Result}
                </h3>

                <div>
                    vs ${match["Opp. Team"]}
                </div>

                <div class="match-meta">
                    ${match.Date} • ${match.Competition}
                </div>

            </div>

        </div>

    `;
}

function renderNextMatch(){

    const next=allMatches
    .filter(m=>parseDate(m.Date)>new Date())
    .sort((a,b)=>
        parseDate(a.Date)-parseDate(b.Date)
    )[0];

    if(!next){

        document.getElementById("nextMatch").innerHTML=
        "No upcoming matches";

        return;
    }

    document.getElementById("nextMatch").innerHTML=`

        <h3>
            FC Barcelona vs
            ${next["Opp. Team"]}
        </h3>

        <div class="match-meta">
            ${next.Date} • ${next.Competition}
        </div>

    `;
}

function renderCurrentSeason(){

    const season=[...new Set(
        allMatches.map(m=>m.Season)
    )]
    .sort()
    .reverse()[0];

    const seasonMatches=
    allMatches.filter(
        m=>m.Season===season
    );

    const wins=
    seasonMatches.filter(
        m=>m["Result type"]==="W"
    ).length;

    const draws=
    seasonMatches.filter(
        m=>m["Result type"]==="D"
    ).length;

    const losses=
    seasonMatches.filter(
        m=>m["Result type"]==="L"
    ).length;

    document.getElementById("seasonSummary").innerHTML=`

        <h3>${season}</h3>

        <div class="summary-grid">

            <div class="summary-box">
                <b>${seasonMatches.length}</b>
                Matches
            </div>

            <div class="summary-box">
                <b>${wins}</b>
                Wins
            </div>

            <div class="summary-box">
                <b>${draws}</b>
                Draws
            </div>

            <div class="summary-box">
                <b>${losses}</b>
                Losses
            </div>

        </div>

        <a
            href="season.html?season=${season}"
            class="btn"
        >
            View Season
        </a>

    `;
}

function renderTopScorers(){

    const stats={};

    allMatches.forEach(match=>{

        for(let i=1;i<=12;i++){

            const player=
            match[`Goal Player ${i}`];

            if(!player) continue;
            if(player.includes("(OG)")) continue;

            stats[player]=(stats[player]||0)+1;
        }

    });

    const top=
    Object.entries(stats)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

    let html="<table class='stats-table'>";

    top.forEach(row=>{

        html+=`
        <tr>
            <td>${row[0]}</td>
            <td>${row[1]}</td>
        </tr>
        `;
    });

    html+="</table>";

    document.getElementById(
        "topScorers"
    ).innerHTML=html;
}

function renderTopAssists(){

    const stats={};

    allMatches.forEach(match=>{

        for(let i=1;i<=12;i++){

            const player=
            match[`Assist Player ${i}`];

            if(!player) continue;

            stats[player]=(stats[player]||0)+1;
        }

    });

    const top=
    Object.entries(stats)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

    let html="<table class='stats-table'>";

    top.forEach(row=>{

        html+=`
        <tr>
            <td>${row[0]}</td>
            <td>${row[1]}</td>
        </tr>
        `;
    });

    html+="</table>";

    document.getElementById(
        "topAssists"
    ).innerHTML=html;
}

function renderRecentForm(){

    const matches=allMatches
    .filter(m=>m["Result type"])
    .sort((a,b)=>
        parseDate(b.Date)-parseDate(a.Date)
    )
    .slice(0,5);

    let html="<div class='form-list'>";

    matches.forEach(match=>{

        if(match["Result type"]==="W"){
            html+=`<div class="form-win">W</div>`;
        }

        if(match["Result type"]==="D"){
            html+=`<div class="form-draw">D</div>`;
        }

        if(match["Result type"]==="L"){
            html+=`<div class="form-loss">L</div>`;
        }

    });

    html+="</div>";

    document.getElementById(
        "recentForm"
    ).innerHTML=html;
}

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

button.textContent =
theme === "dark"
? "☀️"
: "🌙";

button.addEventListener("click", () => {

const current =
document.documentElement.getAttribute("data-theme");

const next =
current === "dark"
? "light"
: "dark";

document.documentElement.setAttribute(
"data-theme",
next
);

localStorage.setItem(
"theme",
next
);

button.textContent =
next === "dark"
? "☀️"
: "🌙";

});

})();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Barcelona</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --barca-blue:#004D98;
    --barca-red:#A50044;
}

*{
    box-sizing:border-box;
}

body{
    font-family:'Roboto',sans-serif;
    font-size:12px;
    margin:0;
    background:#f4f6f9;
    color:#1f2937;
}

.container{
    width:fit-content;
    max-width:100%;
    margin:auto;
    padding:20px;
}

.header{
    background:linear-gradient(
        135deg,
        var(--barca-blue),
        var(--barca-red)
    );
    color:white;
    padding:24px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header h1{
    margin:0;
    font-size:32px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.filter-group{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:140px;
}

label{
    font-weight:600;
}

input[list]{
    width:100%;
    max-width:220px;

    border:1px solid #d1d5db;
    border-radius:8px;
    padding:8px 12px;

    font-size:12px;
    font-family:'Roboto',sans-serif;

    background:white;
}

.table-wrapper{
    display:inline-block;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.table-scroll{
    max-height:800px;
    overflow-y:auto;
    overflow-x:auto;
}

table{
    width:auto;
    border-collapse:collapse;
    table-layout:auto;
}

thead th:first-child{
    border-top-left-radius:12px;
}

thead th:last-child{
    border-top-right-radius:12px;
}

th{
    padding:8px 10px;
    position:sticky;
    top:0;
    z-index:100;
    background:var(--barca-blue);
    color:white;
    white-space:nowrap;
}

td{
    padding:6px 8px;
    border-bottom:1px solid #edf2f7;
    white-space:nowrap;
}

tr:hover{
    background:#f8fafc;
}

.badge{
    display:inline-block;
    padding:2px 6px;
    border-radius:999px;
    background:#e0e7ff;
    color:#3730a3;
    font-weight:600;
}

.result-badge{
    padding:4px 8px;
    border-radius:999px;
    font-weight:600;
    display:inline-block;
    min-width:45px;
    text-align:center;
}

.result-win{
    background:#dcfce7;
    color:#166534;
}

.result-draw{
    background:#fef9c3;
    color:#854d0e;
}

.result-loss{
    background:#fee2e2;
    color:#991b1b;
}

.competition-cell,
.opponent-cell{
    width:1%;
}

.empty{
    padding:20px;
    text-align:center;
}

@media (max-width:768px){

    .container{
        padding:10px;
    }

    .header h1{
        font-size:24px;
    }

    .filters{
        flex-direction:column;
        width:100%;
    }

    .filter-group{
        width:100%;
        min-width:0;
    }

    input[list]{
        width:100%;
        max-width:none;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>FC Barcelona</h1>
    </div>

    <div class="filters">

        <div class="filter-group">
            <label for="seasonFilter">Season</label>
            <input id="seasonFilter" list="seasonList">
            <datalist id="seasonList"></datalist>
        </div>

        <div class="filter-group">
            <label for="competitionFilter">Competition</label>
            <input id="competitionFilter" list="competitionList">
            <datalist id="competitionList"></datalist>
        </div>

        <div class="filter-group">
            <label for="opponentFilter">Opponent</label>
            <input id="opponentFilter" list="opponentList">
            <datalist id="opponentList"></datalist>
        </div>

    </div>

    <div id="matches">
        Načítavam...
    </div>

</div>

<script>

let allMatches = [];

fetch("data.json")
.then(response => response.json())
.then(data => {

    allMatches = data;

    createFilters(data);

})
.catch(error => {

    console.error(error);

    document.getElementById("matches").innerHTML =
        "<div class='empty'>Chyba pri načítaní data.json</div>";

});

function createFilters(data){

    const seasonFilter =
        document.getElementById("seasonFilter");

    const competitionFilter =
        document.getElementById("competitionFilter");

    const opponentFilter =
        document.getElementById("opponentFilter");

    const seasonList =
        document.getElementById("seasonList");

    const competitionList =
        document.getElementById("competitionList");

    const opponentList =
        document.getElementById("opponentList");

    const seasons = [
        ...new Set(
            data.map(row => row["Season"])
            .filter(Boolean)
        )
    ];

    seasons.sort().reverse();

    seasons.forEach(season => {

        const option =
            document.createElement("option");

        option.value = season;

        seasonList.appendChild(option);

    });

    const competitions = [
        ...new Set(
            data.map(row => row["Competition"])
            .filter(Boolean)
        )
    ];

    competitions.sort();

    competitions.forEach(comp => {

        const option =
            document.createElement("option");

        option.value = comp;

        competitionList.appendChild(option);

    });

    const opponents = [
        ...new Set(
            data.map(match => {

                const home =
                    match["Home team"] || "";

                const away =
                    match["Away team"] || "";

                return home
                    .toLowerCase()
                    .includes("barcelona")
                    ? away
                    : home;

            }).filter(Boolean)
        )
    ];

    opponents.sort();

    opponents.forEach(opponent => {

        const option =
            document.createElement("option");

        option.value = opponent;

        opponentList.appendChild(option);

    });

    seasonFilter.addEventListener(
        "input",
        applyFilters
    );

    competitionFilter.addEventListener(
        "input",
        applyFilters
    );

    opponentFilter.addEventListener(
        "input",
        applyFilters
    );

    applyFilters();
}

function applyFilters(){

    const season =
        document.getElementById("seasonFilter")
        .value.trim();

    const competition =
        document.getElementById("competitionFilter")
        .value.trim();

    const opponent =
        document.getElementById("opponentFilter")
        .value.trim();

    let filtered = [...allMatches];

    if(season !== ""){

        filtered = filtered.filter(
            row => row["Season"] === season
        );

    }

    if(competition !== ""){

        filtered = filtered.filter(
            row => row["Competition"] === competition
        );

    }

    if(opponent !== ""){

        filtered = filtered.filter(match => {

            const home =
                match["Home team"] || "";

            const away =
                match["Away team"] || "";

            const currentOpponent =
                home.toLowerCase().includes("barcelona")
                    ? away
                    : home;

            return currentOpponent === opponent;

        });

    }

    render(filtered);

}

function getResultClass(match){

    const result = match["Result"] || "";

    if(
        result === "" ||
        result === "-:-" ||
        !result.includes(":")
    ){
        return "";
    }

    const parts = result.split(":");

    const homeGoals = parseInt(parts[0]);
    const awayGoals = parseInt(parts[1]);

    if(isNaN(homeGoals) || isNaN(awayGoals)){
        return "";
    }

    const isBarcaHome =
        (match["Home team"] || "")
        .toLowerCase()
        .includes("barcelona");

    const barcaGoals =
        isBarcaHome ? homeGoals : awayGoals;

    const opponentGoals =
        isBarcaHome ? awayGoals : homeGoals;

    if(barcaGoals > opponentGoals){
        return "result-badge result-win";
    }

    if(barcaGoals < opponentGoals){
        return "result-badge result-loss";
    }

    return "result-badge result-draw";
}

function render(matches){

    if(matches.length === 0){

        document.getElementById("matches").innerHTML =
            "<div class='empty'>Žiadne zápasy</div>";

        return;
    }

    let html = `
    <div class="table-wrapper">
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Season</th>
                        <th>Date</th>
                        <th>Competition</th>
                        <th>Opponent</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>
    `;

    matches.forEach(match => {

        const home =
            match["Home team"] || "";

        const away =
            match["Away team"] || "";

        const opponent =
            home.toLowerCase().includes("barcelona")
                ? away
                : home;

        html += `
            <tr>
                <td>${match["Season"] || ""}</td>

                <td>${match["Date"] || ""}</td>

                <td class="competition-cell">
                    <span class="badge">
                        ${match["Competition"] || ""}
                    </span>
                </td>

                <td class="opponent-cell">
                    ${opponent}
                </td>

                <td>
                    ${
                        match["Result"] === "-:-"
                        ? ""
                        : `<span class="${getResultClass(match)}">
                            ${match["Result"]}
                           </span>`
                    }
                </td>
            </tr>
        `;

    });

    html += `
                </tbody>
            </table>
        </div>
    </div>
    `;

    document.getElementById("matches").innerHTML =
        html;
}

</script>

</body>
</html>

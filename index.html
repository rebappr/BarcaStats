<html lang="sk">
<head>
<meta charset="UTF-8">

<body>

<h1>Barca Stats</h1>

<label for="competitionFilter">Súťaž:</label>

<select id="competitionFilter">
    <option value="all">Všetky súťaže</option>
</select>

<div id="matches">Načítavam...</div>

<script>

let allMatches = [];

fetch("data.json")
.then(response => response.json())
.then(data => {

    console.log("Prvý záznam:");
    console.log(data[0]);

    allMatches = data;

    const competitions = [...new Set(
        data
            .map(row => row["Competition"])
            .filter(Boolean)
    )];

    competitions.sort();

    const select =
        document.getElementById("competitionFilter");

    competitions.forEach(comp => {

        const option =
            document.createElement("option");

        option.value = comp;
        option.textContent = comp;

        select.appendChild(option);

    });

    render(data);

    select.addEventListener("change", function(){

        const value = this.value;

        if(value === "all"){

            render(allMatches);

        }else{

            render(
                allMatches.filter(
                    row => row["Competition"] === value
                )
            );

        }

    });

})
.catch(error => {

    console.error(error);

    document.getElementById("matches")
        .innerHTML =
        "<b>Chyba pri načítaní data.json</b>";

});

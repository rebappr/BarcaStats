<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FC Barcelona Matches</title>

    <link rel="icon.png
    <linkicon-16x16.png
    <linkle-touch-icon.png
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapismily=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --barca-blue:#004D98;
    --barca-red:#A50044;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top left,#004D98 0%,transparent 35%),
        radial-gradient(circle at top right,#A50044 0%,transparent 35%),
        #0f172a;

    color:#ffffff;
    font-size:12px;
    min-height:100vh;
}

.content-layout{
    display:flex;
    gap:6px;
    align-items:flex-start;
}

.left-panel{
    flex:1;
    min-width:0;
}

.right-panel{
    flex:1;
    min-width:0;
}

.section-title{
    margin:0 0 12px;
    padding:16px 20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    color:white;
    font-size:22px;
    font-weight:800;
}

.competition-title{
    margin:20px 0 10px;
    padding:12px 18px;
    background:
        linear-gradient(
            135deg,
            rgba(0,77,152,.95),
            rgba(165,0,68,.95)
        );
    color:white;
    font-size:14px;
    font-weight:700;
    border-radius:18px;
    letter-spacing:.5px;
    box-shadow:
        0 10px 25px rgba(0,0,0,.25);
}

.widget-card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    padding:22px;
    margin-bottom:20px;
    transition:.3s;
}

.widget-card:hover{
    transform:translateY(-4px);
    box-shadow:
        0 20px 40px rgba(0,0,0,.25);
}

.widget-card h2{
    margin-top:0;
    font-size:18px;
    color:white;
}

th{
    font-size:12px;
}

td{
    font-size:12px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.header{
    display:inline-block;
    width:auto;
    min-width:500px;
    padding:32px 42px;
}

.header::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at top right,
            rgba(255,255,255,.25),
            transparent 40%
        );
}

.hero-subtitle{
    margin-top:10px;
    opacity:.85;
    font-size:14px;
}

.header h1{
    margin:0;
    font-size:34px;
    font-weight:800;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    padding:20px;
    border-radius:24px;
    margin-bottom:20px;
}

.filter-group{
    flex:1 1 0;
    min-width:200px;
}

.filter-group label{
    font-weight:700;
    font-size:12px;
}

.table-wrapper{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    overflow:hidden;
    transition:.3s;
}

.table-wrapper:hover{
    transform:translateY(-3px);
}

.table-scroll{
    overflow-x:auto;
    overflow-y:visible;
}

table{
    width:100%;
    border-collapse:collapse;
}

th:nth-child(1),
td:nth-child(1){
    width:60px;
    text-align:center;
}

th:nth-child(2),
td:nth-child(2){
    width:100px;
}

th:nth-child(3),
td:nth-child(3){
    width:50px;
    text-align:center;
}

th:nth-child(4),
td:nth-child(4){
    width:auto;
}

th:nth-child(5),
td:nth-child(5){
    width:90px;
    text-align:center;
}
    
th:first-child,
td:first-child{
    padding-left:16px;
}
    
th:last-child,
td:last-child{
    padding-right:16px;
}

th,
td{
    padding:8px;
}

th{
    background:rgba(255,255,255,.06);
    color:#94a3b8;
    text-align:left;
    padding:12px;
    position:sticky;
    top:0;
    z-index:10;
}

td{
    padding:8px;
    border-bottom:1px solid #edf2f7;
}

tbody tr{
    transition:.25s;
}

tbody tr:hover{
    background:rgba(255,255,255,.06);
    cursor:pointer;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    background:#dbeafe;
    color:#1e40af;
    font-weight:600;
}

.result-badge{
    display:inline-block;
    min-width:52px;
    text-align:center;
    border-radius:999px;
    padding:4px 10px;
    font-weight:700;
}

.result-win{
    background:rgba(34,197,94,.15);
    border:1px solid rgba(34,197,94,.35);
    color:#4ade80;
}

.result-draw{
    background:rgba(250,204,21,.15);
    border:1px solid rgba(250,204,21,.35);
    color:#fde047;
}

.result-loss{
    background:rgba(239,68,68,.15);
    border:1px solid rgba(239,68,68,.35);
    color:#f87171;
}

.result-empty{
    background:rgba(255,255,255,.08);
    color:#94a3b8;
}

.empty{
    padding:40px;
    text-align:center;
}

input[list],
select{
    width:100%;
    height:46px;4
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    color:white;
    padding:0 14px;
    transition:.25s;
    font-size:13px;
}

input:hover,
select:hover{
    background:rgba(255,255,255,.15);
}

input:focus,
select:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:
        0 0 0 3px rgba(59,130,246,.25);
}

select option{
    background:#001845;
    color:#ffffff;
}

input[list]:focus,
select:focus{
    outline:none;
    outline:none;
    box-shadow:0 0 0 3px rgba(59,130,246,.35);
    }

@media(max-width:768px){

    .content-layout{
        flex-direction:column;
    }

    .left-panel,
    .right-panel{
        width:100%;
    }
    .container{
        padding:6px;
    }

    .filters{
        flex-direction:column;
        gap:8px;
        padding:12px;
    }

    .filter-group{
        width:100%;
        min-width:0;
    }

    input[list],
    select,
    .toggle-btn{
        width:100%;
    }

    th,
    td{
        padding:6px 4px;
        font-size:11px;
    }

    th:first-child,
    td:first-child{
        padding-left:12px;
    }

    .result-badge{
        min-width:44px;
        padding:3px 8px;
    }

    .header h1{
        font-size:16px;
    }

    
    table{
    min-width:0;
    }
    
    .header h1{
        font-size:16px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">
    
        <h1>FC Barcelona</h1>
    
        <p class="hero-subtitle">
            Matches • Results • Statistics
        </p>
    
    </div>

    <div class="filters">

        <div class="filter-group">
            <label for="seasonFilter">Season</label>
            <select id="seasonFilter"></select>
        </div>
        
        <div class="filter-group">
            <label for="competitionFilter">Competition</label>
            <select id="competitionFilter"></select>
        </div>
        
        <div class="filter-group">
            <label for="opponentFilter">Opponent</label>
            <select id="opponentFilter"></select>
        </div>

        
    </div>

<div class="content-layout">

    <div class="left-panel">
    
        <h2 class="section-title">Matches</h2>
    
        <div id="matches">
            Loading...
        </div>
    
    </div>

    <div class="right-panel">

        <div class="widget-card">
            <h2>La Liga Table</h2>
            <div id="laligaTable">
                Loading...
            </div>
        </div>

        <div class="widget-card">
            <h2>Statistics</h2>
            <div id="statistics">
                Loading...
            </div>
        </div>

    </div>

</div>

</div>

<script>

let allMatches = [];

function saveFilters(){

    localStorage.setItem(
        "seasonFilter",
        document.getElementById("seasonFilter").value
    );

    localStorage.setItem(
        "competitionFilter",
        document.getElementById("competitionFilter").value
    );

    localStorage.setItem(
        "opponentFilter",
        document.getElementById("opponentFilter").value
    );

}

function loadFilters(){

    document.getElementById("seasonFilter").value =
        localStorage.getItem("seasonFilter") || "";

    document.getElementById("competitionFilter").value =
        localStorage.getItem("competitionFilter") || "";

    document.getElementById("opponentFilter").value =
        localStorage.getItem("opponentFilter") || "";

}

fetch("data.json")
.then(response => response.json())
.then(data => {

if (!Array.isArray(data)) {

    document.getElementById("matches").innerHTML =
        "<div class='empty'>Data sa nepodarilo načítať.</div>";

    console.error("Namiesto poľa prišlo:", data);

    return;
}

    allMatches = data;

    renderLaLigaTable();
    renderStatistics();

    createFilters();

})
.catch(error => {

    console.error(error);

    document.getElementById("matches").innerHTML =
        "<div class='empty'>Chyba pri načítaní data.json</div>";

});

function updateFilterOptions() {

    const seasonValue =
        document.getElementById("seasonFilter").value.trim();

    let seasonFiltered = [...allMatches];

    if (seasonValue) {

        seasonFiltered = seasonFiltered.filter(
            x => x["Season"] === seasonValue
        );

    }

    const seasons = [
        ...new Set(
            allMatches
                .map(x => x["Season"])
                .filter(Boolean)
        )
    ].sort().reverse();

    const competitions = [
        ...new Set(
            seasonFiltered
                .map(x => x["Competition"])
                .filter(Boolean)
        )
    ].sort();

    const opponents = [
        ...new Set(
            seasonFiltered
                .map(x => x["Opp. Team"])
                .filter(Boolean)
        )
    ].sort();

    // Season
    const seasonSelect =
        document.getElementById("seasonFilter");

    const currentSeason =
        seasonSelect.value;

    seasonSelect.innerHTML = "";

    seasons.forEach(season => {

        const option =
            document.createElement("option");

        option.value = season;
        option.textContent = season;

        seasonSelect.appendChild(option);

    });

    if (seasons.includes(currentSeason)) {
        seasonSelect.value = currentSeason;
    }

    // Competition
    const competitionSelect =
        document.getElementById("competitionFilter");

    const currentCompetition =
        competitionSelect.value;

    competitionSelect.innerHTML =
        '<option value="">All competitions</option>';

    competitions.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        competitionSelect.appendChild(option);

    });

    if (competitions.includes(currentCompetition)) {
        competitionSelect.value = currentCompetition;
    }

    // Opponent
    const opponentSelect =
        document.getElementById("opponentFilter");

    const currentOpponent =
        opponentSelect.value;

    opponentSelect.innerHTML =
        '<option value="">All opponents</option>';

    opponents.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        opponentSelect.appendChild(option);

    });

    if (opponents.includes(currentOpponent)) {
        opponentSelect.value = currentOpponent;
    }

}

function createFilters(){

    loadFilters();

    updateFilterOptions();

    const savedSeason =
        localStorage.getItem("seasonFilter");

    const seasonSelect =
        document.getElementById("seasonFilter");

    if(
        savedSeason &&
        [...seasonSelect.options]
            .some(o => o.value === savedSeason)
    ){

        seasonSelect.value = savedSeason;

    }

    document
        .getElementById("seasonFilter")
        .addEventListener("change", applyFilters);

    document
        .getElementById("competitionFilter")
        .addEventListener("change", applyFilters);

    document
        .getElementById("opponentFilter")
        .addEventListener("change", applyFilters);

    applyFilters();

}

function applyFilters(){

    const seasonFilter =
        document.getElementById("seasonFilter");

    if(!seasonFilter.value){

        seasonFilter.value = [...new Set(
            allMatches
                .map(x => x["Season"])
                .filter(Boolean)
        )]
        .sort()
        .reverse()[0];
    }

    let filtered = [...allMatches];

    const season =
        document
            .getElementById("seasonFilter")
            .value
            .trim();

    const competition =
        document
            .getElementById("competitionFilter")
            .value
            .trim();

    const opponent =
        document
            .getElementById("opponentFilter")
            .value
            .trim();

    if(season){

        filtered = filtered.filter(
            x => x["Season"] === season
        );

    }

    if(competition){

        filtered = filtered.filter(
            x => x["Competition"] === competition
        );

    }

    if(opponent){

        filtered = filtered.filter(
            x => x["Opp. Team"] === opponent
        );

    }

    filtered.sort((a, b) =>
        new Date(a.Date.split(".").reverse().join("-")) -
        new Date(b.Date.split(".").reverse().join("-"))
    );

    saveFilters();
    updateFilterOptions();

    render(filtered);

}

function getResultClass(match){

    if(match.Result === "-:-"){
        return "result-badge result-empty";
    }

    switch(match["Result type"]){

        case "W":
            return "result-badge result-win";

        case "D":
            return "result-badge result-draw";

        case "L":
            return "result-badge result-loss";

        default:
            return "result-badge";
    }

}

function render(matches){

    if(matches.length === 0){

        document.getElementById("matches").innerHTML =
            "<div class='empty'>Žiadne zápasy</div>";

        return;

    }

    const grouped = {};

    matches.forEach(match => {

        const competition =
            match.Competition || "Unknown";

        if(!grouped[competition]){
            grouped[competition] = [];
        }

        grouped[competition].push(match);

    });

    let html = "";

    Object.keys(grouped).forEach(competition => {
    
        if (competition === "La Liga") {
    
            grouped[competition].sort((a, b) =>
                Number(a.Matchday || 0) -
                Number(b.Matchday || 0)
            );
    
        } else {
    
            grouped[competition].sort((a, b) =>
                new Date(a.Date.split(".").reverse().join("-")) -
                new Date(b.Date.split(".").reverse().join("-"))
            );
    
        }
    
    });

const competitionOrder = [
    "La Liga",
    "UEFA Champions League"
];

Object.keys(grouped)
    .sort((a, b) => {

        const aIndex = competitionOrder.indexOf(a);
        const bIndex = competitionOrder.indexOf(b);

        if (aIndex !== -1 && bIndex !== -1) {
            return aIndex - bIndex;
        }

        if (aIndex !== -1) {
            return -1;
        }

        if (bIndex !== -1) {
            return 1;
        }

        return a.localeCompare(b);
    })
    .forEach(competition => {

        html += `
        <div class="competition-title">
            ${competition}
        </div>
        `;

        html += `
        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                           <th>Matchday</th>
                            <th>Date</th>
                            <th>Venue</th>
                            <th>Opponent</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody>
        `

        grouped[competition].forEach(match => {

            html += `
            <tr onclick="window.location.href='match.html?id=${match.ID}'">

                <td class="matchday-cell">
                    ${match.Matchday || ""}
                </td>
                
                <td>
                    ${match.Date || ""}
                </td>
                
                <td>
                    ${match["Home/Away"] === "Home" ? "H" : "A"}
                </td>
                
                <td>
                    ${match["Opp. Team"] || ""}
                </td>
                
                <td>
                    <span class="${getResultClass(match)}">
                        ${match.Result || "-:-"}
                    </span>
                </td>

            </tr>
            `;

        });

        html += `
                    </tbody>
                </table>
            </div>
        </div>
        `;

    });

    document.getElementById("matches").innerHTML = html;

}

function renderLaLigaTable() {

    document.getElementById("laligaTable").innerHTML = `
        <p>La Liga table will be displayed here.</p>
    `;

}

function renderStatistics() {

    document.getElementById("statistics").innerHTML = `
        <p>Season statistics will be displayed here.</p>
    `;

}
</script>

</body>
</html>

<h1>Barca Stats</h1>

<label for="competitionFilter">Súťaž:</label>
<select id="competitionFilter">
    <option value="all">Všetky súťaže</option>
</select>

<div id="data"></div>

<script>
let allData = [];

fetch("./data.json")
  .then(response => response.json())
  .then(data => {

    allData = data;

    // Získanie unikátnych súťaží
    const competitions = [...new Set(
      data
        .map(row => row.Competition)
        .filter(value => value && value.trim() !== "")
    )];

    competitions.sort();

    const select = document.getElementById("competitionFilter");

    competitions.forEach(comp => {
      const option = document.createElement("option");
      option.value = comp;
      option.textContent = comp;
      select.appendChild(option);
    });

    renderTable(data);

    select.addEventListener("change", () => {

      const selected = select.value;

      const filtered = selected === "all"
        ? allData
        : allData.filter(row => row.Competition === selected);

      renderTable(filtered);

    });

  });

function renderTable(data) {

  let html = `
    <table border="1" cellpadding="5">
      <tr>
        <th>Dátum</th>
        <th>Súťaž</th>
        <th>Súper</th>
        <th>Výsledok</th>
      </tr>
  `;

  data.forEach(match => {

    html += `
      <tr>
        <td>${match.Date || ""}</td>
        <td>${match.Competition || ""}</td>
        <td>${match.Opponent || ""}</td>
        <td>${match.Result || ""}</td>
      </tr>
    `;

  });

  html += "</table>";

  document.getElementById("data").innerHTML = html;
}
</script>

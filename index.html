<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Barca Stats</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #004D98;
            color: white;
        }

        select {
            padding: 8px;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

<h1>Barca Stats</h1>

<label>Súťaž:</label>

<select id="competitionFilter">
    <option value="all">Všetky súťaže</option>
</select>

<div id="matches"></div>

<script>

let allMatches = [];

fetch("./data.json")
    .then(response => response.json())
    .then(data => {

        allMatches = data;

        createCompetitionFilter(data);

        renderMatches(data);

    });

function createCompetitionFilter(data) {

    const competitions = [
        ...new Set(
            data.map(match => match.Competition)
        )
    ];

    const select =
        document.getElementById("competitionFilter");

    competitions.sort();

    competitions.forEach(competition => {

        const option =
            document.createElement("option");

        option.value = competition;
        option.textContent = competition;

        select.appendChild(option);

    });

    select.addEventListener("change", filterMatches);

}

function filterMatches() {

    const selectedCompetition =
        document.getElementById("competitionFilter").value;

    if (selectedCompetition === "all") {

        renderMatches(allMatches);

        return;
    }

    const filteredMatches =
        allMatches.filter(match =>
            match.Competition === selectedCompetition
        );

    renderMatches(filteredMatches);

}

function renderMatches(matches) {

    let html = `
        <table>
            <tr>
                <th>Date</th>
                <th>Competition</th>
                <th>Home team</th>
                <th>Away team</th>
                <th>Result</th>
            </tr>
    `;

    matches.forEach(match => {

        html += `
        <tr>
            <td>${match.Date}</td>
            <td>${match.Competition}</td>
            <td>${match["Home team"]}</td>
            <td>${match["Away team"]}</td>
            <td>${match.Result}</td>
        </tr>
        `;

    });

    html += "</table>";

    document.getElementById("matches").innerHTML = html;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<title>Manager Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/theme.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;

background: var(--bg);

color:var(--text);
min-height:100vh;
-webkit-text-size-adjust: 100%;
}

.content-layout{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.left-panel{
flex:1.1;
min-width:0;
}

.right-panel{
flex:.9;
min-width:0;
}

.theme-toggle{
position:fixed;
bottom:20px;
left:20px;

width:52px;
height:52px;

border:none;
border-radius:50%;

cursor:pointer;

background:#A50044;
color:white;

font-size:20px;
font-weight:700;

z-index:9999;
display:none;
}

.container{
max-width:1500px;
margin:auto;
padding:10px;
}

.header{
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

padding:24px;
border-radius:28px;
color:white;
margin-bottom:10px;
}

.header h1{
margin:0;
font-size:22px;
font-weight:700;
}

.hero-subtitle{
margin-top:8px;
font-size:16px;
font-weight:500;
color:rgba(255,255,255,.85);
}

.manager-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:20px;
display:flex;
align-items:center;
gap:20px;
margin-bottom:10px;
}

.manager-photo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #004D98;

}

.manager-info h1{
margin:0;
font-size:22px;
}

.manager-meta{
margin-top:12px;

display:flex;
flex-direction:column;
align-items:flex-start;

gap:6px;

font-size:14px;
color:var(--muted);
}

.manager-meta div{
white-space:normal;
display:block;
width:100%;
}

.manager-meta a{
font-weight:600;
text-decoration:none;
color:var(--link-color);
}

.manager-meta a:hover{
text-decoration:underline;
}

.widget-title{
    margin:8px 0 6px;
    padding:8px 14px;

    background:linear-gradient(
        135deg,
        rgba(0,77,152,.95),
        rgba(165,0,68,.95)
    );

    color:white;

    font-size:14px;
    font-weight:700;
    text-transform:uppercase;

    border-radius:18px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.summary-box{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:18px;
padding:12px;
text-align:center;
}

.summary-box b{
display:block;
font-size:26px;
margin-bottom:4px;
}

.widget-card{

border:1px solid var(--card-border);
border-radius:24px;
padding:14px;
}

.stats-table{
width:100%;
border-collapse:collapse;
}

.stats-table th,
.stats-table td{
padding:8px;
border-bottom:1px solid var(--meta-border);
font-size:13px;
}

.stats-table th{
text-align:left;
}

.season-link{
cursor:pointer;
font-weight:700;
color:#004D98;
}

.season-link:hover{
text-decoration:underline;
}

.season-row{
transition:.2s;
}

.season-row:hover{

}

.opponent-season{
    background:#fff8c4;
    transition:.2s;
}

.opponent-season:hover{
    background:#fff2a3;
}

[data-theme="dark"] .opponent-season{
    background:#5b5420;
}

[data-theme="dark"] .opponent-season:hover{
    background:#746923;
}

.opponent-career .summary-box{
    background:#fff8c4;
    border:1px solid #eab308;
    color:#000;
}

.opponent-career .summary-box b{
    color:#92400e;
}

[data-theme="dark"] .opponent-career .summary-box{
    background:#5b5420;
    border:1px solid #eab308;
    color:#fff;
}

    color:#fde68a;
}

.stats-table th:first-child,
.stats-table td:first-child{

}

.stats-table th:not(:first-child),
.stats-table td:not(:first-child){

}

.manager-match:hover{
background:var(--card-bg);
}

.manager-match:last-child{
border-bottom:none;
}

.bench-label{
font-size:11px;
font-weight:700;
color:#f59e0b;
margin-left:6px;
}

.result-badge{
display:inline-block;
min-width:60px;
text-align:center;
border-radius:999px;
padding:4px 10px;
font-weight:700;
}

.result-win{
background:var(--result-win-bg);
border:1px solid var(--result-win);
color:var(--result-win);
}

.result-draw{
background:var(--result-draw-bg);
border:1px solid var(--result-draw);
color:var(--result-draw);
}

.result-loss{
background:var(--result-loss-bg);
border:1px solid var(--result-loss);
color:var(--result-loss);
}

.competition-cell{
display:flex;
align-items:center;
gap:8px;
font-weight:600;
}

.competition-logo{
width:20px;
height:20px;
object-fit:contain;
flex-shrink:0;
}

.manager-club{
    margin-top:6px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
}

.club-title{
    background:#dbeafe;
    color:#1e3a8a;
    border:1px solid #93c5fd;
}

[data-theme="dark"] .club-title{
    background:#1e3a5f;
    color:#dbeafe;
    border:1px solid #3b82f6;
}

.manager-clubs{
    margin-top:6px;
    font-size:14px;
    color:var(--muted);
    font-weight:600;
}

.season-block{
    margin-bottom:8px;
}

.season-header{

    background:var(--meta-bg);
    border:1px solid var(--meta-border);
    border-radius:12px;

}

.season-header:hover{
    background:var(--card-bg);
}

.season-matches{

}

.matches-list{

    padding:8px;
    background:var(--meta-bg);

}

.matches-header{

        70px

        90px
        45px
        45px;

    font-weight:700;

    padding:8px;
    margin-bottom:6px;

}

.manager-match{

    grid-template-columns:
        35px
        100px
        70px
        1fr
        90px
        45px
        45px;

}

.manager-match:hover{

.manager-match:last-child{

}

.player-search-results{

.search-type{

.search-type.player{

}

.search-type.manager{

.player-search-item:hover{

.search-hero{

}

}

.player-search-input{

    font-size:16px;
    color:var(--text);

    border-radius:20px;
    border:2px solid var(--card-border);

}

.search-hero .player-search-input:focus{

    border-color:#3b82f6;

    box-shadow:
        0 0 0 4px rgba(59,130,246,.15);
}
    
.manager-clubs a{
    color:var(--link-color);
    text-decoration:none;
    font-weight:600;
}

.manager-clubs a:hover{
    text-decoration:underline;
}

.flick-table{
    width:100%;

    table-layout:fixed;
}

.flick-table th,
.flick-table td{

    border-bottom:1px solid var(--meta-border);

.flick-table th:first-child,

.flick-table th:not(:first-child),

.flick-table th:not(:first-child){

}

.player-link{
color:inherit;
text-decoration:none;
font-weight:600;
font-size:13px;

.player-link:hover{

color:#A50044;
}

.main-menu{

.main-menu a.active{

}

    border:none;

}
    
    #searchToggle span,

	.container{
		padding:6px;
		}

}

    #searchToggle span{

            inset 0 1px 0 rgba(255,255,255,.25);
    }

    .main-menu a{
        display:flex;

}

.manager-match, 
.matches-header{

        90px

}

.manager-card{

<body>

<button id="themeToggle" class="theme-toggle">
    🌙
</button>

<div class="container">

<div class="header">
<h1>Barça - Historical Database</h1>
<div class="hero-subtitle">
Manager Profile
</div>
</div>

<nav class="main-menu">

    <a href="index.html">
        <img src="icons/home-48.png">
        <span>Home</span>
    </a>

    <a href="season.html">
        <img src="icons/seasons-48.png">
        <span>Seasons</span>
    </a>

    <a href="#">
        <img src="icons/stats-48.png">
        <span>Stats</span>
    </a>

    <a href="#">
        <img src="icons/records-48.png">
        <span>Records</span>
    </a>

    <a href="#" id="searchToggle" class="search-menu-btn">
        <img src="icons/search-48.png">
        <span>Search</span>
    </a>

</nav>

<div class="search-hero">

    <input
        type="text"
        id="personSearch"
        placeholder="Search player or manager..."
        class="player-search-input">

    <div id="personSearchResults"></div>

</div>

<div id="managerProfile">
    Loading...
</div>

<div class="content-layout">

    <div class="left-panel">
        <div id="managerContent"></div>
    </div>

    <div class="right-panel">
    
        <div class="widget-title">
            Top 10 Under Manager
        </div>
    
        <div class="widget-card">
            <div id="topManagerPlayers">
                Loading...
            </div>
        </div>
    
    </div>

</div>

</div>

<script>

const params =
new URLSearchParams(location.search);

const managerName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronacion": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de Espana": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

let allMatches = [];
let allPlayers = [];

let managerSortColumn = "total";
let managerSortDirection = "desc";

function sortManagerPlayers(column){

    if(managerSortColumn === column){

        managerSortDirection =
            managerSortDirection === "asc"
            ? "desc"
            : "asc";

    }else{

        managerSortColumn = column;
        managerSortDirection = "desc";

    }

    renderTopManagerPlayers(managerName, allMatches);

}

window.sortManagerPlayers = sortManagerPlayers;

Promise.all([
    fetch("data.json").then(r=>r.json()),
    fetch("managers.json").then(r=>r.json())
])
.then(([data, managers])=>{

    allMatches = data;

    renderManager(managerName, data, managers);

    initPersonSearch();

});

function statValue(value){
    return value === 0 ? "-" : value;
}

function renderManager(manager,data,managers){

const managerMatches = data.filter(match =>

    match.Manager === manager ||
    match["Opp. Manager"] === manager

);

const seasonMatches = {};

managerMatches.forEach(match => {

    const season = match.Season || "Unknown";

    if(!seasonMatches[season]){
        seasonMatches[season] = [];
    }

    seasonMatches[season].push(match);

});

const clubs = [];

managerMatches.forEach(match => {

    if(
        match.Manager === manager &&
        !clubs.includes("FC Barcelona")
    ){
        clubs.push("FC Barcelona");
    }

    if(
        match["Opp. Manager"] === manager &&
        !clubs.includes(match["Opp. Team"])
    ){
        clubs.push(match["Opp. Team"]);
    }

});

managerMatches.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da-db;

});

const barcaMatches = managerMatches
.filter(match => match.Manager === manager);

barcaMatches.sort((a,b)=>{

    const da =
    new Date(a.Date.split(".").reverse().join("-"));

    const db =
    new Date(b.Date.split(".").reverse().join("-"));

    return da - db;

});


const debut =
barcaMatches.length
? barcaMatches[0]
: null;

const lastMatch =
barcaMatches.length
? barcaMatches[barcaMatches.length - 1]
: null;

const coachedBarcelona =
managerMatches.some(
    match => match.Manager === manager
);

const clubStats = {};

managerMatches.forEach(match=>{

    const club =
        match.Manager === manager
        ? "FC Barcelona"
        : match["Opp. Team"];

    if(!clubStats[club]){

        clubStats[club] = {
            seasons:new Set(),
            matches:0,
            wins:0,
            draws:0,
            losses:0,
            yellowCards:0,
            redCards:0
        };

    }

    clubStats[club].matches++;
    clubStats[club].seasons.add(match.Season);

    let resultType;

    if(match.Manager === manager){

        resultType = match["Result type"];

    }else{

        resultType =
            match["Result type"] === "W" ? "L" :
            match["Result type"] === "L" ? "W" :
            "D";

    }

    if(resultType === "W") clubStats[club].wins++;
    if(resultType === "D") clubStats[club].draws++;
    if(resultType === "L") clubStats[club].losses++;

    for(let i=1;i<=20;i++){
    
        if(match.Manager === manager){
    
            if(match[`Yellow staff name ${i}`] === manager){
                clubStats[club].yellowCards++;
            }
    
            if(match[`Red staff name ${i}`] === manager){
                clubStats[club].redCards++;
            }
    
        }else{
    
            if(match[`Opp. Yellow staff name ${i}`] === manager){
                clubStats[club].yellowCards++;
            }
    
            if(match[`Opp. Red staff name ${i}`] === manager){
                clubStats[club].redCards++;
            }
    
        }
    
    }

});

const managerInfo =
managers.find(m => m.Manager === manager);

let nationality =
managerInfo?.["Nationality 1"] || "";

if(
    managerInfo?.["Nationality 2"] &&
    managerInfo["Nationality 2"] !== nationality
){
    nationality +=
        " / " +
        managerInfo["Nationality 2"];
}

const clubsText = clubs.map(club =>

    club === "FC Barcelona"
    ? club
    : `<a href="opponent.html?team=${encodeURIComponent(club)}">${club}</a>`

).join(", ");

const careerHtml = Object.keys(clubStats)
.sort((a,b)=>{

    if(a === "FC Barcelona") return -1;
    if(b === "FC Barcelona") return 1;

function toggleSeason(id){

    const el = document.getElementById(id);

    if(!el) return;

    el.style.display =
        el.style.display === "none"
        ? "table-row"
        : "none";
}

function buildSeasonMatches(manager, season, data){

    const matches = data.filter(match => {

        const isManager =
            match.Manager === manager ||
            match["Opp. Manager"] === manager;

        return isManager && match.Season === season;

    });

        let html = `
            <div class="matches-list">
        
            <div class="matches-header">
            
                <div></div>
                <div>Date</div>
                <div>Venue</div>
                <div>Opponent</div>
                <div>Result</div>
                <div>YC</div>
                <div>RC</div>
            
            </div>
        `;

    matches.forEach(match => {
    
        let resultClass = "result-draw";
    
        let resultType;
    
        if(match.Manager === manager){
    
            resultType = match["Result type"];
    
        }else{
    
            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";
        }
    
        if(resultType === "W") resultClass = "result-win";
        if(resultType === "L") resultClass = "result-loss";
            let yellowCards = 0;
            let redCards = 0;
            
            for(let i=1;i<=20;i++){
            
                if(match.Manager === manager){
            
                    if(match[`Yellow staff name ${i}`] === manager){
                        yellowCards++;
                    }
            
                    if(match[`Red staff name ${i}`] === manager){
                        redCards++;
                    }
            
                }else{
            
                    if(match[`Opp. Yellow staff name ${i}`] === manager){
                        yellowCards++;
                    }
            
                    if(match[`Opp. Red staff name ${i}`] === manager){
                        redCards++;
                    }
            
                }
            
            }
    
html += `

<a
    href="match.html?id=${match.ID}"
    style="
        text-decoration:none;
        color:inherit;
    ">

    <div class="manager-match">

        <div class="competition-cell">
            <img
            src="logos/${competitionLogos[match.Competition] || 'default.png'}"
            class="competition-logo"
            alt="${match.Competition}"
            title="${match.Competition}">
        </div>
        
        <div>
            ${match.Date}
        </div>
        
        <div>
            ${match["Home/Away"] || ""}
        </div>
        
        <div>
            ${match["Opp. Team"]}
        </div>
        
        <div>
            <span class="result-badge ${resultClass}">
                ${match.Result}
            </span>
        </div>

        <div>
            ${statValue(yellowCards)}
        </div>
        
        <div>
            ${statValue(redCards)}
        </div>

    </div>

</a>

`;
    });
    
    html += `
        </div>
    `;

    return html;
}

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function renderManagerStats(manager,data){

    const stats = {};

    data.forEach(match=>{

        const isManager =
            match.Manager === manager ||
            match["Opp. Manager"] === manager;

        if(!isManager){
            return;
        }

        const season = match.Season;

        if(!stats[season]){

        stats[season] = {
            matches:0,
            wins:0,
            draws:0,
            losses:0,
            opponentClub:false
        };

        }

        stats[season].matches++;

        if(match["Opp. Manager"] === manager){
            stats[season].opponentClub = true;
        }

        let resultType;

        if(match.Manager === manager){

            resultType = match["Result type"];

        }else{

            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";

        }

        if(resultType==="W") stats[season].wins++;
        if(resultType==="D") stats[season].draws++;
        if(resultType==="L") stats[season].losses++;

    });

    let html="";

    Object.keys(stats)
    .sort()
    .reverse()
    .forEach(season=>{

        const s = stats[season];

        const winPct =
        s.matches
        ? ((s.wins/s.matches)*100).toFixed(1)
        : 0;

    html += `
    <tr
        class="season-row ${stats[season].opponentClub ? 'opponent-season' : ''}"
        onclick="toggleSeason('season-${season.replace(/\//g,'-')}')"
        style="cursor:pointer">
    
        <td><strong>${season}</strong></td>
    
        <td>${s.matches}</td>
    
        <td>${statValue(s.wins)}</td>
        <td>${statValue(s.draws)}</td>
        <td>${statValue(s.losses)}</td>
    
        <td>${winPct}%</td>
    
    </tr>
    
    <tr
        id="season-${season.replace(/\//g,'-')}"
        style="display:none;">
    
        <td colspan="6">
        
            ${buildSeasonMatches(manager, season, data)}
        
        </td>
    
    </tr>
    `;

});

document.getElementById("seasonRows").innerHTML =
html;

}

function renderTopManagerPlayers(manager,data){

    const stats = {};

    function addPlayer(name){

        if(!name) return;

        if(!stats[name]){

            stats[name] = {
                matches:0,
                goals:0,
                assists:0
            };

        }

    }

    const managerMatches =
        data.filter(match =>
            match.Manager === manager
        );

    managerMatches.forEach(match => {

        for(let i=1;i<=11;i++){

            const player =
                match[`Player name ${i}`];

            if(player){

                addPlayer(player);
                stats[player].matches++;

            }

        }

        for(let i=1;i<=12;i++){

            const player =
                match[`Substitution IN Player ${i}`];

            if(player){

                addPlayer(player);
                stats[player].matches++;

            }

        }

        for(let i=1;i<=12;i++){

            const player =
                match[`Goal Player ${i}`];

            if(player && !player.includes("(OG)")){

                addPlayer(player);
                stats[player].goals++;

            }

        }

        for(let i=1;i<=12;i++){

            const player =
                match[`Assist Player ${i}`];

            if(player){

                addPlayer(player);
                stats[player].assists++;

            }

        }

    });

    const top = Object.entries(stats)

    .map(([name,s]) => ({

        name,
        matches:s.matches,
        goals:s.goals,
        assists:s.assists,
        total:s.goals + s.assists

    }))

    .sort((a,b) => {

        const valueA = a[managerSortColumn];
        const valueB = b[managerSortColumn];

        return managerSortDirection === "asc"
            ? valueA - valueB
            : valueB - valueA;

    })

    .slice(0,10);

    let html = `

    <table class="flick-table">

        <thead>

            <tr>

                <th>Player</th>

                <th
                    class="${managerSortColumn==='matches' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('matches')">
                    M
                </th>

                <th
                    class="${managerSortColumn==='goals' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('goals')">
                    G
                </th>

                <th
                    class="${managerSortColumn==='assists' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('assists')">
                    A
                </th>

                <th
                    class="${managerSortColumn==='total' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('total')">
                    G+A
                </th>

            </tr>

        </thead>

        <tbody>
    `;

    top.forEach(player => {

        html += `

        <tr>

            <td>
                <a
                    class="player-link"
                    href="player.html?name=${encodeURIComponent(player.name)}">
                    ${player.name}
                </a>
            </td>

            <td class="${managerSortColumn==='matches' ? 'flick-column-selected' : ''}">
                ${player.matches}
            </td>

            <td class="${managerSortColumn==='goals' ? 'flick-column-selected' : ''}">
                ${player.goals || "-"}
            </td>

            <td class="${managerSortColumn==='assists' ? 'flick-column-selected' : ''}">
                ${player.assists || "-"}
            </td>

            <td class="${managerSortColumn==='total' ? 'flick-column-selected' : ''}">
                ${player.total || "-"}
            </td>

        </tr>

        `;

    });

    html += `
        </tbody>
    </table>
    `;

    document.getElementById(
        "topManagerPlayers"
    ).innerHTML = html;

}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){
            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );
        }

        if(match["Opp. Manager"]){
            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );
        }

        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){
                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );
            }

            if(match[`Opp. Player name ${i}`]){
                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );
            }

        }

        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){
                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );
            }

            if(match[`Opp. On the bench name ${i}`]){
                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );
            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    const input =
        document.getElementById("personSearch");

    const results =
        document.getElementById("personSearchResults");

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";
            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

            results.innerHTML = `
            <div class="player-search-results">
            ${filtered.map(item => `
            <a
                class="player-search-item"
                href="${
                    item.type === 'Manager'
                    ? `manager.html?name=${encodeURIComponent(item.name)}`
                    : `player.html?name=${encodeURIComponent(item.name)}`
                }">
            ${item.name}
            <span class="search-type ${item.type.toLowerCase()}">
               ${item.type}
            </span>
            </a>
            `).join("")}
            </div>
            `;
    });

}

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

if(button){

    button.textContent =
    theme === "dark"
    ? "☀️"
    : "🌙";

    button.addEventListener("click", () => {

        const current =
        document.documentElement.getAttribute("data-theme");

        const next =
        current === "dark"
        ? "light"
        : "dark";

        document.documentElement.setAttribute(
            "data-theme",
            next
        );

        localStorage.setItem(
            "theme",
            next
        );

        button.textContent =
        next === "dark"
        ? "☀️"
        : "🌙";

    });

}

})();

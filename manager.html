<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manager Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/theme.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#004D98 0%,transparent 35%),
radial-gradient(circle at top right,#A50044 0%,transparent 35%),
var(--bg);

color:var(--text);
min-height:100vh;
}

.theme-toggle{
position:fixed;
bottom:20px;
left:20px;

width:52px;
height:52px;

border:none;
border-radius:50%;

cursor:pointer;

background:#A50044;
color:white;

font-size:20px;
font-weight:700;

z-index:9999;
}

.container{
max-width:1500px;
margin:auto;
padding:10px;
}

.header{
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

padding:24px;
border-radius:28px;
color:white;
margin-bottom:10px;
}

.header h1{
margin:0;
font-size:22px;
font-weight:700;
}

.hero-subtitle{
margin-top:8px;
font-size:13px;
font-weight:500;
color:rgba(255,255,255,.85);
}

.manager-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:20px;
display:flex;
align-items:center;
gap:20px;
margin-bottom:10px;
}

.manager-photo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #004D98;
display:none;
}

.manager-info h1{
margin:0;
font-size:22px;
}

.manager-meta{
margin-top:12px;

display:flex;
flex-direction:column;
align-items:flex-start;

gap:6px;

font-size:14px;
color:var(--muted);
}

.manager-meta div{
white-space:normal;
display:block;
width:100%;
}

.manager-meta a{
font-weight:600;
text-decoration:none;
color:var(--link-color);
}

.manager-meta a:hover{
text-decoration:underline;
}

.widget-title{
margin:8px 0 6px;
padding:8px 14px;
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

color:white;
font-size:14px;
font-weight:700;
border-radius:18px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.summary-box{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:18px;
padding:12px;
text-align:center;
}

.summary-box b{
display:block;
font-size:26px;
margin-bottom:4px;
}

.widget-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:14px;
}

.stats-table{
width:100%;
border-collapse:collapse;
}

.stats-table th,
.stats-table td{
padding:8px;
border-bottom:1px solid var(--meta-border);
font-size:13px;
}

.stats-table th{
text-align:left;
}

.season-link{
cursor:pointer;
font-weight:700;
color:#004D98;
}

.season-link:hover{
text-decoration:underline;
}

.season-row{
transition:.2s;
}

.season-row:hover{
background:var(--meta-bg);
}

.opponent-season{
    background:#fff8c4;
    transition:.2s;
}

.opponent-season:hover{
    background:#fff2a3;
}

[data-theme="dark"] .opponent-season{
    background:#5b5420;
}

[data-theme="dark"] .opponent-season:hover{
    background:#746923;
}

.opponent-career .summary-box{
    background:#fff8c4;
    border-color:#eab308;
    color:#000;
}

[data-theme="dark"] .opponent-career .summary-box{
    background:#5b5420;
    border-color:#eab308;
    color:#fff;
}

.stats-table th:first-child,
.stats-table td:first-child{
    text-align:left;
}

.stats-table th:not(:first-child),
.stats-table td:not(:first-child){
    text-align:center;
}

.manager-match:hover{
background:var(--card-bg);
}

.manager-match:last-child{
border-bottom:none;
}

.bench-label{
font-size:11px;
font-weight:700;
color:#f59e0b;
margin-left:6px;
}

.result-badge{
display:inline-block;
min-width:60px;
text-align:center;
border-radius:999px;
padding:4px 10px;
font-weight:700;
}

.result-win{
background:var(--result-win-bg);
border:1px solid var(--result-win);
color:var(--result-win);
}

.result-draw{
background:var(--result-draw-bg);
border:1px solid var(--result-draw);
color:var(--result-draw);
}

.result-loss{
background:var(--result-loss-bg);
border:1px solid var(--result-loss);
color:var(--result-loss);
}

.mobile{
display:none;
}

.competition-cell{
display:flex;
align-items:center;
gap:8px;
font-weight:600;
}

.competition-logo{
width:20px;
height:20px;
object-fit:contain;
flex-shrink:0;
}

.manager-club{
    margin-top:6px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
}

.club-title{
    background:#dbeafe;
    color:#1e3a8a;
    border:1px solid #93c5fd;
}

[data-theme="dark"] .club-title{
    background:#1e3a5f;
    color:#dbeafe;
    border:1px solid #3b82f6;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;

    background:
        linear-gradient(
            135deg,
            #004D98,
            #A50044
        );

    color:white;
    text-decoration:none;

    padding:14px 22px;

    border-radius:999px;

    font-weight:700;
    font-size:13px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);

    z-index:9999;
}

.manager-clubs{
    margin-top:6px;
    font-size:14px;
    color:var(--muted);
    font-weight:600;
}

.season-block{
    margin-bottom:8px;
}

.season-header{
    padding:10px 14px;
    background:var(--meta-bg);
    border:1px solid var(--meta-border);
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

.season-header:hover{
    background:var(--card-bg);
}

.season-matches{
    margin-top:6px;
}

.matches-list{
    display:block;
    margin-top:8px;
    padding:8px;
    background:var(--meta-bg);
    border-radius:12px;
}

.matches-header{
    display:grid;
    grid-template-columns:
        35px
        90px
        70px
        1fr
        90px;

    gap:10px;

    font-size:12px;
    font-weight:700;
    text-transform:uppercase;

    padding:8px;
    margin-bottom:6px;

    opacity:.7;
}

.manager-match{
    display:grid;
    grid-template-columns:
        35px
        100px
        70px
        1fr
        90px;

    gap:10px;
    align-items:center;
    padding:8px;
    border-bottom:1px solid var(--meta-border);
    transition:.2s;
}

.manager-match:hover{
    background:var(--card-bg);
}

.manager-match:last-child{
    border-bottom:none;
}

.opponent-season .matches-list{
    background:#fff8c4;
}

[data-theme="dark"] .opponent-season .matches-list{
    background:#5b5420;
}

@media(max-width:900px){

.manager-match div:nth-child(6),
.manager-match div:nth-child(7),
.manager-match div:nth-child(8),
.manager-match div:nth-child(9),
.manager-match div:nth-child(10),
.manager-match div:nth-child(11){
    display:none;
}

.manager-match{
    grid-template-columns:
        35px
        100px
        1fr
        90px;

row-gap:8px;
}

.competition-logo{
width:18px;
height:18px;
}

.desktop{
display:none;
}

.mobile{
display:inline;
}

.manager-card{
flex-direction:column;
}

.summary-grid{
grid-template-columns:repeat(4,1fr);
}

.summary-box{
font-size:11px;
}

.competition-cell span{
    display:none;
}

.back-btn{
    right:10px;
    bottom:10px;

    padding:10px 14px;

    font-size:12px;
    font-weight:600;
}

}

</style>
</head>

<body>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

<div class="container">

<div class="header">
<h1>FC Barcelona - Statistics & Historical Database</h1>
<div class="hero-subtitle">
Manager Profile
</div>
</div>

<div id="managerProfile">
Loading...
</div>

</div>

<script>

const params =
new URLSearchParams(location.search);

const managerName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronacion": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de Espana": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

fetch("data.json")
.then(r=>r.json())
.then(data=>{

renderManager(managerName,data);

});

function renderManager(manager,data){

const managerMatches = data.filter(match =>

    match.Manager === manager ||
    match["Opp. Manager"] === manager

);

const seasonMatches = {};

managerMatches.forEach(match => {

    const season = match.Season || "Unknown";

    if(!seasonMatches[season]){
        seasonMatches[season] = [];
    }

    seasonMatches[season].push(match);

});

const clubs = [];

managerMatches.forEach(match => {

    if(
        match.Manager === manager &&
        !clubs.includes("FC Barcelona")
    ){
        clubs.push("FC Barcelona");
    }

    if(
        match["Opp. Manager"] === manager &&
        !clubs.includes(match["Opp. Team"])
    ){
        clubs.push(match["Opp. Team"]);
    }

});

managerMatches.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da-db;

});

const debut =
managerMatches.length
? managerMatches[0]
: null;

const lastMatch =
managerMatches.length
? managerMatches[managerMatches.length - 1]
: null;

const coachedBarcelona =
managerMatches.some(
    match => match.Manager === manager
);

const career = {

    seasons:new Set(),
    matches:0,
    wins:0,
    draws:0,
    losses:0,

    goalsFor:0,
    goalsAgainst:0

};

managerMatches.forEach(match=>{

    career.matches++;

    career.seasons.add(match.Season);

    let resultType;

    if(match.Manager === manager){

        resultType = match["Result type"];

    }else{

        resultType =
            match["Result type"] === "W" ? "L" :
            match["Result type"] === "L" ? "W" :
            "D";

    }

    if(resultType === "W") career.wins++;
    if(resultType === "D") career.draws++;
    if(resultType === "L") career.losses++;

});

const winRate =
career.matches
? ((career.wins / career.matches) * 100).toFixed(1)
: 0;

const clubsText = clubs.join(", ");

document.getElementById("managerProfile").innerHTML=`

<div class="manager-card">

    <div class="manager-info">

        <h1>${manager}</h1>
        <div class="manager-clubs">
            ${clubsText}
        </div>

        <div class="manager-meta">

        ${coachedBarcelona && debut ? `
        <div>
            <b>Debut:</b>
        
            <a href="match.html?id=${debut.ID}">
                ${debut.Date}
                vs
                ${debut["Opp. Team"]}
            </a>
        
        </div>
        ` : ""}
        
        ${coachedBarcelona && lastMatch ? `
        <div>
            <b>Last Match:</b>
        
            <a href="match.html?id=${lastMatch.ID}">
                ${lastMatch.Date}
                vs
                ${lastMatch["Opp. Team"]}
            </a>
        
        </div>
        ` : ""}

        </div>

    </div>

</div>

<div class="widget-title">
Career Statistics
</div>

<div class="summary-grid">

    <div class="summary-box">
        <b>${career.seasons.size}</b>
        Seasons
    </div>

    <div class="summary-box">
        <b>${career.matches}</b>
        Matches
    </div>

    <div class="summary-box">
        <b>${career.wins}</b>
        Wins
    </div>

    <div class="summary-box">
        <b>${career.draws}</b>
        Draws
    </div>

    <div class="summary-box">
        <b>${career.losses}</b>
        Losses
    </div>

    <div class="summary-box">
        <b>${winRate}%</b>
        Win %
    </div>

    <div class="summary-box">
        <b>${career.goalsFor}:${career.goalsAgainst}</b>
        Score
    </div>

</div>

<div class="widget-title">
Season Breakdown
</div>

<div class="widget-card">

    <table class="stats-table">

        <thead>
            <tr>
                <th>Season</th>
                <th>Matches</th>
                <th>Wins</th>
                <th>Draws</th>
                <th>Losses</th>
                <th>Wins %</th>
            </tr>
        </thead>

        <tbody id="seasonRows"></tbody>

    </table>

</div>

`;

renderManagerStats(manager,data);

}

function toggleSeason(id){

    const el = document.getElementById(id);

    if(!el) return;

    el.style.display =
        el.style.display === "none"
        ? "table-row"
        : "none";
}

function buildSeasonMatches(manager, season, data){

    const matches = data.filter(match => {

        const isManager =
            match.Manager === manager ||
            match["Opp. Manager"] === manager;

        return isManager && match.Season === season;

    });

        let html = `
            <div class="matches-list">
        
            <div class="matches-header">
            
                <div></div>
                <div>Date</div>
                <div>Venue</div>
                <div>Opponent</div>
                <div>Result</div>
            
            </div>
        `;

    matches.forEach(match => {
    
        let resultClass = "result-draw";
    
        let resultType;
    
        if(match.Manager === manager){
    
            resultType = match["Result type"];
    
        }else{
    
            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";
        }
    
        if(resultType === "W") resultClass = "result-win";
        if(resultType === "L") resultClass = "result-loss";
    
html += `

<a
    href="match.html?id=${match.ID}"
    style="
        text-decoration:none;
        color:inherit;
    ">

    <div class="manager-match">

        <div class="competition-cell">
            <img
            src="logos/${competitionLogos[match.competition] || 'default.png'}"
            class="competition-logo"
            alt="${match.competition}"
            title="${match.competition}">
        </div>
        
        <div>
            ${match.Date}
        </div>
        
        <div>
            ${match.Venue || ""}
        </div>
        
        <div>
            ${match["Opp. Team"]}
        </div>
        
        <div>
            <span class="result-badge ${resultClass}">
                ${resultType}
            </span>
        </div>

    </div>

</a>

`;
    });
    
    html += `
        </div>
    `;

    return html;
}

function renderManagerStats(manager,data){

    const stats = {};

    data.forEach(match=>{

        const isManager =
            match.Manager === manager ||
            match["Opp. Manager"] === manager;

        if(!isManager){
            return;
        }

        const season = match.Season;

        if(!stats[season]){

        stats[season] = {
            matches:0,
            wins:0,
            draws:0,
            losses:0,
            opponentClub:false
        };

        }

        stats[season].matches++;

        if(match["Opp. Manager"] === manager){
            stats[season].opponentClub = true;
        }

        let resultType;

        if(match.Manager === manager){

            resultType = match["Result type"];

        }else{

            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";

        }

        if(resultType==="W") stats[season].wins++;
        if(resultType==="D") stats[season].draws++;
        if(resultType==="L") stats[season].losses++;

    });

    let html="";

    Object.keys(stats)
    .sort()
    .reverse()
    .forEach(season=>{

        const s = stats[season];

        const winPct =
        s.matches
        ? ((s.wins/s.matches)*100).toFixed(1)
        : 0;

    html += `
    <tr
        class="season-row ${stats[season].opponentClub ? 'opponent-season' : ''}"
        onclick="toggleSeason('season-${season.replace(/\//g,'-')}')"
        style="cursor:pointer">
    
        <td><strong>${season}</strong></td>
    
        <td>${s.matches}</td>
    
        <td>${s.wins}</td>
    
        <td>${s.draws}</td>
    
        <td>${s.losses}</td>
    
        <td>${winPct}%</td>
    
    </tr>
    
    <tr
        id="season-${season.replace(/\//g,'-')}"
        class="${stats[season].opponentClub ? 'opponent-season' : ''}"
        style="display:none;">
    
        <td colspan="6">
        
            ${buildSeasonMatches(manager, season, data)}
        
        </td>
    
    </tr>
    `;

});

document.getElementById("seasonRows").innerHTML =
html;

}

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

button.textContent =
theme === "dark"
? "☀️"
: "🌙";

button.addEventListener("click",()=>{

const current =
document.documentElement.getAttribute("data-theme");

const next =
current === "dark"
? "light"
: "dark";

document.documentElement.setAttribute(
"data-theme",
next
);

localStorage.setItem(
"theme",
next
);

button.textContent =
next === "dark"
? "☀️"
: "🌙";

});

})();

</script>

<a href="index.html" class="back-btn">
    ← Home
</a>

</body>
</html>

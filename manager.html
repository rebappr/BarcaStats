<script>

const params =
new URLSearchParams(location.search);

const managerName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronacion": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de Espana": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

fetch("data.json")
.then(r=>r.json())
.then(data=>{

renderManager(managerName,data);

});

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function renderManager(manager,data,managers){

const managerInfo =
managers.find(p => p.Manager === manager);

const managerMatches = data.filter(match =>

    match.Manager === manager ||
    match["Opp. Manager"] === manager

);

for(let i=1;i<=6;i++){

if(
match[`Sub on ${i}`]===manager ||
match[`Opp. Sub on ${i}`]===manager
){
appeared = true;
}

}

if(appeared){
managerMatches.push(match);
}

});

managerMatches.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da-db;

});

const debut =
managerMatches.length
? managerMatches[0]
: null;

const lastMatch =
managerMatches.length
? managerMatches[managerMatches.length - 1]
: null;

let nationality =
managerInfo?.["Nationality 1"] || "";

if(managerInfo?.["Nationality 2"]){

nationality +=
" / " +
managerInfo["Nationality 2"];

}

const clubStats = {};

data.forEach(match=>{

    let forOpponent = false;
    let appeared = false;

    for(let i=1;i<=11;i++){

        if(match[`Manager name ${i}`]===manager){
            appeared = true;
        }

        if(match[`Opp. Manager name ${i}`]===manager){
            appeared = true;
            forOpponent = true;
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]===manager){
            appeared = true;
        }

        if(match[`Opp. Sub on ${i}`]===manager){
            appeared = true;
            forOpponent = true;
        }

    }

    if(!appeared){
        return;
    }
    
    const club = forOpponent
        ? match["Opp. Team"]
        : "FC Barcelona";
    
    if(!clubStats[club]){
    
        clubStats[club] = {
            seasons: new Set(),
            matches:0,
            goals:0,
            assists:0,
            penaltyGoals:0,
            missedPenalties:0,
            yellow:0,
            red:0
        };
    
    }
    
    clubStats[club].seasons.add(match.Season);
    clubStats[club].matches++;

for(let i=1;i<=12;i++){

    if(
        match[`Goal Manager ${i}`]===manager ||
        match[`Opp. Goal Manager ${i}`]===manager
    ){
        clubStats[club].goals++;
    }

    if(
        match[`Assist Manager ${i}`]===manager ||
        match[`Opp. Assist Manager ${i}`]===manager
    ){
        clubStats[club].assists++;
    }

    if(
        match[`Yellow manager ${i}`]===manager ||
        match[`Opp. Yellow manager ${i}`]===manager
    ){
        clubStats[club].yellow++;
    }

    if(
        match[`Red manager ${i}`]===manager ||
        match[`Opp. Red manager ${i}`]===manager
    ){
        clubStats[club].red++;
    }

    let scored = null;

    if(match[`Penalty manager ${i}`]===manager){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty manager ${i}`]===manager){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        clubStats[club].penaltyGoals++;
    }

    if(scored==="not in"){
        clubStats[club].missedPenalties++;
    }

}

});

const clubs = [];

managerMatches.forEach(match => {

    let club = null;

    for(let i=1;i<=11;i++){

        if(match[`Manager name ${i}`] === manager){
            club = "FC Barcelona";
        }

        if(match[`Opp. Manager name ${i}`] === manager){
            club = match["Opp. Team"];
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`] === manager){
            club = "FC Barcelona";
        }

        if(match[`Opp. Sub on ${i}`] === manager){
            club = match["Opp. Team"];
        }

    }

    if(club && !clubs.includes(club)){
        clubs.push(club);
    }

});

const managerClub = clubs.join(", ");

const career = {

    seasons:new Set(),
    matches:0,
    wins:0,
    draws:0,
    losses:0

};

managerMatches.forEach(match=>{

    career.matches++;

    career.seasons.add(match.Season);

    let resultType;

    if(match.Manager === manager){

        resultType = match["Result type"];

    }else{

        resultType =
            match["Result type"] === "W" ? "L" :
            match["Result type"] === "L" ? "W" :
            "D";

    }

    if(resultType === "W") career.wins++;
    if(resultType === "D") career.draws++;
    if(resultType === "L") career.losses++;

});

const winRate =
career.matches
? ((career.wins / career.matches) * 100).toFixed(1)
: 0;



document.getElementById("managerProfile").innerHTML=`

<div class="player-card">

    <div class="player-info">

        <h1>${manager}</h1>

        <div class="player-meta">

            ${debut ? `
            <div>
                <b>Debut:</b>

                <a href="match.html?id=${debut.ID}">
                    ${debut.Date}
                    vs
                    ${debut["Opp. Team"]}
                </a>

            </div>
            ` : ""}

            ${lastMatch ? `
            <div>
                <b>Last Match:</b>

                <a href="match.html?id=${lastMatch.ID}">
                    ${lastMatch.Date}
                    vs
                    ${lastMatch["Opp. Team"]}
                </a>

            </div>
            ` : ""}

        </div>

    </div>

</div>

<div class="widget-title">
Career Statistics
</div>

<div class="summary-grid">

    <div class="summary-box">
        <b>${career.seasons.size}</b>
        Seasons
    </div>

    <div class="summary-box">
        <b>${career.matches}</b>
        Matches
    </div>

    <div class="summary-box">
        <b>${career.wins}</b>
        Wins
    </div>

    <div class="summary-box">
        <b>${career.draws}</b>
        Draws
    </div>

    <div class="summary-box">
        <b>${career.losses}</b>
        Losses
    </div>

    <div class="summary-box">
        <b>${winRate}%</b>
        Win %
    </div>

</div>

`).join("")}

<div class="widget-title">
Season Breakdown
</div>

<div class="widget-card">

    <table class="stats-table">

        <thead>
            <tr>
                <th>Season</th>
                <th>M</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>Win %</th>
            </tr>
        </thead>

        <tbody id="seasonRows"></tbody>

    </table>

</div>

`;

renderSeasonStats(manager,data);

}

function toggleSeason(id){

document
.getElementById(id)
.classList.toggle("active");

}

function renderManagerStats(manager,data){

    const stats = {};

    data.forEach(match=>{

        const isManager =
            match.Manager === manager ||
            match["Opp. Manager"] === manager;

        if(!isManager){
            return;
        }

        const season = match.Season;

        if(!stats[season]){

            stats[season] = {
                matches:0,
                wins:0,
                draws:0,
                losses:0,
                games:[]
            };

        }

        stats[season].matches++;

        let resultType;

        if(match.Manager === manager){

            resultType = match["Result type"];

        }else{

            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";

        }

        if(resultType==="W") stats[season].wins++;
        if(resultType==="D") stats[season].draws++;
        if(resultType==="L") stats[season].losses++;

        stats[season].games.push({

            id:match.ID,
            date:match.Date,
            competition:match.Competition,
            opponent:match["Opp. Team"],
            result:match.Result,
            resultType

        });

    });

    let html = "";

    Object.keys(stats)
    .sort()
    .reverse()
    .forEach((season,index)=>{

        const s = stats[season];

        const winPct =
        s.matches
        ? ((s.wins/s.matches)*100).toFixed(1)
        : 0;

        html += `
        <tr
        class="season-row"
        onclick="toggleSeason('season_${index}')">

            <td>${season}</td>
            <td>${s.matches}</td>
            <td>${s.wins}</td>
            <td>${s.draws}</td>
            <td>${s.losses}</td>
            <td>${winPct}%</td>

        </tr>
        `;
    });

    document.getElementById("seasonRows").innerHTML =
    html;
}

function renderSeasonStats(manager,data){

const stats={};

data.forEach(match=>{

let started=false;
let bench=false;

let appeared=false;
let forBarca=false;
let forOpponent=false;

for(let i=1;i<=11;i++){

if(match[`Manager name ${i}`]===manager){
    appeared=true;
    started=true;
    forBarca=true;
}

if(match[`Opp. Manager name ${i}`]===manager){
    appeared=true;
    started=true;
    forOpponent=true;
}

}

for(let i=1;i<=6;i++){

    if(match[`Sub on ${i}`]===manager){
        appeared=true;
        forBarca=true;
    }

    if(match[`Opp. Sub on ${i}`]===manager){
        appeared=true;
        forOpponent=true;
    }

}

let played = appeared;

for(let i=1;i<=12;i++){

if(
match[`On the bench name ${i}`]===manager ||
match[`Opp. On the bench name ${i}`]===manager
){
bench=true;
}

}

if(!played && !bench){
return;
}

const season=match.Season;

if(!stats[season]){

stats[season]={
matches:0,
wins:0,
draws:0,
losses:0,
games:[]
};

}

if(forOpponent){
    stats[season].opponentClub = true;
}

if(played){
    stats[season].matches++;
}

for(let i=1;i<=12;i++){

    if(
        match[`Goal Manager ${i}`]===manager ||
        match[`Opp. Goal Manager ${i}`]===manager
    ){
        stats[season].goals++;
    }

    if(
        match[`Assist Manager ${i}`]===manager ||
        match[`Opp. Assist Manager ${i}`]===manager
    ){
        stats[season].assists++;
    }

    if(
        match[`Yellow manager ${i}`]===manager ||
        match[`Opp. Yellow manager ${i}`]===manager
    ){
        stats[season].yellow++;
    }

    if(
        match[`Red manager ${i}`]===manager ||
        match[`Opp. Red manager ${i}`]===manager
    ){
        stats[season].red++;
    }

    let scored = null;

    if(match[`Penalty manager ${i}`]===manager){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty manager ${i}`]===manager){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        stats[season].penaltyGoals++;
    }

    if(scored==="not in"){
        stats[season].missedPenalties++;
    }

}

let gameGoals = 0;
let gameAssists = 0;
let gamePenaltyGoals = 0;
let gameMissedPenalties = 0;
let gameYellow = 0;
let gameRed = 0;

for(let i=1;i<=12;i++){

if(
    match[`Goal Manager ${i}`]===manager ||
    match[`Opp. Goal Manager ${i}`]===manager
){
    gameGoals++;
}

if(
    match[`Assist Manager ${i}`]===manager ||
    match[`Opp. Assist Manager ${i}`]===manager
){
    gameAssists++;
}

if(
    match[`Yellow manager ${i}`]===manager ||
    match[`Opp. Yellow manager ${i}`]===manager
){
    gameYellow++;
}

if(
    match[`Red manager ${i}`]===manager ||
    match[`Opp. Red manager ${i}`]===manager
){
    gameRed++;
}

let scored = null;

if(match[`Penalty manager ${i}`]===manager){
    scored = match[`Penalty scored ${i}`];
}

if(match[`Opp. Penalty manager ${i}`]===manager){
    scored = match[`Opp. Penalty scored ${i}`];
}

if(scored==="in"){
    gamePenaltyGoals++;
}

if(scored==="not in"){
    gameMissedPenalties++;
}

}

stats[season].games.push({
id:match.ID,
date:match.Date,
competition:match.Competition,
venue:match["Home/Away"],
opponent:match["Opp. Team"],
result:match.Result,
resultType: match["Result type"],
played: played,

goals: gameGoals,
assists: gameAssists,
penaltyGoals: gamePenaltyGoals,
missedPenalties: gameMissedPenalties,
yellow: gameYellow,
red: gameRed
});

});

let html="";

Object.keys(stats)
.sort()
.reverse()
.forEach((season,index)=>{

const seasonId=`season_${index}`;

stats[season].games.sort((a,b)=>{

const da =
new Date(a.date.split(".").reverse().join("-"));

const db =
new Date(b.date.split(".").reverse().join("-"));

return db - da;

});

html+=`

<tr
class="season-row ${stats[season].opponentClub ? 'opponent-season' : ''}"
onclick="toggleSeason('${seasonId}')"
style="cursor:pointer;">

<td>
<strong>${season}</strong>
</td>

<td>${stats[season].matches}</td>

<td>${stats[season].goals}</td>

<td>${stats[season].assists}</td>

<td>${stats[season].penaltyGoals}</td>

<td>${stats[season].missedPenalties}</td>

<td>${stats[season].yellow}</td>

<td>${stats[season].red}</td>

</tr>

<tr>

<td colspan="8" style="padding:0;border:none;">

<div
id="${seasonId}"
class="matches-list">

<div class="matches-header">

<div></div>
<div>Date</div>
<div>Venue</div>
<div>Opponent</div>
<div>Result</div>
<div>G</div>
<div>A</div>
<div>PG</div>
<div>MP</div>
<div>YC</div>
<div>RC</div>

</div>

${stats[season].games.map(game=>`

<a
href="match.html?id=${game.id}"
style="
text-decoration:none;
color:inherit;
">

<div
class="manager-match ${game.played ? 'manager-started' : 'manager-bench'}">

    <div class="competition-cell">
        <img
        src="logos/${competitionLogos[game.competition] || 'default.png'}"
        class="competition-logo"
        alt="${game.competition}"
        title="${game.competition}">
    </div>

    <div>${game.date}</div>
        
    <div>${game.venue}</div>

    <div>${game.opponent}</div>

    <div>
        <span class="result-badge ${
            game.resultType === "W" ? "result-win" :
            game.resultType === "D" ? "result-draw" :
            game.resultType === "L" ? "result-loss" :
            ""
        }">
            ${game.result}
        </span>
    </div>

    <div>${game.goals}</div>

    <div>${game.assists}</div>

    <div>${game.penaltyGoals}</div>

    <div>${game.missedPenalties}</div>

    <div>${game.yellow}</div>

    <div>${game.red}</div>

    <div class="mobile-match-stats">

        <div class="mobile-stats-header">
            <span>G</span>
            <span>A</span>
            <span>PG</span>
            <span>MP</span>
            <span>YC</span>
            <span>RC</span>
        </div>

        <div class="mobile-stats-values">
            <span>${game.goals}</span>
            <span>${game.assists}</span>
            <span>${game.penaltyGoals}</span>
            <span>${game.missedPenalties}</span>
            <span>${game.yellow}</span>
            <span>${game.red}</span>
        </div>

    </div>

</div>

</a>

`).join("")}

</div>

</td>

</tr>

`;

});

document.getElementById("seasonRows").innerHTML=
html;

}

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

button.textContent =
theme === "dark"
? "☀️"
: "🌙";

button.addEventListener("click",()=>{

const current =
document.documentElement.getAttribute("data-theme");

const next =
current === "dark"
? "light"
: "dark";

document.documentElement.setAttribute(
"data-theme",
next
);

localStorage.setItem(
"theme",
next
);

button.textContent =
next === "dark"
? "☀️"
: "🌙";

});

})();

</script>

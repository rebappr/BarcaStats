name: Update La Liga Table

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run updater
        run: node scripts/update-laliga.js
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add tablelaliga.json

          if ! git diff --staged --quiet; then
            git commit -m "Update La Liga table"
            git push
          fi

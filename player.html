<body>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

<div class="container">

<div class="header">
<h1>FC Barcelona - Statistics & Historical Database</h1>
<div class="hero-subtitle">
Player Profile
</div>
</div>

<div id="playerProfile">
Loading...
</div>

</div>

<script>

const params =
new URLSearchParams(location.search);

const playerName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronacion": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de Espana": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

Promise.all([
fetch("data.json").then(r=>r.json()),
fetch("players.json").then(r=>r.json())
])
.then(([data,players])=>{

renderPlayer(playerName,data,players);

});

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function renderPlayer(player,data,players){

const playerInfo =
players.find(p => p.Player === player);

const playerMatches = [];

data.forEach(match=>{

let appeared = false;

for(let i=1;i<=11;i++){

    if(match[`Player name ${i}`]===player){
        appeared = true;
    }

    if(match[`Opp. Player name ${i}`]===player){
        appeared = true;
    }

}

for(let i=1;i<=6;i++){

if(
match[`Sub on ${i}`]===player ||
match[`Opp. Sub on ${i}`]===player
){
appeared = true;
}

}

if(appeared){
playerMatches.push(match);
}

});

playerMatches.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da-db;

});

const debut =
playerMatches.length
? playerMatches[0]
: null;

const lastMatch =
playerMatches.length
? playerMatches[playerMatches.length-1]
: null;

let nationality =
playerInfo?.["Nationality 1"] || "";

if(playerInfo?.["Nationality 2"]){

nationality +=
" / " +
playerInfo["Nationality 2"];

}

const clubStats = {};

data.forEach(match=>{

    let forOpponent = false;
    let appeared = false;

    for(let i=1;i<=11;i++){

        if(match[`Player name ${i}`]===player){
            appeared = true;
        }

        if(match[`Opp. Player name ${i}`]===player){
            appeared = true;
            forOpponent = true;
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]===player){
            appeared = true;
        }

        if(match[`Opp. Sub on ${i}`]===player){
            appeared = true;
            forOpponent = true;
        }

    }

    if(!appeared){
        return;
    }
    
    const club = forOpponent
        ? match["Opp. Team"]
        : "FC Barcelona";
    
    if(!clubStats[club]){
    
        clubStats[club] = {
            seasons: new Set(),
            matches:0,
            goals:0,
            assists:0,
            penaltyGoals:0,
            missedPenalties:0,
            yellow:0,
            red:0
        };
    
    }
    
    clubStats[club].seasons.add(match.Season);
    clubStats[club].matches++;

for(let i=1;i<=12;i++){

    if(
        match[`Goal Player ${i}`]===player ||
        match[`Opp. Goal Player ${i}`]===player
    ){
        clubStats[club].goals++;
    }

    if(
        match[`Assist Player ${i}`]===player ||
        match[`Opp. Assist Player ${i}`]===player
    ){
        clubStats[club].assists++;
    }

    if(
        match[`Yellow player ${i}`]===player ||
        match[`Opp. Yellow player ${i}`]===player
    ){
        clubStats[club].yellow++;
    }

    if(
        match[`Red player ${i}`]===player ||
        match[`Opp. Red player ${i}`]===player
    ){
        clubStats[club].red++;
    }

    let scored = null;

    if(match[`Penalty player ${i}`]===player){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty player ${i}`]===player){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        clubStats[club].penaltyGoals++;
    }

    if(scored==="not in"){
        clubStats[club].missedPenalties++;
    }

}

});

const clubs = [];

playerMatches.forEach(match => {

    let club = null;

    for(let i=1;i<=11;i++){

        if(match[`Player name ${i}`] === player){
            club = "FC Barcelona";
        }

        if(match[`Opp. Player name ${i}`] === player){
            club = match["Opp. Team"];
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`] === player){
            club = "FC Barcelona";
        }

        if(match[`Opp. Sub on ${i}`] === player){
            club = match["Opp. Team"];
        }

    }

    if(club && !clubs.includes(club)){
        clubs.push(club);
    }

});

const playerClub = clubs.join(", ");

document.getElementById("playerProfile").innerHTML=`

<div class="player-card">

<img
src="images/players/default.png"
class="player-photo">

<div class="player-info">

<h1>${player}</h1>

${playerClub ? `
<div class="player-club">
    ${playerClub}
</div>
` : ""}

<div class="player-meta">

${playerInfo?.["Date of Birth"] ? `

<div>
<b>Born:</b>
${playerInfo["Date of Birth"]}
(${calculateAge(
    playerInfo["Date of Birth"],
    playerInfo["Death Date"]
)})
</div>

` : ""}

${playerInfo?.["Death Date"] ? `

<div>
<b>Died:</b>
${playerInfo["Death Date"]}
</div>

` : ""}

${nationality ? `

<div>
<b>Nationality:</b>
${nationality}
</div>

` : ""}

${playerInfo?.Position ? `

<div>
<b>Main Position:</b>
${playerInfo.Position}
</div>

` : ""}

${debut ? `
<div>
    <b>Debut:</b>
    <a href="match.html?id=${debut.ID}">
        ${debut.Date} vs ${debut["Opp. Team"]} (${debut.Result})
    </a>
</div>
` : ""}


${lastMatch ? `

<div>
<b>Last Match:</b>
<a href="match.html?id=${lastMatch.ID}"> 
    ${lastMatch.Date} vs ${lastMatch["Opp. Team"]} (${lastMatch.Result})
</a>
</div>

` : ""}

</div>

</div>

</div>

<div class="widget-title">
Career Statistics
</div>

${Object.entries(clubStats).map(([club,s]) => `

<div class="widget-title club-title">
${club}
</div>

<div class="summary-grid">

    <div class="summary-box">
        <b>${s.seasons.size}</b>
        Seasons
    </div>

    <div class="summary-box">
        <b>${s.matches}</b>
        Matches
    </div>

    <div class="summary-box">
        <b>${s.goals}</b>
        Goals
    </div>

    <div class="summary-box">
        <b>${s.assists}</b>
        Assists
    </div>

    <div class="summary-box">
        <b>${s.penaltyGoals}</b>
        Penalty Goals
    </div>

    <div class="summary-box">
        <b>${s.missedPenalties}</b>
        Missed Penalties
    </div>

    <div class="summary-box">
        <b>${s.yellow}</b>
        Yellow
    </div>

    <div class="summary-box">
        <b>${s.red}</b>
        Red
    </div>

</div>

`).join("")}

<div class="widget-title">
Season Breakdown
</div>

<div class="widget-card">

<table class="stats-table">

<thead>
<tr>
<th>Season</th>
<th><span class="desktop">Matches</span><span class="mobile">M</span></th>
<th><span class="desktop">Goals</span><span class="mobile">G</span></th>
<th><span class="desktop">Assists</span><span class="mobile">A</span></th>
<th><span class="desktop">Penalty Goal</span><span class="mobile">PG</span></th>
<th><span class="desktop">Missed Penalties</span><span class="mobile">MP</span></th>
<th><span class="desktop">Yellow Card</span><span class="mobile">YC</span></th>
<th><span class="desktop">Red Card</span><span class="mobile">RC</span></th>
</tr>
</thead>

<tbody id="seasonRows">
</tbody>

</table>

</div>

`;

renderSeasonStats(player,data);

}

function toggleSeason(id){

document
.getElementById(id)
.classList.toggle("active");

}

function renderSeasonStats(player,data){

const stats={};

data.forEach(match=>{

let started=false;
let bench=false;

let appeared=false;
let forBarca=false;
let forOpponent=false;

for(let i=1;i<=11;i++){

if(match[`Player name ${i}`]===player){
    appeared=true;
    started=true;
    forBarca=true;
}

if(match[`Opp. Player name ${i}`]===player){
    appeared=true;
    started=true;
    forOpponent=true;
}

}

for(let i=1;i<=6;i++){

    if(match[`Sub on ${i}`]===player){
        appeared=true;
        forBarca=true;
    }

    if(match[`Opp. Sub on ${i}`]===player){
        appeared=true;
        forOpponent=true;
    }

}

let played = appeared;

for(let i=1;i<=12;i++){

if(
match[`On the bench name ${i}`]===player ||
match[`Opp. On the bench name ${i}`]===player
){
bench=true;
}

}

if(!played && !bench){
return;
}

const season=match.Season;

if(!stats[season]){

stats[season]={
matches:0,
goals:0,
penaltyGoals:0,
missedPenalties:0,
assists:0,
yellow:0,
red:0,
opponentClub:false,
games:[]
};

}

if(forOpponent){
    stats[season].opponentClub = true;
}

if(played){
    stats[season].matches++;
}

for(let i=1;i<=12;i++){

    if(
        match[`Goal Player ${i}`]===player ||
        match[`Opp. Goal Player ${i}`]===player
    ){
        stats[season].goals++;
    }

    if(
        match[`Assist Player ${i}`]===player ||
        match[`Opp. Assist Player ${i}`]===player
    ){
        stats[season].assists++;
    }

    if(
        match[`Yellow player ${i}`]===player ||
        match[`Opp. Yellow player ${i}`]===player
    ){
        stats[season].yellow++;
    }

    if(
        match[`Red player ${i}`]===player ||
        match[`Opp. Red player ${i}`]===player
    ){
        stats[season].red++;
    }

    let scored = null;

    if(match[`Penalty player ${i}`]===player){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty player ${i}`]===player){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        stats[season].penaltyGoals++;
    }

    if(scored==="not in"){
        stats[season].missedPenalties++;
    }

}

let gameGoals = 0;
let gameAssists = 0;
let gamePenaltyGoals = 0;
let gameMissedPenalties = 0;
let gameYellow = 0;
let gameRed = 0;

for(let i=1;i<=12;i++){

if(
    match[`Goal Player ${i}`]===player ||
    match[`Opp. Goal Player ${i}`]===player
){
    gameGoals++;
}

if(
    match[`Assist Player ${i}`]===player ||
    match[`Opp. Assist Player ${i}`]===player
){
    gameAssists++;
}

if(
    match[`Yellow player ${i}`]===player ||
    match[`Opp. Yellow player ${i}`]===player
){
    gameYellow++;
}

if(
    match[`Red player ${i}`]===player ||
    match[`Opp. Red player ${i}`]===player
){
    gameRed++;
}

let scored = null;

if(match[`Penalty player ${i}`]===player){
    scored = match[`Penalty scored ${i}`];
}

if(match[`Opp. Penalty player ${i}`]===player){
    scored = match[`Opp. Penalty scored ${i}`];
}

if(scored==="in"){
    gamePenaltyGoals++;
}

if(scored==="not in"){
    gameMissedPenalties++;
}

}

stats[season].games.push({
id:match.ID,
date:match.Date,
competition:match.Competition,
venue:match["Home/Away"],
opponent:match["Opp. Team"],
result:match.Result,
resultType: match["Result type"],
played: played,

goals: gameGoals,
assists: gameAssists,
penaltyGoals: gamePenaltyGoals,
missedPenalties: gameMissedPenalties,
yellow: gameYellow,
red: gameRed
});

});

let html="";

Object.keys(stats)
.sort()
.reverse()
.forEach((season,index)=>{

const seasonId=`season_${index}`;

stats[season].games.sort((a,b)=>{

const da =
new Date(a.date.split(".").reverse().join("-"));

const db =
new Date(b.date.split(".").reverse().join("-"));

return db - da;

});

html+=`

<tr
class="season-row ${stats[season].opponentClub ? 'opponent-season' : ''}"
onclick="toggleSeason('${seasonId}')"

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

button.textContent =
theme === "dark"
? "☀️"
: "🌙";

button.addEventListener("click",()=>{

const current =
document.documentElement.getAttribute("data-theme");

const next =
current === "dark"
? "light"
: "dark";

document.documentElement.setAttribute(
"data-theme",
next
);

localStorage.setItem(
"theme",
next
);

button.textContent =
next === "dark"
? "☀️"
: "🌙";

});

})();

</script>

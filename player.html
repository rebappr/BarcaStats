<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/theme.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#004D98 0%,transparent 35%),
radial-gradient(circle at top right,#A50044 0%,transparent 35%),
var(--bg);

color:var(--text);
min-height:100vh;
}

.theme-toggle{
position:fixed;
bottom:20px;
left:20px;

width:52px;
height:52px;

border:none;
border-radius:50%;

cursor:pointer;

background:#A50044;
color:white;

font-size:20px;
font-weight:700;

z-index:9999;
}

.container{
max-width:1500px;
margin:auto;
padding:10px;
}

.header{
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

padding:24px;
border-radius:28px;
color:white;
margin-bottom:10px;
}

.hero-subtitle{
font-size:13px;
opacity:.85;
margin-top:6px;
}

.player-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:20px;
display:flex;
align-items:center;
gap:20px;
margin-bottom:10px;
}

.player-photo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #004D98;
}

.player-info h1{
margin:0;
font-size:28px;
}

.player-meta{
margin-top:10px;
font-size:14px;
color:var(--muted);
}

.widget-title{
margin:8px 0 6px;
padding:8px 14px;
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

color:white;
font-size:14px;
font-weight:700;
border-radius:18px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:8px;
}

.summary-box{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:18px;
padding:12px;
text-align:center;
}

.summary-box b{
display:block;
font-size:26px;
margin-bottom:4px;
}

.widget-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:14px;
}

.stats-table{
width:100%;
border-collapse:collapse;
}

.stats-table th,
.stats-table td{
padding:8px;
border-bottom:1px solid var(--meta-border);
font-size:13px;
}

.stats-table th{
text-align:left;
}

.season-link{
cursor:pointer;
font-weight:700;
color:#004D98;
}

.season-link:hover{
text-decoration:underline;
}

.season-row{
transition:.2s;
}

.season-row:hover{
background:var(--meta-bg);
}


.matches-list{
display:none;
margin-top:8px;
padding:8px;
background:var(--meta-bg);
border-radius:12px;
}

.matches-list.active{
display:block;
}

.matches-header{
display:grid;
grid-template-columns:
80px
1fr
70px
140px
70px;

gap:10px;

font-size:11px;
font-weight:700;
text-transform:uppercase;

padding:8px;
margin-bottom:6px;

opacity:.7;
}

.player-match{
display:grid;
grid-template-columns:
80px
1fr
70px
140px
70px;

gap:10px;
align-items:center;

padding:8px;
font-size:12px;

border-bottom:1px solid var(--meta-border);
transition:.2s;
}

.player-match:hover{
background:var(--card-bg);
}

.player-match:last-child{
border-bottom:none;
}

.player-started{
border-left:4px solid #22c55e;
padding-left:10px;
}

.player-bench{
border-left:4px solid #f59e0b;
padding-left:10px;
}

.bench-label{
font-size:11px;
font-weight:700;
color:#f59e0b;
margin-left:6px;
}

.result-win{
color:#22c55e;
font-weight:700;
}

.result-draw{
color:#f59e0b;
font-weight:700;
}

.result-loss{
color:#ef4444;
font-weight:700;
}

@media(max-width:900px){

.player-card{
flex-direction:column;
text-align:center;
}

.summary-grid{
grid-template-columns:repeat(4,1fr);
}

}

</style>
</head>

<body>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

<div class="container">

<div class="header">
<h1>FC Barcelona</h1>
<div class="hero-subtitle">
Player Profile
</div>
</div>

<div id="playerProfile">
Loading...
</div>

</div>

<script>

const params =
new URLSearchParams(location.search);

const playerName =
params.get("name");

fetch("data.json")
.then(r=>r.json())
.then(data=>{

renderPlayer(playerName,data);

});

function renderPlayer(player,data){

let matches=0;
let goals=0;
let assists=0;
let penaltyGoals=0;
let missedPenalties=0;
let yellow=0;
let red=0;

let seasons=new Set();

data.forEach(match=>{

let appeared=false;

// základná zostava

for(let i=1;i<=11;i++){

if(
match[`Player name ${i}`]===player ||
match[`Opp. Player name ${i}`]===player
){
appeared=true;
}

}

// striedajúci hráč

for(let i=1;i<=6;i++){

if(
match[`Sub on ${i}`]===player ||
match[`Opp. Sub on ${i}`]===player
){
appeared=true;
}

}

if(appeared){

matches++;
seasons.add(match.Season);

}

for(let i=1;i<=12;i++){

if(match[`Goal Player ${i}`]===player){
goals++;
}

if(match[`Assist Player ${i}`]===player){
assists++;
}

for(let i=1;i<=5;i++){

if(match[`Penalty player ${i}`]===player){

if(match[`Penalty scored ${i}`]==="in"){
penaltyGoals++;
}

if(match[`Penalty scored ${i}`]==="not in"){
missedPenalties++;
}

}

for(let i=1;i<=12;i++){

if(match[`Red player ${i}`]===player){
red++;
}

}

}

});

document.getElementById("playerProfile").innerHTML=`

<div class="player-card">

<img
src="images/players/default.png"
class="player-photo">

<div class="player-info">

<h1>${player}</h1>

<div class="player-meta">
FC Barcelona
</div>

</div>

</div>

<div class="widget-title">
Career Statistics
</div>

<div class="summary-grid">

<div class="summary-box">
<b>${seasons.size}</b>
Seasons
</div>

<div class="summary-box">
<b>${matches}</b>
Matches
</div>

<div class="summary-box">
<b>${goals}</b>
Goals
</div>

<div class="summary-box">
<b>${assists}</b>
Assists
</div>

<div class="summary-box">
<b>${penaltyGoals}</b>
Penalty Goals
</div>

<div class="summary-box">
<b>${missedPenalties}</b>
Missed Penalties
</div>

<div class="summary-box">
<b>${yellow}</b>
Yellow
</div>

<div class="summary-box">
<b>${red}</b>
Red
</div>

</div>

<div class="widget-title">
Season Breakdown
</div>

<div class="widget-card">

<table class="stats-table">

<thead>
<tr>
<th>Season</th>
<th>Matches</th>
<th>Goals</th>
<th>Assists</th>
</tr>
</thead>

<tbody id="seasonRows">
</tbody>

</table>

</div>

`;

renderSeasonStats(player,data);

}

function toggleSeason(id){

document
.getElementById(id)
.classList.toggle("active");

}

function renderSeasonStats(player,data){

const stats={};

data.forEach(match=>{

let started=false;
let bench=false;

for(let i=1;i<=11;i++){

if(
match[`Player name ${i}`]===player ||
match[`Opp. Player name ${i}`]===player
){
started=true;
}

}

let played = started;

for(let i=1;i<=6;i++){

if(
match[`Sub on ${i}`]===player ||
match[`Opp. Sub on ${i}`]===player
){
played=true;
}

}

for(let i=1;i<=12;i++){

if(
match[`On the bench name ${i}`]===player ||
match[`Opp. On the bench name ${i}`]===player
){
bench=true;
}

}

if(!played && !bench){
return;
}

const season=match.Season;

if(!stats[season]){

stats[season]={
matches:0,
goals:0,
assists:0,
games:[]
};

}

if(played){
    stats[season].matches++;
}

for(let i=1;i<=12;i++){

if(match[`Goal Player ${i}`]===player){
stats[season].goals++;
}

if(match[`Assist Player ${i}`]===player){
stats[season].assists++;
}

}

stats[season].games.push({
id:match.ID,
date:match.Date,
competition:match.Competition,
venue:match["Home/Away"],
opponent:match["Opp. Team"],
result:match.Result,
resultType: match["Result type"],
played: played
});

});

let html="";

Object.keys(stats)
.sort()
.reverse()
.forEach((season,index)=>{

const seasonId=`season_${index}`;

stats[season].games.sort((a,b)=>{

const da =
new Date(a.date.split(".").reverse().join("-"));

const db =
new Date(b.date.split(".").reverse().join("-"));

return db - da;

});

html+=`

<tr
class="season-row"
onclick="toggleSeason('${seasonId}')"
style="cursor:pointer;">

<td>
<strong>${season}</strong>
</td>

<td>${stats[season].matches}</td>

<td>${stats[season].goals}</td>

<td>${stats[season].assists}</td>

</tr>

<tr>

<td colspan="4" style="padding:0;border:none;">

<div
id="${seasonId}"
class="matches-list">

<div class="matches-header">

<div>Date</div>
<div>Competition</div>
<div>Venue</div>
<div>Opponent</div>
<div>Result</div>

</div>

${stats[season].games.map(game=>`

<a
href="match.html?id=${game.id}"
style="
text-decoration:none;
color:inherit;
">

<div
class="player-match ${game.played ? 'player-started' : 'player-bench'}">

<div>
${game.date}
</div>

<div>
${game.competition}
</div>

<div>
${game.venue}
</div>

<div>
${game.opponent}
</div>

<div>

<strong class="${
game.result.startsWith("W") ? "result-win" :
game.result.startsWith("D") ? "result-draw" :
game.result.startsWith("L") ? "result-loss" :
""
}">
${game.result}
</strong>

</div>

</div>
</a>

`).join("")}

</div>

</td>

</tr>

`;

});

document.getElementById("seasonRows").innerHTML=
html;

}

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

button.textContent =
theme === "dark"
? "☀️"
: "🌙";

button.addEventListener("click",()=>{

const current =
document.documentElement.getAttribute("data-theme");

const next =
current === "dark"
? "light"
: "dark";

document.documentElement.setAttribute(
"data-theme",
next
);

localStorage.setItem(
"theme",
next
);

button.textContent =
next === "dark"
? "☀️"
: "🌙";

});

})();

</script>

</body>
</html>

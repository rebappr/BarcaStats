<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<title>Player Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#004D98 0%,transparent 35%),
radial-gradient(circle at top right,#A50044 0%,transparent 35%),
var(--bg);

color:var(--text);
min-height:100vh;
}

.theme-toggle{
position:fixed;
bottom:20px;
left:20px;

width:52px;
height:52px;

border:none;
border-radius:50%;

cursor:pointer;

background:#A50044;
color:white;

font-size:20px;
font-weight:700;

z-index:9999;
display:none;
}

.container{
max-width:1500px;
margin:auto;
padding:10px;
}

.header{
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

padding:24px;
border-radius:28px;
color:white;
margin-bottom:10px;
}

.header h1{
margin:0;
font-size:22px;
font-weight:700;
}

.hero-subtitle{
margin-top:8px;
font-size:16px;
font-weight:500;
color:rgba(255,255,255,.85);
}

.player-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:20px;
display:flex;
align-items:center;
gap:20px;
margin-bottom:10px;
}

.player-info h1{
margin:0;
font-size:22px;
}

.player-meta{
margin-top:12px;

display:flex;
flex-direction:column;
align-items:flex-start;

gap:6px;

font-size:14px;
color:var(--muted);
}

.player-meta div{
white-space:normal;
display:block;
width:100%;
}

.player-meta a{
font-weight:600;
text-decoration:none;
color:var(--link-color);
}

.player-meta a:hover{
text-decoration:underline;
}

.widget-title{
margin:8px 0 6px;
padding:8px 14px;
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

color:white;
font-size:14px;
font-weight:700;
border-radius:18px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:8px;
}

.summary-box{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:18px;
padding:12px;
text-align:center;
}

.summary-box b{
display:block;
font-size:26px;
margin-bottom:4px;
}

.widget-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:14px;
}

.stats-table{
width:100%;
border-collapse:collapse;
}

.stats-table th,
.stats-table td{
padding:8px;
border-bottom:1px solid var(--meta-border);
font-size:13px;
}

.stats-table th{
text-align:left;
}

.season-link{
cursor:pointer;
font-weight:700;
color:#004D98;
}

.season-link:hover{
text-decoration:underline;
}

.season-row{
transition:.2s;
}

.season-row:hover{
background:var(--meta-bg);
}

.opponent-season{
    background:#fff8c4;
    transition:.2s;
}

.opponent-season:hover{
    background:#fff2a3;
}

[data-theme="dark"] .opponent-season{
    background:#5b5420;
}

[data-theme="dark"] .opponent-season:hover{
    background:#746923;
}

.opponent-career .summary-box{
    background:#fff8c4;
    border-color:#eab308;
    color:#000;
}

[data-theme="dark"] .opponent-career .summary-box{
    background:#5b5420;
    border-color:#eab308;
    color:#fff;
}

.matches-list{
display:none;
padding:8px;
background:var(--meta-bg);
border-radius:12px;
max-width:1200px;
margin:8px 0 0 0;
}

.matches-list.active{
display:block;
}

.matches-header{
display:grid;
grid-template-columns:
35px
90px
80px
1fr
90px
40px
40px
40px
40px
40px
40px;

gap:10px;

font-size:12px;
font-weight:700;
text-transform:uppercase;

padding:8px;
margin-bottom:6px;

opacity:.7;
}

.player-match{
display:grid;
grid-template-columns:
35px
90px
80px
1fr
90px
40px
40px
40px
40px
40px
40px;

gap:10px;
align-items:center;

padding:8px;
font-size:13px;

border-bottom:1px solid var(--meta-border);
transition:.2s;
}

.stats-table th:first-child,
.stats-table td:first-child{
    text-align:left;
}

.stats-table th:not(:first-child),
.stats-table td:not(:first-child){
    text-align:center;
}

.player-match:hover{
background:var(--card-bg);
}

.player-match:last-child{
border-bottom:none;
}

.player-started{
border-left:4px solid #22c55e;
padding-left:10px;
}

.player-bench{
border-left:4px solid #f59e0b;
padding-left:10px;
}

.bench-label{
font-size:11px;
font-weight:700;
color:#f59e0b;
margin-left:6px;
}

.result-badge{
display:inline-block;
min-width:60px;
text-align:center;
border-radius:999px;
padding:4px 10px;
font-weight:700;
}

.result-win{
background:var(--result-win-bg);
border:1px solid var(--result-win);
color:var(--result-win);
}

.result-draw{
background:var(--result-draw-bg);
border:1px solid var(--result-draw);
color:var(--result-draw);
}

.result-loss{
background:var(--result-loss-bg);
border:1px solid var(--result-loss);
color:var(--result-loss);
}

.mobile{
display:none;
}

.competition-cell{
display:flex;
align-items:center;
gap:8px;
font-weight:600;
}

.competition-logo{
width:20px;
height:20px;
object-fit:contain;
flex-shrink:0;
}

.mobile-match-stats{
    display:none;
}

.player-club{
    margin-top:6px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
}

.club-title{
    background:#dbeafe;
    color:#1e3a8a;
    border:1px solid #93c5fd;
}

[data-theme="dark"] .club-title{
    background:#1e3a5f;
    color:#dbeafe;
    border:1px solid #3b82f6;
}

.main-menu{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:6px;

    margin-bottom:12px;
    padding-left:0;
}

.main-menu a{
    display:flex;
    align-items:center;
    justify-content:center;
    text-transform:uppercase;

    min-width:120px;
    padding:12px 20px;

    border-radius:14px;

    text-decoration:none;

    background:#004D98;
    border-color:#0a5fb3;

    color:white;

    font-size:14px;
    font-weight:700;

    transition:.2s;

    box-shadow:
        0 4px 12px rgba(0,77,152,.25);
}

.main-menu a:hover{
    transform:translateY(-2px);

    background:#0a5fb3;

    box-shadow:
        0 8px 20px rgba(0,77,152,.35);
}

.main-menu a.active{
    background:#A50044;
    border-color:#8b0038;
    color:white;
}

.main-menu a img{
    display:none;
}

.player-search-results{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.search-type{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
}

.search-type.player{
    background:rgba(0,77,152,.15);
    color:#3b82f6;
}

.search-type.manager{
    background:rgba(165,0,68,.15);
    color:#e11d48;
}

.player-search-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    border-radius:10px;
    text-decoration:none;
    color:var(--text);
    font-size:13px;
    font-weight:600;
}

.player-search-item:hover{
    background:var(--meta-bg);
}

.search-hero{
    margin:12px 0 0 0;
    display:none;
}

.search-hero.show{
    display:block;
}

.player-search-input{
    width:100%;
    height:58px;
    padding:0 20px;

    font-size:16px;
    color:var(--text);

    border-radius:20px;
    border:2px solid var(--card-border);

    background:var(--card-bg);

    box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    transition:.2s;

    margin-bottom:6px;
}

.search-hero .player-search-input:focus{
    outline:none;
    border-color:#3b82f6;

    box-shadow:
        0 0 0 4px rgba(59,130,246,.15);
}

@media(max-width:750px){



    .main-menu{
        position:fixed;

        left:12px;
        right:12px;
        bottom:10px;

        z-index:9999;

        display:flex;
        justify-content:space-around;
        align-items:center;

        margin:0;
        padding:4px 6px;

        border-radius:22px;

        background:rgba(255,255,255,.14);

        backdrop-filter:blur(25px);
        -webkit-backdrop-filter:blur(25px);

        border:1px solid rgba(255,255,255,.18);

        box-shadow:
            0 8px 24px rgba(0,0,0,.16),
            inset 0 1px 0 rgba(255,255,255,.25);
    }

    .main-menu a{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-transform:uppercase;
    
        gap:3px;
    
        min-width:58px;
    
        padding:6px 8px;
    
        border-radius:18px;
    
        background:#0A5FB3;
    
        backdrop-filter:blur(15px);
    }

    .main-menu a:hover{
        background:#004D98;
    
        backdrop-filter:blur(15px);
        -webkit-backdrop-filter:blur(15px);
    }
    
    .main-menu a.active{
        background:#A50044;
        color:white;
    
        box-shadow:
            0 4px 12px rgba(0,77,152,.35);
    
        backdrop-filter:blur(15px);
        -webkit-backdrop-filter:blur(15px);
    }

    .main-menu a img{
        display:block;
        width:28px;
        height:28px;
        object-fit:contain;
    }

    .main-menu a span{
        font-size:9px;
        font-weight:600;
        line-height:1;
    }

    body{
        padding-bottom:65px;
    }

.player-match div:nth-child(6),
.player-match div:nth-child(7),
.player-match div:nth-child(8),
.player-match div:nth-child(9),
.player-match div:nth-child(10),
.player-match div:nth-child(11){
    display:none;
}

.matches-header div:nth-child(6),
.matches-header div:nth-child(7),
.matches-header div:nth-child(8),
.matches-header div:nth-child(9),
.matches-header div:nth-child(10),
.matches-header div:nth-child(11){
    display:none;
}

.matches-header{
grid-template-columns:
30px
90px
1fr
70px;
}

.player-match{
grid-template-columns:
30px
90px
1fr
70px;

row-gap:8px;
}

.mobile-match-stats{
    display:block;
    grid-column:1 / -1;

    margin-top:6px;
    padding-top:6px;

    border-top:1px solid var(--meta-border);
}

.mobile-stats-header,
.mobile-stats-values{
    display:grid;
    grid-template-columns:repeat(6,1fr);

    text-align:center;
}

.mobile-stats-header{
    font-size:10px;
    font-weight:700;
    opacity:.7;
    margin-bottom:4px;
}

.mobile-stats-values{
    font-size:12px;
    font-weight:600;
}

.competition-logo{
width:18px;
height:18px;
}

.desktop{
display:none;
}

.mobile{
display:inline;
}

.player-card{
    flex-direction:column;
    align-items:flex-start;
}

.player-info{
    width:100%;
}

.player-info h1{

}

}

}

}

}

.matches-header div:nth-child(3),
.player-match div:nth-child(3){

}

</style>
</head>

<body>

<button id="themeToggle" class="theme-toggle">
    🌙
</button>

<div class="container">

<div class="header">
<h1>Barça - Historical Database</h1>
<div class="hero-subtitle">
Player Profile
</div>
</div>

<nav class="main-menu">

    <a href="index.html">
        <img src="icons/home-48.png">
        <span>Home</span>
    </a>

    <a href="season.html">
        <img src="icons/seasons-48.png">
        <span>Seasons</span>
    </a>

    <a href="#">
        <img src="icons/stats-48.png">
        <span>Statistics</span>
    </a>

    <a href="#">
        <img src="icons/records-48.png">
        <span>Records</span>
    </a>

    <a href="#" id="searchToggle">
        <img src="icons/search-48.png">
        <span>Search</span>
    </a>

</nav>

<div class="search-hero">

    <input
        type="text"
        id="personSearch"
        placeholder="Search player or manager..."
        class="player-search-input">

    <div id="personSearchResults"></div>

</div>

<div id="playerProfile">
Loading...
</div>

</div>

<script>

const params =
new URLSearchParams(location.search);

const playerName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronacion": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de Espana": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

let allMatches = [];
let allPlayers = [];

Promise.all([
fetch("data.json").then(r=>r.json()),
fetch("players.json").then(r=>r.json())
])
.then(([data,players])=>{

    allMatches = data;
    allPlayers = players;

    renderPlayer(playerName,data,players);

    initPersonSearch();

});

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function statValue(value){
    return value === 0 ? "-" : value;
}

function renderPlayer(player,data,players){

const playerInfo =
players.find(p => p.Player === player);

const playerMatches = [];

data.forEach(match=>{

let appeared = false;

for(let i=1;i<=11;i++){

    if(match[`Player name ${i}`]===player){
        appeared = true;
    }

    if(match[`Opp. Player name ${i}`]===player){
        appeared = true;
    }

}

for(let i=1;i<=6;i++){

if(
match[`Sub on ${i}`]===player ||
match[`Opp. Sub on ${i}`]===player
){
appeared = true;
}

}

if(appeared){
playerMatches.push(match);
}

});

playerMatches.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da-db;

});

const barcaMatches = playerMatches.filter(match => {

    for(let i=1;i<=11;i++){

        if(match[`Player name ${i}`] === player){
            return true;
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`] === player){
            return true;
        }

    }

    return false;

});

const debut =
barcaMatches.length
? barcaMatches[0]
: null;

const lastMatch =
barcaMatches.length
? barcaMatches[barcaMatches.length - 1]
: null;

let nationality =
playerInfo?.["Nationality 1"] || "";

if(playerInfo?.["Nationality 2"]){

nationality +=
" / " +
playerInfo["Nationality 2"];

}

const clubStats = {};

data.forEach(match=>{

    let forOpponent = false;
    let appeared = false;
    let bench = false;

    for(let i=1;i<=11;i++){

        if(match[`Player name ${i}`]===player){
            appeared = true;
        }

        if(match[`Opp. Player name ${i}`]===player){
            appeared = true;
            forOpponent = true;
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]===player){
            appeared = true;
        }

        if(match[`Opp. Sub on ${i}`]===player){
            appeared = true;
            forOpponent = true;
        }

    }

    for(let i=1;i<=12;i++){
    
        if(match[`On the bench name ${i}`]===player){
            bench = true;
        }
    
        if(match[`Opp. On the bench name ${i}`]===player){
            bench = true;
            forOpponent = true;
        }

    }

    if(!appeared && !bench){
        return;
    }
    
    const club = forOpponent
        ? match["Opp. Team"]
        : "FC Barcelona";
    
    if(!clubStats[club]){
    
        clubStats[club] = {
            seasons: new Set(),
            matches:0,
            goals:0,
            assists:0,
            penaltyGoals:0,
            missedPenalties:0,
            yellow:0,
            red:0
        };
    
    }
    
    clubStats[club].seasons.add(match.Season);
    if(appeared){
        clubStats[club].matches++;
    }

for(let i=1;i<=12;i++){

    if(
        match[`Goal Player ${i}`]===player ||
        match[`Opp. Goal Player ${i}`]===player
    ){
        clubStats[club].goals++;
    }

    if(
        match[`Assist Player ${i}`]===player ||
        match[`Opp. Assist Player ${i}`]===player
    ){
        clubStats[club].assists++;
    }

    if(
        match[`Yellow player ${i}`]===player ||
        match[`Opp. Yellow player ${i}`]===player
    ){
        clubStats[club].yellow++;
    }

    if(
        match[`Red player ${i}`]===player ||
        match[`Opp. Red player ${i}`]===player
    ){
        clubStats[club].red++;
    }

    let scored = null;

    if(match[`Penalty player ${i}`]===player){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty player ${i}`]===player){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        clubStats[club].penaltyGoals++;
    }

    if(scored==="not in"){
        clubStats[club].missedPenalties++;
    }

}

});

const clubs = [];

playerMatches.forEach(match => {

    let club = null;

    for(let i=1;i<=11;i++){

        if(match[`Player name ${i}`] === player){
            club = "FC Barcelona";
        }

        if(match[`Opp. Player name ${i}`] === player){
            club = match["Opp. Team"];
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`] === player){
            club = "FC Barcelona";
        }

        if(match[`Opp. Sub on ${i}`] === player){
            club = match["Opp. Team"];
        }

    }

    if(club && !clubs.includes(club)){
        clubs.push(club);
    }

});

const playerClub = clubs.join(", ");

document.getElementById("playerProfile").innerHTML=`

<div class="player-card">

<div class="player-info">

<h1>${player} (Player)</h1>

${playerClub ? `
<div class="player-club">
    ${playerClub}
</div>
` : ""}

<div class="player-meta">

${playerInfo?.["Full Name"] ? `

<div>
<b>Full Name:</b>
${playerInfo["Full Name"]}
</div>

` : ""}

${playerInfo?.["Date of Birth"] ? `

<div>
<b>Born:</b>
${playerInfo["Date of Birth"]}
(${calculateAge(
    playerInfo["Date of Birth"],
    playerInfo["Death Date"]
)})
</div>

` : ""}

${playerInfo?.["Death Date"] ? `

<div>
<b>Died:</b>
${playerInfo["Death Date"]}
</div>

` : ""}

${nationality ? `

<div>
<b>Nationality:</b>
${nationality}
</div>

` : ""}

${playerInfo?.Position ? `

<div>
<b>Main Position:</b>
${playerInfo.Position}
</div>

` : ""}

${debut ? `
<div>
    <b>Debut:</b>
    <a href="match.html?id=${debut.ID}">
        ${debut.Date} vs ${debut["Opp. Team"]} (${debut.Result})
    </a>
</div>
` : ""}


${lastMatch ? `

<div>
<b>Last Match:</b>
<a href="match.html?id=${lastMatch.ID}"> 
    ${lastMatch.Date} vs ${lastMatch["Opp. Team"]} (${lastMatch.Result})
</a>
</div>

` : ""}

</div>

</div>

</div>

<div class="widget-title">
Statistics
</div>

${Object.entries(clubStats)

.sort(([clubA],[clubB]) => {

    if(clubA === "FC Barcelona") return -1;

function toggleSeason(id){

document
.getElementById(id)
.classList.toggle("active");

}

function renderSeasonStats(player,data){

const stats={};

data.forEach(match=>{

let started=false;
let bench=false;

let appeared=false;
let forBarca=false;
let forOpponent=false;

for(let i=1;i<=11;i++){

if(match[`Player name ${i}`]===player){
    appeared=true;
    started=true;
    forBarca=true;
}

if(match[`Opp. Player name ${i}`]===player){
    appeared=true;
    started=true;
    forOpponent=true;
}

}

for(let i=1;i<=6;i++){

    if(match[`Sub on ${i}`]===player){
        appeared=true;
        forBarca=true;
    }

    if(match[`Opp. Sub on ${i}`]===player){
        appeared=true;
        forOpponent=true;
    }

}

let played = appeared;

for(let i=1;i<=12;i++){

if(
match[`On the bench name ${i}`]===player ||
match[`Opp. On the bench name ${i}`]===player
){
bench=true;
}

}

if(!played && !bench){
return;
}

const season=match.Season;

if(!stats[season]){

stats[season]={
matches:0,
goals:0,
penaltyGoals:0,
missedPenalties:0,
assists:0,
yellow:0,
red:0,
opponentClub:false,
games:[]
};

}

if(forOpponent){
    stats[season].opponentClub = true;
}

if(played){
    stats[season].matches++;
}

for(let i=1;i<=12;i++){

    if(
        match[`Goal Player ${i}`]===player ||
        match[`Opp. Goal Player ${i}`]===player
    ){
        stats[season].goals++;
    }

    if(
        match[`Assist Player ${i}`]===player ||
        match[`Opp. Assist Player ${i}`]===player
    ){
        stats[season].assists++;
    }

    if(
        match[`Yellow player ${i}`]===player ||
        match[`Opp. Yellow player ${i}`]===player
    ){
        stats[season].yellow++;
    }

    if(
        match[`Red player ${i}`]===player ||
        match[`Opp. Red player ${i}`]===player
    ){
        stats[season].red++;
    }

    let scored = null;

    if(match[`Penalty player ${i}`]===player){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty player ${i}`]===player){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        stats[season].penaltyGoals++;
    }

    if(scored==="not in"){
        stats[season].missedPenalties++;
    }

}

let gameGoals = 0;
let gameAssists = 0;
let gamePenaltyGoals = 0;
let gameMissedPenalties = 0;
let gameYellow = 0;
let gameRed = 0;

for(let i=1;i<=12;i++){

if(
    match[`Goal Player ${i}`]===player ||
    match[`Opp. Goal Player ${i}`]===player
){
    gameGoals++;
}

if(
    match[`Assist Player ${i}`]===player ||
    match[`Opp. Assist Player ${i}`]===player
){
    gameAssists++;
}

if(
    match[`Yellow player ${i}`]===player ||
    match[`Opp. Yellow player ${i}`]===player
){
    gameYellow++;
}

if(
    match[`Red player ${i}`]===player ||
    match[`Opp. Red player ${i}`]===player
){
    gameRed++;
}

let scored = null;

if(match[`Penalty player ${i}`]===player){
    scored = match[`Penalty scored ${i}`];
}

if(match[`Opp. Penalty player ${i}`]===player){
    scored = match[`Opp. Penalty scored ${i}`];
}

if(scored==="in"){
    gamePenaltyGoals++;
}

if(scored==="not in"){
    gameMissedPenalties++;
}

}

stats[season].games.push({
id:match.ID,
date:match.Date,
competition:match.Competition,
venue:match["Home/Away"],
opponent:match["Opp. Team"],
result:match.Result,
resultType: match["Result type"],
played: played,

goals: gameGoals,
assists: gameAssists,
penaltyGoals: gamePenaltyGoals,
missedPenalties: gameMissedPenalties,
yellow: gameYellow,
red: gameRed
});

});

let html="";

Object.keys(stats)
.sort()
.reverse()
.forEach((season,index)=>{

const seasonId=`season_${index}`;

stats[season].games.sort((a,b)=>{

const da =
new Date(a.date.split(".").reverse().join("-"));

const db =
new Date(b.date.split(".").reverse().join("-"));

return db - da;

});

html+=`

<tr
class="season-row ${stats[season].opponentClub ? 'opponent-season' : ''}"
onclick="toggleSeason('${seasonId}')"
style="cursor:pointer;">

<td>
<strong>${season}</strong>
</td>

<td>${statValue(stats[season].matches)}</td>
<td>${statValue(stats[season].goals)}</td>
<td>${statValue(stats[season].assists)}</td>
<td>${statValue(stats[season].penaltyGoals)}</td>
<td>${statValue(stats[season].missedPenalties)}</td>
<td>${statValue(stats[season].yellow)}</td>
<td>${statValue(stats[season].red)}</td>

</tr>

<tr>

<td colspan="8" style="padding:0;border:none;">

<div
id="${seasonId}"
class="matches-list">

<div class="matches-header">

<div></div>
<div>Date</div>
<div>Venue</div>
<div>Opponent</div>
<div>Result</div>
<div>G</div>
<div>A</div>
<div>PG</div>
<div>MP</div>
<div>YC</div>
<div>RC</div>

</div>

${stats[season].games.map(game=>`

<a
href="match.html?id=${game.id}"
style="
text-decoration:none;
color:inherit;
">

<div
class="player-match ${game.played ? 'player-started' : 'player-bench'}">

    <div class="competition-cell">
        ${competitionLogos[game.competition] ? `
        <img
            src="logos/${competitionLogos[game.competition]}"
            class="competition-logo"
            alt="${game.competition}"
            title="${game.competition}">
        ` : ""}
    </div>

    <div>${game.date}</div>
        
    <div>${game.venue}</div>

    <div>${game.opponent}</div>

    <div>
        <span class="result-badge ${
            game.resultType === "W" ? "result-win" :
            game.resultType === "D" ? "result-draw" :
            game.resultType === "L" ? "result-loss" :
            ""
        }">
            ${game.result}
        </span>
    </div>

    <div>${statValue(game.goals)}</div>
    
    <div>${statValue(game.assists)}</div>
    
    <div>${statValue(game.penaltyGoals)}</div>
    
    <div>${statValue(game.missedPenalties)}</div>
    
    <div>${statValue(game.yellow)}</div>
    
    <div>${statValue(game.red)}</div>

    <div class="mobile-match-stats">

        <div class="mobile-stats-header">
            <span>G</span>
            <span>A</span>
            <span>PG</span>
            <span>MP</span>
            <span>YC</span>
            <span>RC</span>
        </div>

        <div class="mobile-stats-values">
            <span>${statValue(game.goals)}</span>
            <span>${statValue(game.assists)}</span>
            <span>${statValue(game.penaltyGoals)}</span>
            <span>${statValue(game.missedPenalties)}</span>
            <span>${statValue(game.yellow)}</span>
            <span>${statValue(game.red)}</span>
        </div>

    </div>

</div>

</a>

`).join("")}

</div>

</td>

</tr>

`;

});

document.getElementById("seasonRows").innerHTML=
html;

}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    const input =
        document.getElementById("personSearch");

    const results =
        document.getElementById("personSearchResults");

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";
            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

            results.innerHTML = `
            <div class="player-search-results">
            ${filtered.map(item => `
            <a
                class="player-search-item"
                href="${
                    item.type === 'Manager'
                    ? `manager.html?name=${encodeURIComponent(item.name)}`
                    : `player.html?name=${encodeURIComponent(item.name)}`
                }">
            ${item.name}
            <span class="search-type ${item.type.toLowerCase()}">
               ${item.type}
            </span>
            </a>
            `).join("")}
            </div>
            `;
});
}


(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

if(button){

    button.textContent =
    theme === "dark"
    ? "☀️"
    : "🌙";

    button.addEventListener("click", () => {

        const current =
        document.documentElement.getAttribute("data-theme");

        const next =
        current === "dark"
        ? "light"
        : "dark";

        document.documentElement.setAttribute(
            "data-theme",
            next
        );

        localStorage.setItem(
            "theme",
            next
        );

        button.textContent =
        next === "dark"
        ? "☀️"
        : "🌙";

    });

}

})();


const searchToggle =
    document.getElementById("searchToggle");

if(searchToggle){

    searchToggle.addEventListener("click", e => {

        e.preventDefault();

        const searchBox =
            document.querySelector(".search-hero");

        const results =
            document.getElementById("personSearchResults");

        const input =
            document.getElementById("personSearch");

        searchBox.classList.toggle("show");

        if(searchBox.classList.contains("show")){

            input.focus();

        }else{

            input.value = "";
            results.innerHTML = "";

        }

    });

}

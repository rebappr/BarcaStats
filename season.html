<script>

window.onerror = function(msg, src, line, col, err){
    alert(
        "ERROR: " + msg +
        "\nLINE: " + line +
        "\nCOL: " + col
    );
};

let allMatches = [];
let allPlayers = [];
let playerBirthDates = {};
let tableView = "short";

let matchFilter = "played"; 
let matchesView = "all";

let season =
new URLSearchParams(
location.search
).get("season");

let statsSortColumn = "goals";
let statsSortDirection = "desc";

const competitionLogos = {
"Copa del Rey": "copa.png",
"Copa de la Liga": "copa-liga.png",
"Copa de la Coronación": "copa.png",
"FIFA Club World Cup": "fifa.png",
"Qualification for La Liga": "laliga.png",
"La Liga": "laliga.png",
"Supercopa de España": "supercopa.png",
"UEFA Champions League": "ucl.png",
"Cup Winners' Cup": "cwc.png",
"UEFA Europa League": "europa.png",
"UEFA Super Cup": "uefa-supercup.png",
"UEFA Cup": "uefa-cup.png",
"Inter-Cities Fairs Cup": "inter-cup.png",
"European Cup": "ec.png"
};

function renderSeason(){

const seasonMatches =
allMatches.filter(
x => x.Season === season
);

document.getElementById("seasonMatches").innerHTML =
buildCurrentSeasonMatches(seasonMatches);

if(!seasonMatches.length){

document.getElementById(
"seasonMatches"
).innerHTML =
"<div class='empty'>Season not found</div>";

return;
}

const playedMatches = seasonMatches.filter(
x => x.Result &&
x.Result !== "-:-"
);

const wins =
playedMatches.filter(
x => x["Result type"] === "W"
).length;

const draws =
playedMatches.filter(
x => x["Result type"] === "D"
).length;

const losses =
playedMatches.filter(
x => x["Result type"] === "L"
).length;

let goalsFor = 0;
let goalsAgainst = 0;

playedMatches.forEach(match => {

const homeGoals =
Number(match["Goals home team"]) || 0;

const awayGoals =
Number(match["Goals away team"]) || 0;

if(match["Home/Away"] === "Home"){

goalsFor += homeGoals;
goalsAgainst += awayGoals;

}else{

goalsFor += awayGoals;
goalsAgainst += homeGoals;

}

});

document.getElementById(
"seasonOverview"
).innerHTML = `

<div class="summary-grid">

   <div class="summary-box matches">
       <b>${playedMatches.length}</b>
       Matches
   </div>

   <div class="summary-box wins">
       <b>${wins}</b>
       Wins
   </div>

   <div class="summary-box draws">
       <b>${draws}</b>
       Draws
   </div>

   <div class="summary-box losses">
       <b>${losses}</b>
       Losses
   </div>

   <div class="summary-box goals">

  <table class="debutants-table">

          <tr>
              <th>Player</th>
              <th>Debut Date</th>
              <th>Age at Debut</th>
          </tr>
      </thead>
      <tbody>
`;

const selectedSeason = season;

const firstAppearance = {};

// prejde celú históriu
allMatches.forEach(match => {

const matchDate =
new Date(
match.Date.split(".").reverse().join("-")
);

const playersInMatch = [];

for(let i = 1; i <= 11; i++){

const player =
match[`Player name ${i}`];

if(player){
playersInMatch.push(player);
}

}

for(let i = 1; i <= 12; i++){

const player =
match[`Sub on ${i}`];

if(player){
playersInMatch.push(player);
}

}

playersInMatch.forEach(player => {

if(
!firstAppearance[player] ||
matchDate < firstAppearance[player].date
){

firstAppearance[player] = {
season: match.Season,
date: matchDate,
dateText: match.Date,
birthDate:
playerBirthDates[String(player).trim()] || ""
};

}

});

});

const debutants = Object.entries(firstAppearance)
.filter(
([name, data]) =>
data.season === selectedSeason
)
.sort(
(a, b) => a[1].date - b[1].date
);

debutants.forEach(([player,data]) => {

let ageText = "-";

if(data.birthDate){

const birth =
new Date(
data.birthDate
.split(".")
.reverse()
.join("-")
);

const debut =
data.date;

const diffDays =
Math.floor(
(debut - birth) /
(1000 * 60 * 60 * 24)
);

const years =
Math.floor(diffDays / 365.25);

const days =
Math.floor(
diffDays -
years * 365.25
);

ageText =
`${years}y ${days}d`;
}

html += `
      <tr>
          <td><a class="player-link" href="player.html?name=${encodeURIComponent(player)}">${player}</a></td>
          <td>${data.dateText}</td>
          <td>${ageText}</td>
      </tr>
  `;

});

html += `
      </tbody>
  </table>
`;

document.getElementById("seasonSummary").innerHTML = html;
}

function renderStatistics(matches) {

const players = {};

function addPlayer(name) {

if (!name || !String(name).trim()) return false;

name = String(name).trim();

if (name.includes("(OG)")) return false;

if (!players[name]) {
players[name] = {
squad: 0,
xi: 0,
goals: 0,
assists: 0,
yellow: 0,
red: 0
};
}

return true;
}

matches.forEach(match => {

// základná 11
for (let i = 1; i <= 11; i++) {

const player =
match[`Player name ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {

addPlayer(player);

players[player].squad++;
players[player].xi++;

}

}

// lavička
for (let i = 1; i <= 12; i++) {

const player =
match[`On the bench name ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {

addPlayer(player);

players[player].squad++;

}

}

// góly
for (let i = 1; i <= 12; i++) {

const player =
match[`Goal Player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].goals++;
}

}

// asistencie
for (let i = 1; i <= 12; i++) {

const player =
match[`Assist Player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].assists++;
}

}

// žlté
for (let i = 1; i <= 12; i++) {

const player =
match[`Yellow player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].yellow++;
}

}

// červené
for (let i = 1; i <= 5; i++) {

const player =
match[`Red player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].red++;
}

}

});

const sortedPlayers = Object.entries(players);

sortedPlayers.sort((a,b) => {

const valueA =
statsSortColumn === "name"
? a[0]
: a[1][statsSortColumn];

const valueB =
statsSortColumn === "name"
? b[0]
: b[1][statsSortColumn];

if (typeof valueA === "string") {

return statsSortDirection === "asc"
? valueA.localeCompare(valueB)
: valueB.localeCompare(valueA);

}

return statsSortDirection === "asc"
? valueA - valueB
: valueB - valueA;

});

let html = `
  <div class="table-scroll">
  <table class="stats-table">
      <thead>
          <tr>
              <th class="${statsSortColumn==='name'?'stats-selected':''}" onclick="sortStats('name')">Player</th>
              <th class="${statsSortColumn==='squad'?'stats-selected':''}" onclick="sortStats('squad')">Sq</th>
              <th class="${statsSortColumn==='xi'?'stats-selected':''}" onclick="sortStats('xi')">XI</th>
              <th class="${statsSortColumn==='goals'?'stats-selected':''}" onclick="sortStats('goals')">G</th>
              <th class="${statsSortColumn==='assists'?'stats-selected':''}" onclick="sortStats('assists')">A</th>
              <th class="${statsSortColumn==='yellow'?'stats-selected':''}" onclick="sortStats('yellow')">Y</th>
              <th class="${statsSortColumn==='red'?'stats-selected':''}" onclick="sortStats('red')">R</th>
          </tr>
      </thead>
      <tbody>
`; 

sortedPlayers.forEach(([name, stats]) => {

html += `
<tr>
  <td class="${statsSortColumn==='name'?'stats-selected':''}">
     <a class="player-link" href="player.html?name=${encodeURIComponent(name)}">
        ${name}
     </a>
  </td>
  <td class="${statsSortColumn==='squad'?'stats-selected':''}">
      ${stats.squad}
  </td>
  <td class="${statsSortColumn==='xi'?'stats-selected':''}">
      ${stats.xi}
  </td>
  <td class="${statsSortColumn==='goals'?'stats-selected':''}">
      ${stats.goals}
  </td>
  <td class="${statsSortColumn==='assists'?'stats-selected':''}">
      ${stats.assists}
  </td>
  <td class="${statsSortColumn==='yellow'?'stats-selected':''}">
      ${stats.yellow}
  </td>
  <td class="${statsSortColumn==='red'?'stats-selected':''}">
      ${stats.red}
  </td>
</tr>
`;

});

html += `
      </tbody>
  </table>
  </div>
`;

document.getElementById("statistics").innerHTML = html;

}

Promise.all([
fetch("data.json").then(r => r.json()),
fetch("current-season.json").then(r => r.json()),
fetch("players.json").then(r => r.json())
])
.then(([matchesData,currentData,playersData]) => {

function normalizeName(name){
return String(name || "")
.toLowerCase()
.replace(/\bfc\b/g,"")
.replace(/\bcf\b/g,"")
.replace(/./g,"")
.replace(/\s+/g," ")
.trim();
}

currentData.forEach(currentMatch => {

const match = matchesData.find(m =>

m.Date === currentMatch.Date &&
m.Competition === currentMatch.Competition &&
m["Home/Away"] === currentMatch["Home/Away"] &&
normalizeName(m["Opp. Team"]) ===
normalizeName(currentMatch["Opp. Team"])

);

if(match){

match.Result = currentMatch.Result;

if(
match.Result &&
match.Result !== "-:-" &&
match.Result.includes(":")
){

const [homeGoals,awayGoals] =
match.Result.split(":").map(Number);

if(match["Home/Away"] === "Home"){

match["Result type"] =
homeGoals > awayGoals ? "W" :
homeGoals < awayGoals ? "L" : "D";

}else{

match["Result type"] =
awayGoals > homeGoals ? "W" :
awayGoals < homeGoals ? "L" : "D";

}

}

}

});

allMatches = matchesData;

if(!season){
season = [...new Set(matchesData.map(x => x.Season))]
.sort()
.reverse()[0];
}

allPlayers = playersData;

playersData.forEach(player => {
playerBirthDates[player.Player.trim()] =
player["Date of Birth"];
});

renderSeasonDropdown();
renderSeason();
initPersonSearch();

})
.catch(error => console.error(error));

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    const input =
        document.getElementById("personSearch");

    const results =
        document.getElementById("personSearchResults");

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";
            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

            results.innerHTML = `
            <div class="player-search-results">
            ${filtered.map(item => `
            <a
                class="player-search-item"
                href="${
				    item.type === 'Manager'
				        ? `manager.html?name=${encodeURIComponent(item.name)}`
				        : item.type === 'Opponent'
				            ? `opponent.html?name=${encodeURIComponent(item.name)}`
				            : `player.html?name=${encodeURIComponent(item.name)}`
				}">
				${item.name}
				<span class="search-type ${item.type.toLowerCase()}">
				   (${item.type})
				</span>
            </a>
            `).join("")}
            </div>
            `;
});
}

document.addEventListener("DOMContentLoaded", () => {

    const mainMenu = document.querySelector(".main-menu");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){
        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");
        menuToggle.textContent = "☰";
    }

    function openMenu(){
        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");
        menuToggle.textContent = "✕";
    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener("click", closeMenu);

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

});

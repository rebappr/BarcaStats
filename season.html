<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top left,#004D98 0%,transparent 35%),
radial-gradient(circle at top right,#A50044 0%,transparent 35%),
var(--bg);
color:var(--text);
font-size:13px;
min-height:100vh;
    -webkit-text-size-adjust:100%;

}

.theme-toggle{
position:fixed;
left:20px;
bottom:20px;

width:52px;
height:52px;

border:none;
border-radius:50%;

cursor:pointer;

background:#A50044;
color:white;

font-size:20px;
font-weight:700;

z-index:9999;
display:none;
}

.content-layout{
display:flex;
gap:6px;
align-items:flex-start;
}

.content-layout.animate{
animation:pageRefresh .4s ease;
}

@keyframes pageRefresh{
from{
opacity:0;
transform:translateY(20px) scale(.98);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.left-panel{
flex:1.1;
min-width:0;
}

.right-panel{
flex:.9;
min-width:0;
}

.section-title{
margin:0 0 6px;
padding:10px 14px;
backdrop-filter:blur(20px);
border-radius:24px;
background:var(--card-bg);
border:1px solid var(--card-border);
color:var(--text);
font-size:18px;
}

.competition-title,
.widget-title{
margin:8px 0 6px;
padding:8px 14px;
background:
linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);
color:white;
font-size:14px;
font-weight:700;
border-radius:18px;
letter-spacing:.5px;
box-shadow:
0 10px 25px rgba(0,0,0,.25);
}

.widget-card{
background:var(--card-bg);
backdrop-filter:blur(20px);
border:1px solid var(--card-border);
border-radius:24px;
padding:14px;
margin-bottom:10px;
transition:.3s;
}

.widget-card h2{
margin-top:0;
font-size:18px;
color:var(--text);
}

.container{
max-width:1500px;
margin:auto;
padding:20px;
}

.header-row{
display:flex;
align-items:center;
gap:12px;
}

.season-badge{
padding:4px 10px;
border-radius:999px;
background:rgba(255,255,255,.2);
border:1px solid rgba(255,255,255,.3);
font-size:13px;
font-weight:600;
color:white;
}

.season-selector{
    margin-top:8px;   /* bolo 12px */
    max-width:200px;  /* môže byť aj širší */
}

.season-selector select{
    height:35px;      /* hrubší */
    background:rgba(255,255,255,.15);
    color:white;
    border:1px solid rgba(255,255,255,.25);
    border-radius:24px;
    padding:0 18px;
    backdrop-filter:blur(12px);
    font-size:14px;
    font-weight:600;
}

.season-selector select option{
    background:#0f2d6b;
    color:white;
}

.header{
    background:
    linear-gradient(
        135deg,
        rgba(0,77,152,.95),
        rgba(165,0,68,.95)
    );

    border-radius:28px;
    color:white;
    margin-bottom:4px;

    0 20px 50px rgba(0,0,0,.25);
}

.hero-subtitle{
margin-top:8px;
font-size:16px;
font-weight:500;
color:rgba(255,255,255,.85);
}

.summary-grid{

gap:8px;
margin-bottom:10px;
}

.summary-box{

padding:10px;
text-align:center;
border:1px solid var(--card-border);
background:var(--card-bg);
}

.summary-box b{
display:block;
font-size:22px;

}

/* Wins */
.summary-box.wins{

}

/* Draws */
.summary-box.draws{

color:var(--result-draw);
}

/* Losses */
.summary-box.losses{

}

.summary-box.matches{

    color:#ffffff;
}

.matches-table th:nth-child(3),

.matches-table th:nth-child(4),

<script>

let allMatches = [];
let allPlayers = [];
let playerBirthDates = {};

let matchFilter = "played"; 

let season =
new URLSearchParams(
location.search
).get("season");

let statsSortColumn = "goals";
let statsSortDirection = "desc";

function animateContent(){

    const layout =
    document.querySelector(".content-layout");

    if(!layout) return;

    layout.classList.remove("animate");

    void layout.offsetWidth;

    layout.classList.add("animate");

}

function renderSeason(){

    const seasonMatches =
    allMatches.filter(
        x => x.Season === season
    );

    if(!seasonMatches.length){

        document.getElementById(
            "matches"
        ).innerHTML =
        "<div class='empty'>Season not found</div>";

        return;
    }

      const playedMatches = seasonMatches.filter(
          x => x.Result &&
               x.Result !== "-:-"
      );

      const wins =
      playedMatches.filter(
          x => x["Result type"] === "W"
      ).length;
      
      const draws =
      playedMatches.filter(
          x => x["Result type"] === "D"
      ).length;
      
      const losses =
      playedMatches.filter(
          x => x["Result type"] === "L"
      ).length;

let goalsFor = 0;
let goalsAgainst = 0;

playedMatches.forEach(match => {

    const homeGoals =
        Number(match["Goals home team"]) || 0;

    const awayGoals =
        Number(match["Goals away team"]) || 0;

    if(match["Home/Away"] === "Home"){

        goalsFor += homeGoals;
        goalsAgainst += awayGoals;

    }else{

        goalsFor += awayGoals;
        goalsAgainst += homeGoals;

    }

});

   document.getElementById(
    "seasonOverview"
).innerHTML = `

<div class="summary-grid">

    <div class="summary-box matches">
        <b>${playedMatches.length}</b>
        Matches
    </div>

    <div class="summary-box wins">
        <b>${wins}</b>
        Wins
    </div>

    <div class="summary-box draws">
        <b>${draws}</b>
        Draws
    </div>

    <div class="summary-box losses">
        <b>${losses}</b>
        Losses
    </div>

    <div class="summary-box goals">
        <b>${goalsFor}:${goalsAgainst}</b>
        Goals
    </div>

</div>

`;

render(seasonMatches);

renderSeasonSummary(
    seasonMatches
);

renderStatistics(
    seasonMatches
);

renderLaLigaTable();
}

        const seasonRows = data.filter(

                    <th>M</th>

                    <th>D</th>

                    <th>Goals</th>
                    <th>+/-</th>
                    <th>Pts</th>

            </thead>

            <tbody>
        `;

                </td>
            
                <td>
                    ${row[4]}
                </td>
            
                <td>
                    ${row[5]}
                </td>
            
                <td>
                    ${row[6]}
                </td>
            
                <td>
                    ${row[7]}
                </td>
            
                <td>
                    ${row[8]}
                </td>
            
                <td class="points">
                    ${row[9]}
                </td>
            </tr>

});

        html += `
            </tbody>
        </table>
        `;

        document.getElementById(

    .catch(error => {

function getResultClass(match){

    if(match.Result === "-:-"){
        return "result-badge result-empty";
    }

    switch(match["Result type"]){

        case "W":
            return "result-badge result-win";

        case "D":
            return "result-badge result-draw";

        case "L":
            return "result-badge result-loss";

        default:
            return "result-badge";
    }

}

function render(matches){

    let filteredMatches = [...matches];

    if(matchFilter === "played"){
        filteredMatches = filteredMatches.filter(
            x => x.Result && x.Result !== "-:-"
        );
    }

    if(matchFilter === "unplayed"){
        filteredMatches = filteredMatches.filter(
            x => !x.Result || x.Result === "-:-"
        );
    }

matches = filteredMatches;

if(matches.length === 0){

    html += `
    <div class="widget-card">
        <div class="empty">No Matches</div>
    </div>
    `;

    document.getElementById("matches").innerHTML = html;
    return;
}

    matches = filteredMatches;

    if(matches.length === 0){

        document.getElementById("matches").innerHTML =
        "<div class='empty'>No Matches</div>";

        return;

    }

   matches.sort((a, b) => {
   
       const dateA = new Date(
           a.Date.split(".").reverse().join("-")
       );
   
       const dateB = new Date(
           b.Date.split(".").reverse().join("-")
       );
   
       return dateA - dateB; // najstarší -> najnovší
   
   });

    const grouped = {};

    matches.forEach(match => {

        const competition =
        match.Competition || "Other";

        if(!grouped[competition]){
            grouped[competition] = [];
        }

        grouped[competition].push(match);

    });

const latestSeason =
    [...new Set(allMatches.map(x => x.Season))]
    .sort()
    .reverse()[0];

let html = "";

if(season === latestSeason){

    html += `
    <div class="match-filter">

        <button
            class="${matchFilter === "played" ? "active" : ""}"
            onclick="setMatchFilter('played')">
            Played
        </button>

        <button
            class="${matchFilter === "unplayed" ? "active" : ""}"
            onclick="setMatchFilter('unplayed')">
            Upcoming
        </button>

        <button
            class="${matchFilter === "all" ? "active" : ""}"
            onclick="setMatchFilter('all')">
            All
        </button>

    </div>
    `;
}

    Object.keys(grouped).forEach(competition => {

        html += `

        <div class="competition-title">
            ${competition}
        </div>

        <div class="widget-card">

            <table class="matches-table">

                <thead>
                    <tr>
                        <th>Matchday</th>
                        <th>Date</th>
                        <th>Venue</th>
                        <th>Opponent</th>
                        <th>Result</th>
                    </tr>
                </thead>

                <tbody>

        `;

        grouped[competition].forEach(match => {

            html += `

            <tr onclick="location.href='match.html?id=${match.ID}'">

                <td>${match.Matchday || ""}</td>

                <td>${match.Date || ""}</td>

                <td>
                    ${match["Home/Away"] === "Home"
                    ? "Home"
                    : "Away"}
                </td>

                <td>
                    ${match["Opp. Team"] || ""}
                </td>

                <td>
                    <span class="${getResultClass(match)}">
                        ${match.Result || "-:-"}
                    </span>
                </td>

            </tr>

            `;

        });

        html += `

                </tbody>

            </table>

        </div>

        `;

    });

    document.getElementById("matches").innerHTML =
    html;

}

function renderSeasonSummary(matches) {

let html = `
   <table class="debutants-table">
       <thead>
           <tr>
               <th>Player</th>
               <th>Debut Date</th>
               <th>Age at Debut</th>
           </tr>
       </thead>
       <tbody>
`;

const selectedSeason = season;

const firstAppearance = {};

// prejde celú históriu
allMatches.forEach(match => {

const matchDate =
new Date(
match.Date.split(".").reverse().join("-")
);

const playersInMatch = [];

for(let i = 1; i <= 11; i++){

const player =
match[`Player name ${i}`];

if(player){
playersInMatch.push(player);
}

}

for(let i = 1; i <= 12; i++){

const player =
match[`Sub on ${i}`];

if(player){
playersInMatch.push(player);
}

}

playersInMatch.forEach(player => {

if(
!firstAppearance[player] ||
matchDate < firstAppearance[player].date
){

firstAppearance[player] = {
season: match.Season,
date: matchDate,
dateText: match.Date,
birthDate:
playerBirthDates[player.trim()] || ""
};

}

});

});

const debutants = Object.entries(firstAppearance)
.filter(
([name, data]) =>
data.season === selectedSeason
)
.sort(
(a, b) => a[1].date - b[1].date
);

debutants.forEach(([player,data]) => {

let ageText = "-";

if(data.birthDate){

const birth =
new Date(
data.birthDate
.split(".")
.reverse()
.join("-")
);

const debut =
data.date;

const diffDays =
Math.floor(
(debut - birth) /
(1000 * 60 * 60 * 24)
);

const years =
Math.floor(diffDays / 365.25);

const days =
Math.floor(
diffDays -
years * 365.25
);

ageText =
`${years}y ${days}d`;
}

html += `
       <tr>
           <td><a class="player-link" href="player.html?name=${encodeURIComponent(player)}">${player}</a></td>
           <td>${data.dateText}</td>
           <td>${ageText}</td>
       </tr>
   `;

});

html += `
       </tbody>
   </table>
`;

document.getElementById("seasonSummary").innerHTML = html;
}

function sortStats(column){

    if(statsSortColumn === column){

        statsSortDirection =
        statsSortDirection === "asc"
        ? "desc"
        : "asc";

    }else{

        statsSortColumn = column;
        statsSortDirection = "desc";

    }

    renderSeason();

}

function setMatchFilter(filter){

    matchFilter = filter;

    renderSeason();

}

window.setMatchFilter = setMatchFilter;

function renderStatistics(matches) {

const players = {};

function addPlayer(name) {

if (!name || !String(name).trim()) return false;

name = String(name).trim();

if (name.includes("(OG)")) return false;

if (!players[name]) {
players[name] = {
squad: 0,
xi: 0,
goals: 0,
assists: 0,
yellow: 0,
red: 0
};
}

return true;
}

matches.forEach(match => {

// základná 11
for (let i = 1; i <= 11; i++) {

const player =
match[`Player name ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {

addPlayer(player);

players[player].squad++;
players[player].xi++;

}

}

// lavička
for (let i = 1; i <= 12; i++) {

const player =
match[`On the bench name ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {

addPlayer(player);

players[player].squad++;

}

}

// góly
for (let i = 1; i <= 12; i++) {

const player =
match[`Goal Player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].goals++;
}

}

// asistencie
for (let i = 1; i <= 12; i++) {

const player =
match[`Assist Player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].assists++;
}

}

// žlté
for (let i = 1; i <= 12; i++) {

const player =
match[`Yellow player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].yellow++;
}

}

// červené
for (let i = 1; i <= 5; i++) {

const player =
match[`Red player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].red++;
}

}

});

const sortedPlayers = Object.entries(players);

sortedPlayers.sort((a,b) => {

const valueA =
statsSortColumn === "name"
? a[0]
: a[1][statsSortColumn];

const valueB =
statsSortColumn === "name"
? b[0]
: b[1][statsSortColumn];

if (typeof valueA === "string") {

return statsSortDirection === "asc"
? valueA.localeCompare(valueB)
: valueB.localeCompare(valueA);

}

return statsSortDirection === "asc"
? valueA - valueB
: valueB - valueA;

});

let html = `
   <div class="table-scroll">
   <table class="stats-table">
       <thead>
           <tr>
               <th class="${statsSortColumn==='name'?'stats-selected':''}" onclick="sortStats('name')">Player</th>
               <th class="${statsSortColumn==='squad'?'stats-selected':''}" onclick="sortStats('squad')">Sq</th>
               <th class="${statsSortColumn==='xi'?'stats-selected':''}" onclick="sortStats('xi')">XI</th>
               <th class="${statsSortColumn==='goals'?'stats-selected':''}" onclick="sortStats('goals')">G</th>
               <th class="${statsSortColumn==='assists'?'stats-selected':''}" onclick="sortStats('assists')">A</th>
               <th class="${statsSortColumn==='yellow'?'stats-selected':''}" onclick="sortStats('yellow')">Y</th>
               <th class="${statsSortColumn==='red'?'stats-selected':''}" onclick="sortStats('red')">R</th>
           </tr>
       </thead>
       <tbody>
`; 

sortedPlayers.forEach(([name, stats]) => {

html += `
<tr>
   <td class="${statsSortColumn==='name'?'stats-selected':''}">
      <a class="player-link" href="player.html?name=${encodeURIComponent(name)}">
         ${name}
      </a>
   </td>
   <td class="${statsSortColumn==='squad'?'stats-selected':''}">
       ${stats.squad}
   </td>
   <td class="${statsSortColumn==='xi'?'stats-selected':''}">
       ${stats.xi}
   </td>
   <td class="${statsSortColumn==='goals'?'stats-selected':''}">
       ${stats.goals}
   </td>
   <td class="${statsSortColumn==='assists'?'stats-selected':''}">
       ${stats.assists}
   </td>
   <td class="${statsSortColumn==='yellow'?'stats-selected':''}">
       ${stats.yellow}
   </td>
   <td class="${statsSortColumn==='red'?'stats-selected':''}">
       ${stats.red}
   </td>
</tr>
`;

});

html += `
       </tbody>
   </table>
   </div>
`;

document.getElementById("statistics").innerHTML = html;

}

    const seasons = [
        ...new Set(
            allMatches.map(x => x.Season)
        )
    ].sort().reverse();

    const select =
    document.getElementById("seasonSelect");

    select.innerHTML = seasons.map(s => `
        <option value="${s}"
            ${s === season ? "selected" : ""}>
            ${s}
        </option>
    `).join("");

        location.href =
        `season.html?season=${encodeURIComponent(e.target.value)}`;

])
.then(([matchesData, playersData]) => {

   if(!season){

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    const input =
        document.getElementById("personSearch");

    const results =
        document.getElementById("personSearchResults");

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";
            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

            results.innerHTML = `
            <div class="player-search-results">
            ${filtered.map(item => `
            <a
                class="player-search-item"
                href="${
                    item.type === 'Manager'
                    ? `manager.html?name=${encodeURIComponent(item.name)}`
                    : `player.html?name=${encodeURIComponent(item.name)}`
                }">
            ${item.name}
            <span class="search-type ${item.type.toLowerCase()}">
               ${item.type}
            </span>
            </a>
            `).join("")}
            </div>
            `;
});
}


(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

if(button){

    button.textContent =
    theme === "dark"
    ? "☀️"
    : "🌙";

    button.addEventListener("click", () => {

        const current =
        document.documentElement.getAttribute("data-theme");

        const next =
        current === "dark"
        ? "light"
        : "dark";

        document.documentElement.setAttribute(
            "data-theme",
            next
        );

        localStorage.setItem(
            "theme",
            next
        );

        button.textContent =
        next === "dark"
        ? "☀️"
        : "🌙";

    });

}

})();


const searchToggle =
    document.getElementById("searchToggle");

if(searchToggle){

    searchToggle.addEventListener("click", e => {

        e.preventDefault();

        const searchBox =
            document.querySelector(".search-hero");

        const results =
            document.getElementById("personSearchResults");

        const input =
            document.getElementById("personSearch");

        searchBox.classList.toggle("show");

        if(searchBox.classList.contains("show")){

            input.focus();

        }else{

            input.value = "";
            results.innerHTML = "";

        }

    });

}

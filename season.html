<!DOCTYPE html>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top left,#004D98 0%,transparent 35%),

.competition-title,

.stats-table th:not(:first-child),

.stats-table thead th
{
position:sticky;
top:0;
z-index:10;

color:var(--muted);

}

.matches-table{
    width:100%;
}

.matches-table thead th{
position:sticky;
top:0;
z-index:10;
font-weight:700;
background:var(--meta-bg);
color:var(--muted);
}

.matches-table th:nth-child(1),
.matches-table td:nth-child(1){

}

.matches-table th:nth-child(2),

}

.matches-table th:nth-child(3),

.matches-table th:nth-child(4),

th{
background:var(--meta-bg);
color:var(--muted);

padding:12px;

z-index:10;

td{

.matches-table tbody tr:hover{

border:1px solid var(--result-win);

}

.stats-table td{

font-size:12px;
}

}

min-width:44px;
padding:3px 8px;
}

</style>

<body>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

<div class="container">

<div class="header">
   <h1 id="seasonTitle">FC Barcelona</h1>
   
   <div class="hero-subtitle">
       Statistics & Historical Database
   </div>
   
   <div class="season-selector">
       <select id="seasonSelect"></select>
   </div>
</div>



<div class="content-layout">

<div class="left-panel">

    <div class="widget-title">
        Season Summary
    </div>

    <div id="seasonOverview"></div>

    <div id="matches">
        Loading...
    </div>

</div>

<div class="right-panel">

<div id="laligaWidget">

    <div class="widget-title">
        La Liga Table
    </div>

    <div class="widget-card">
        <div id="laligaTable">
            Loading...
        </div>
    </div>

</div>

<div class="widget-title">
    Season Debutants
</div>

<div class="widget-card">
    <div id="seasonSummary">
        Loading...
    </div>
</div>

<div class="widget-title">
Statistics
</div>

<div class="widget-card">
<div id="statistics">
Loading...
</div>
</div>

</div>

</div>

<script>

let allMatches = [];
let allPlayers = [];
let playerBirthDates = {};

let matchFilter = "played"; 

let season =
new URLSearchParams(
location.search
).get("season");

let statsSortColumn = "goals";
let statsSortDirection = "desc";

function animateContent(){

    const layout =
    document.querySelector(".content-layout");

    if(!layout) return;

    layout.classList.remove("animate");

    void layout.offsetWidth;

    layout.classList.add("animate");

}

function renderSeason(){

    const seasonMatches =
    allMatches.filter(
        x => x.Season === season
    );

    if(!seasonMatches.length){

        document.getElementById(
            "matches"
        ).innerHTML =
        "<div class='empty'>Season not found</div>";

        return;
    }

      const playedMatches = seasonMatches.filter(
          x => x.Result &&
               x.Result !== "-:-"
      );

      const wins =
      playedMatches.filter(
          x => x["Result type"] === "W"
      ).length;
      
      const draws =
      playedMatches.filter(
          x => x["Result type"] === "D"
      ).length;
      
      const losses =
      playedMatches.filter(
          x => x["Result type"] === "L"
      ).length;

let goalsFor = 0;
let goalsAgainst = 0;

playedMatches.forEach(match => {

    const homeGoals =
        Number(match["Goals home team"]) || 0;

    const awayGoals =
        Number(match["Goals away team"]) || 0;

    if(match["Home/Away"] === "Home"){

        goalsFor += homeGoals;
        goalsAgainst += awayGoals;

    }else{

        goalsFor += awayGoals;
        goalsAgainst += homeGoals;

    }

});

   document.getElementById(
    "seasonOverview"
).innerHTML = `

<div class="summary-grid">

    <div class="summary-box matches">
        <b>${playedMatches.length}</b>
        Matches
    </div>

    <div class="summary-box wins">
        <b>${wins}</b>
        Wins
    </div>

    <div class="summary-box draws">
        <b>${draws}</b>
        Draws
    </div>

    <div class="summary-box losses">
        <b>${losses}</b>
        Losses
    </div>

    <div class="summary-box goals">
        <b>${goalsFor}:${goalsAgainst}</b>
        Goals
    </div>

</div>

`;

render(seasonMatches);

renderSeasonSummary(
    seasonMatches
);

renderStatistics(
    seasonMatches
);

renderLaLigaTable();
}

function renderLaLigaTable() {

    fetch("https://docs.google.com/spreadsheets/d/1DjlD21Srkmw2As8zcya6S51K6ZbF_jasTvebHze4kVo/export?format=csv&gid=443901137")
    .then(response => response.text())
    .then(csv => {

        const rows = csv
            .trim()
            .split("\n")
            .map(row => row.split(","));

        const data = rows.slice(1);

        const seasonRows = data.filter(
            row => row[0].trim() === season
        );

        const widget =
        document.getElementById("laligaWidget");

        if(seasonRows.length === 0){

            widget.style.display = "none";

            return;
        }

        widget.style.display = "block";

        let html = `
        <table class="laliga-table">

            <thead>
                <tr>
                    <th>#</th>
                    <th>Club</th>
                    <th>M</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>Goals</th>
                    <th>+/-</th>
                    <th>Pts</th>
                </tr>
            </thead>

            <tbody>
        `;

        seasonRows.forEach(row => {

            const position =
            parseInt(row[1]);

            let rowClass = "";
            let posBadgeClass = "";
            
            if(position === 1){
                posBadgeClass = "leader";
            }
            else if(position <= 4){
                posBadgeClass = "top4";
            }
            else if(position <= 7){
                posBadgeClass = "europe";
            }
            else if(position >= 18){
                posBadgeClass = "relegation";
            }

            if(row[2].trim() === "Barcelona"){

                rowClass = "barca-row";
            }

            html += `
            <tr class="${rowClass}">
                <td>
                    <div class="position-circle ${posBadgeClass}">
                        ${position}
                    </div>
                </td>
            
                <td>
                    ${row[2]}
                </td>
            
                <td>
                    ${row[3]}
                </td>
            
                <td>
                    ${row[4]}
                </td>
            
                <td>
                    ${row[5]}
                </td>
            
                <td>
                    ${row[6]}
                </td>
            
                <td>
                    ${row[7]}
                </td>
            
                <td>
                    ${row[8]}
                </td>
            
                <td class="points">
                    ${row[9]}
                </td>
            </tr>
            `;
});

        html += `
            </tbody>
        </table>
        `;

        document.getElementById(
            "laligaTable"
        ).innerHTML = html;
    })
    .catch(error => {

        console.error(error);

        document.getElementById(
            "laligaWidget"
        ).style.display = "none";
    });

}


function getResultClass(match){

    if(match.Result === "-:-"){
        return "result-badge result-empty";
    }

    switch(match["Result type"]){

        case "W":
            return "result-badge result-win";

        case "D":
            return "result-badge result-draw";

        case "L":
            return "result-badge result-loss";

        default:
            return "result-badge";
    }

}

function render(matches){

    let filteredMatches = [...matches];

    if(matchFilter === "played"){
        filteredMatches = filteredMatches.filter(
            x => x.Result && x.Result !== "-:-"
        );
    }

    if(matchFilter === "unplayed"){
        filteredMatches = filteredMatches.filter(
            x => !x.Result || x.Result === "-:-"
        );
    }

matches = filteredMatches;

if(matches.length === 0){

    html += `
    <div class="widget-card">
        <div class="empty">No Matches</div>
    </div>
    `;

    document.getElementById("matches").innerHTML = html;
    return;
}

    matches = filteredMatches;

    if(matches.length === 0){

        document.getElementById("matches").innerHTML =
        "<div class='empty'>No Matches</div>";

        return;

    }

   matches.sort((a, b) => {
   
       const dateA = new Date(
           a.Date.split(".").reverse().join("-")
       );
   
       const dateB = new Date(
           b.Date.split(".").reverse().join("-")
       );
   
       return dateA - dateB; // najstarší -> najnovší
   
   });

    const grouped = {};

    matches.forEach(match => {

        const competition =
        match.Competition || "Other";

        if(!grouped[competition]){
            grouped[competition] = [];
        }

        grouped[competition].push(match);

    });

const latestSeason =
    [...new Set(allMatches.map(x => x.Season))]
    .sort()
    .reverse()[0];

let html = "";

if(season === latestSeason){

    html += `
    <div class="match-filter">

        <button
            class="${matchFilter === "played" ? "active" : ""}"
            onclick="setMatchFilter('played')">
            Played
        </button>

        <button
            class="${matchFilter === "unplayed" ? "active" : ""}"
            onclick="setMatchFilter('unplayed')">
            Upcoming
        </button>

        <button
            class="${matchFilter === "all" ? "active" : ""}"
            onclick="setMatchFilter('all')">
            All
        </button>

    </div>
    `;
}

    Object.keys(grouped).forEach(competition => {

        html += `

        <div class="competition-title">
            ${competition}
        </div>

        <div class="widget-card">

            <table class="matches-table">

                <thead>
                    <tr>
                        <th>Matchday</th>
                        <th>Date</th>
                        <th>Venue</th>
                        <th>Opponent</th>
                        <th>Result</th>
                    </tr>
                </thead>

                <tbody>

        `;

        grouped[competition].forEach(match => {

            html += `

            <tr onclick="location.href='match.html?id=${match.ID}'">

                <td>${match.Matchday || ""}</td>

                <td>${match.Date || ""}</td>

                <td>
                    ${match["Home/Away"] === "Home"
                    ? "Home"
                    : "Away"}
                </td>

                <td>
                    ${match["Opp. Team"] || ""}
                </td>

                <td>
                    <span class="${getResultClass(match)}">
                        ${match.Result || "-:-"}
                    </span>
                </td>

            </tr>

            `;

        });

        html += `

                </tbody>

            </table>

        </div>

        `;

    });

    document.getElementById("matches").innerHTML =
    html;

}

function renderSeasonSummary(matches) {

let html = `
   <table class="stats-table debutants-table">
       <thead>
           <tr>
               <th>Player</th>
               <th>Debut Date</th>
               <th>Age at Debut</th>
           </tr>
       </thead>
       <tbody>
`;

const selectedSeason = season;

const firstAppearance = {};

// prejde celú históriu
allMatches.forEach(match => {

const matchDate =
new Date(
match.Date.split(".").reverse().join("-")
);

const playersInMatch = [];

for(let i = 1; i <= 11; i++){

const player =
match[`Player name ${i}`];

if(player){
playersInMatch.push(player);
}

}

for(let i = 1; i <= 12; i++){

const player =
match[`Sub on ${i}`];

if(player){
playersInMatch.push(player);
}

}

playersInMatch.forEach(player => {

if(
!firstAppearance[player] ||
matchDate < firstAppearance[player].date
){

firstAppearance[player] = {
season: match.Season,
date: matchDate,
dateText: match.Date,
birthDate:
playerBirthDates[player.trim()] || ""
};

}

});

});

const debutants = Object.entries(firstAppearance)
.filter(
([name, data]) =>
data.season === selectedSeason
)
.sort(
(a, b) => a[1].date - b[1].date
);

debutants.forEach(([player,data]) => {

let ageText = "-";

if(data.birthDate){

const birth =
new Date(
data.birthDate
.split(".")
.reverse()
.join("-")
);

const debut =
data.date;

const diffDays =
Math.floor(
(debut - birth) /
(1000 * 60 * 60 * 24)
);

const years =
Math.floor(diffDays / 365.25);

const days =
Math.floor(
diffDays -
years * 365.25
);

ageText =
`${years} years & ${days} days`;
}

html += `
       <tr>
           <td>${player}</td>
           <td>${data.dateText}</td>
           <td>${ageText}</td>
       </tr>
   `;

});

html += `
       </tbody>
   </table>
`;

document.getElementById("seasonSummary").innerHTML = html;
}

function sortStats(column){

    if(statsSortColumn === column){

        statsSortDirection =
        statsSortDirection === "asc"
        ? "desc"
        : "asc";

    }else{

        statsSortColumn = column;
        statsSortDirection = "desc";

    }

    renderSeason();

}

function setMatchFilter(filter){

    matchFilter = filter;

    renderSeason();

}

window.setMatchFilter = setMatchFilter;

function renderStatistics(matches) {

const players = {};

function addPlayer(name) {

if (!name || !String(name).trim()) return false;

name = String(name).trim();

if (name.includes("(OG)")) return false;

if (!players[name]) {
players[name] = {
squad: 0,
xi: 0,
goals: 0,
assists: 0,
yellow: 0,
red: 0
};
}

return true;
}

matches.forEach(match => {

// základná 11
for (let i = 1; i <= 11; i++) {

const player =
match[`Player name ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {

addPlayer(player);

players[player].squad++;
players[player].xi++;

}

}

// lavička
for (let i = 1; i <= 12; i++) {

const player =
match[`On the bench name ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {

addPlayer(player);

players[player].squad++;

}

}

// góly
for (let i = 1; i <= 12; i++) {

const player =
match[`Goal Player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].goals++;
}

}

// asistencie
for (let i = 1; i <= 12; i++) {

const player =
match[`Assist Player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].assists++;
}

}

// žlté
for (let i = 1; i <= 12; i++) {

const player =
match[`Yellow player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].yellow++;
}

}

// červené
for (let i = 1; i <= 5; i++) {

const player =
match[`Red player ${i}`];

if (
player &&
!String(player).includes("(OG)")
) {
addPlayer(player);
players[player].red++;
}

}

});

const sortedPlayers = Object.entries(players);

sortedPlayers.sort((a,b) => {

const valueA =
statsSortColumn === "name"
? a[0]
: a[1][statsSortColumn];

const valueB =
statsSortColumn === "name"
? b[0]
: b[1][statsSortColumn];

if (typeof valueA === "string") {

return statsSortDirection === "asc"
? valueA.localeCompare(valueB)
: valueB.localeCompare(valueA);

}

return statsSortDirection === "asc"
? valueA - valueB
: valueB - valueA;

});

let html = `
   <div class="table-scroll">
   <table class="stats-table">
       <thead>
           <tr>
               <th class="${statsSortColumn==='name'?'stats-selected':''}" onclick="sortStats('name')">Player</th>
               <th class="${statsSortColumn==='squad'?'stats-selected':''}" onclick="sortStats('squad')">Sq</th>
               <th class="${statsSortColumn==='xi'?'stats-selected':''}" onclick="sortStats('xi')">XI</th>
               <th class="${statsSortColumn==='goals'?'stats-selected':''}" onclick="sortStats('goals')">G</th>
               <th class="${statsSortColumn==='assists'?'stats-selected':''}" onclick="sortStats('assists')">A</th>
               <th class="${statsSortColumn==='yellow'?'stats-selected':''}" onclick="sortStats('yellow')">Y</th>
               <th class="${statsSortColumn==='red'?'stats-selected':''}" onclick="sortStats('red')">R</th>
           </tr>
       </thead>
       <tbody>
`; 

sortedPlayers.forEach(([name, stats]) => {

html += `
<tr>
   <td class="${statsSortColumn==='name'?'stats-selected':''}">${name}</td>
   <td class="${statsSortColumn==='squad'?'stats-selected':''}">
       ${stats.squad}
   </td>
   <td class="${statsSortColumn==='xi'?'stats-selected':''}">
       ${stats.xi}
   </td>
   <td class="${statsSortColumn==='goals'?'stats-selected':''}">
       ${stats.goals}
   </td>
   <td class="${statsSortColumn==='assists'?'stats-selected':''}">
       ${stats.assists}
   </td>
   <td class="${statsSortColumn==='yellow'?'stats-selected':''}">
       ${stats.yellow}
   </td>
   <td class="${statsSortColumn==='red'?'stats-selected':''}">
       ${stats.red}
   </td>
</tr>
`;

});

html += `
       </tbody>
   </table>
   </div>
`;

document.getElementById("statistics").innerHTML = html;

}

function renderSeasonDropdown(){

    const seasons = [
        ...new Set(
            allMatches.map(x => x.Season)
        )
    ].sort().reverse();

    const select =
    document.getElementById("seasonSelect");

    select.innerHTML = seasons.map(s => `
        <option value="${s}"
            ${s === season ? "selected" : ""}>
            ${s}
        </option>
    `).join("");

    select.addEventListener("change", e => {

        location.href =
        `season.html?season=${encodeURIComponent(e.target.value)}`;

    });

}

Promise.all([
    fetch("data.json").then(r => r.json()),
    fetch("players.json").then(r => r.json())
])
.then(([matchesData, playersData]) => {

    allMatches = matchesData;

   if(!season){
    season = [...new Set(
        matchesData.map(x => x.Season)
    )].sort().reverse()[0];
}
   
    allPlayers = playersData;

    playersData.forEach(player => {

        playerBirthDates[
            player.Player.trim()
        ] = player["Date of Birth"];

    });

    renderSeasonDropdown();
    renderSeason();

})
.catch(error => {

    console.error(error);

});



(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

button.textContent =
theme === "dark"
? "☀️"
: "🌙";

button.addEventListener("click", () => {

const current =
document.documentElement.getAttribute("data-theme");

const next =
current === "dark"
? "light"
: "dark";

document.documentElement.setAttribute(
"data-theme",
next
);

localStorage.setItem(
"theme",
next
);

button.textContent =
next === "dark"
? "☀️"
: "🌙";

});

})();

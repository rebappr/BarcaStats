<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>La Liga</title>
    <style>
body{
    margin:0;
    padding:20px;
    font-family:Inter,sans-serif;
    background:#0f172a;
    color:white;
}

.widget-title{
    margin-bottom:12px;
    padding:10px 16px;
    border-radius:18px;
    font-weight:700;
    background:linear-gradient(135deg,#004D98,#A50044);
}

.widget-card{
    background:#1e293b;
    border-radius:24px;
    padding:14px;
}

.laliga-table-wrapper{
    overflow-x:auto;
}

.laliga-table{
    width:100%;
    border-collapse:collapse;
}

.laliga-table th{
    background:linear-gradient(135deg,#004D98,#A50044);
    color:white;
    padding:12px;
}

.laliga-table td{
    padding:10px;
    border-bottom:1px solid #334155;
    text-align:center;
}

.laliga-table tr:hover{
    background:rgba(255,255,255,.05);
}
</style>
</head>
<body>

<div class="widget-title">
    La Liga Table
</div>

<div class="widget-card">
    <div id="laligaTable">
        Loading...
    </div>
</div>

<script>
fetch("https://docs.google.com/spreadsheets/d/1DjlD21Srkmw2As8zcya6S51K6ZbF_jasTvebHze4kVo/export?format=csv&gid=443901137")
.then(response => response.text())
.then(csv => {

    const rows = csv
        .trim()
        .split("\n")
        .map(row => row.split(","));

    let html = `
        <div class="laliga-table-wrapper">
        <table class="laliga-table">
    `;

    rows.forEach((row,index)=>{

        html += "<tr>";

        row.forEach(cell=>{

            if(index === 0){
                html += `<th>${cell}</th>`;
            } else {
                html += `<td>${cell}</td>`;
            }

        });

        html += "</tr>";
    });

    html += "</table></div>";

    document.getElementById("laligaTable").innerHTML = html;

})
.catch(error => {
    document.getElementById("laligaTable").innerHTML =
        "Nepodarilo sa načítať dáta.";
    console.error(error);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Barcelona Matches</title>

<link rel="icon.png
   <linkicon-16x16.png
   <linkle-touch-icon.png
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapismily=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/theme.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top left,#004D98 0%,transparent 35%),
radial-gradient(circle at top right,#A50044 0%,transparent 35%),
var(--bg);
color:var(--text);
font-size:12px;
min-height:100vh;
}

.theme-toggle{
position:fixed;
left:20px;
bottom:20px;

width:52px;
height:52px;

border:none;
border-radius:50%;

cursor:pointer;

background:#A50044;
color:white;

font-size:20px;
font-weight:700;

z-index:9999;
}

.competition-title{
margin:8px 0 6px;
padding:8px 14px;
background:
linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);
color:white;
font-size:14px;
font-weight:700;
border-radius:18px;
letter-spacing:.5px;
box-shadow:
0 10px 25px rgba(0,0,0,.25);
}

.container{
max-width:1500px;
margin:auto;
padding:20px;
}

.header{
position:relative;
overflow:hidden;

background:
linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

color:white;

padding:16px;

border-radius:28px;

margin-bottom:14px;
cursor:pointer;
box-shadow:
0 20px 50px rgba(0,0,0,.35);
}

.header::before{
content:"";
position:absolute;
inset:0;

background:
radial-gradient(
circle at top right,
rgba(255,255,255,.25),
transparent 40%
);
}

.hero-subtitle{
margin-top:10px;
opacity:.85;
font-size:14px;
}

.navbar{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    color:white;
    padding:10px 16px;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.2);
    transition:.25s;
}

.navbar a:hover{
    background:rgba(255,255,255,.25);
}

.header h1{
margin:0;
font-size:32px;
font-weight:800;
}

.season-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
    gap:12px;
}

.season-card{
    background:var(--card-bg);
    backdrop-filter:blur(20px);
    border:
    1px solid var(--card-border);
    border-radius:24px;
    padding:30px 20px;
    cursor:pointer;
    text-align:center;
    transition:.25s;
    font-size:24px;
    font-weight:800;
}

.season-card:hover{
    transform:translateY(-5px);
    border-color:#004D98;
    box-shadow:
    0 15px 35px rgba(0,0,0,.2);
}

.season-card small{
    display:block;
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
    font-weight:500;
}

@media (max-width:900px){

.container{
    padding:8px;
}

.header h1{
    font-size:24px;
}

.season-card{
    font-size:20px;
    padding:24px 16px;
}

}

</style>
</head>
<body>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

<div class="container">

<div class="header">

<h1>
FC Barcelona Seasons
</h1>

<div class="hero-subtitle">
Browse all club seasons
</div>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="seasons.html">Seasons</a>
    <a href="matches.html">Matches</a>
    <a href="players.html">Players</a>
</div>

</div>

<div class="competition-title">
    Seasons
</div>

<div id="seasonGrid" class="season-grid">

    Loading...

</div>

<script>

let allMatches = [];

fetch("data.json")
.then(r => r.json())
.then(data => {

    allMatches = data;

    renderSeasons();

})
.catch(error => {

    console.error(error);

});

function renderSeasons(){

    const seasons = [

        ...new Set(
            allMatches
            .map(x => x.Season)
            .filter(Boolean)
        )

    ]
    .sort()
    .reverse();

    let html = "";

    seasons.forEach(season => {

        const matches =
        allMatches.filter(
            x => x.Season === season
        );

        html += `
        <div
            class="season-card"
            onclick="
            location.href=
            'season.html?season=${season}'
            "
        >

            ${season}

            <small>
                ${matches.length} matches
            </small>

        </div>
        `;
    });

    document.getElementById(
        "seasonGrid"
    ).innerHTML = html;
}

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

button.textContent =
theme === "dark"
? "☀️"
: "🌙";

button.addEventListener("click", () => {

const current =
document.documentElement.getAttribute("data-theme");

const next =
current === "dark"
? "light"
: "dark";

document.documentElement.setAttribute(
"data-theme",
next
);

localStorage.setItem(
"theme",
next
);

button.textContent =
next === "dark"
? "☀️"
: "🌙";

});

})();
</script>

</body>
</html>

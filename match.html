<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

    <link rel="icon.png
    <linkicon-16x16.png
    <linkle-touch-icon.png
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="s.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="css/theme.css">
    
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;

    background:
        radial-gradient(circle at top left,#004D98 0%,transparent 35%),
        radial-gradient(circle at top right,#A50044 0%,transparent 35%),
        var(--bg);

    color:var(--text);
    min-height:100vh;
}

.theme-toggle{
    position:fixed;
    left:20px;
    bottom:20px;

    width:52px;
    height:52px;

    border:none;
    border-radius:50%;

    cursor:pointer;

    background:#A50044;
    color:white;

    font-size:20px;
    font-weight:700;

    z-index:9999;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:10px;
}

.hero{
    background:
        linear-gradient(
            135deg,
            rgba(0,77,152,.95),
            rgba(165,0,68,.95)
        );
    
    color:white;
    border-radius:28px;
    padding:10px 18px;
    margin-bottom:10px;
    text-size: 12px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.score{
    font-size:30px;
    font-weight:700;
    margin:4px 0;
    text-align:center;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-bottom: 6px;
}

.teams .team-name:first-of-type{
    text-align:left;
}

.teams .team-name:last-of-type{
    text-align:right;
}

.team-name{
    font-size:22px;
    font-weight:700;
}

.match-tabs{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.match-tab{
    flex:1;
    height:40px;
    border-radius:12px;
    border:1px solid var(--meta-border);
    background:var(--meta-bg);
    color:var(--text);
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.match-tab:hover{
    background:#004D98;
    color:#fff;
}

.match-tab.active{
    background:linear-gradient(
        135deg,
        #004D98,
        #A50044
    );
    color:white;
    border-color:transparent;
}
.match-section{
    display:none;
}

.match-section.active{
    display:block;
}

.card{
    background:var(--card-bg);
    backdrop-filter:blur(20px);

    border:1px solid var(--card-border);

    border-radius:24px;

    padding:8px 14px;
    margin-bottom:8px;

    transition:.3s;
}

.section-title{
    color:var(--text);
    font-size:14px;
    font-weight:800;
    margin-bottom:3px;
}

.meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:6px;
}

.meta{
    background:var(--meta-bg);
    border:1px solid var(--meta-border);
    padding:8px;
    border-radius:16px;
}

.meta-label{
    font-size:11px;
    text-transform:uppercase;
    color:var(--muted);
}

.meta-value{
    margin-top:4px;
    font-weight:700;
    font-size:13px;
}

.timeline-title{
    margin:10px 0 5px;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.5px;
}

.lineups{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.content-grid{
    display:block;
}

.left-column,
.right-column{
    display:flex;
    flex-direction:column;
    gap:6px;
    position:sticky;
    top:10px;
}

.team-card{
    padding:0;
}

.team-card h3{
    font-size:15px;
    margin-bottom:10px;
}

.team-card h4{
    font-size:13px;
    margin:10px 0 6px;
}

.team-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.team-header.home{
    justify-content:center;
}

.team-header.away{
    justify-content:center;
}
    
.player{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 0;
    font-size:13px;
}

.player-name{
    flex:1;
}

.player-icons{
    margin-left:6px;
}

.sub-off{
    color:#dc2626;
    font-weight:700;
}

.number{
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--barca-red);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:700;
}

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:24px;
    width:3px;
    background:var(--divider);
}

.timeline-item{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.timeline-minute{
    width:48px;
    text-align:center;
    font-weight:700;
}

.timeline-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

.timeline-content{
    flex:1;
    background:var(--surface);
    padding:6px;
    border-radius:12px;
}

.timeline-modern{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.timeline-row{
    display:flex;
    width:100%;
    margin-bottom:8px;
}

.timeline-row:last-child{
    border-bottom:none;
}

.timeline-home{
    display:flex;
    align-items:center;
    gap:10px;
}

.timeline-away{
    display:flex;
    align-items:center;
    gap:10px;

    margin-left:auto;

    text-align:right;
    justify-content:flex-end;
}

.timeline-home{
    flex-shrink:0;
}

.timeline-away{
    flex-shrink:0;
}

.timeline-event{
    font-size:12px;
    line-height:1.6;
    max-width:none;
}

.timeline-minute{
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    min-width:40px;
    opacity:.8;
}

.timeline-away .timeline-event{
    text-align:right;
}

.timeline-event{
    font-size:11px;
    line-height:1.6;
}

.timeline-score{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:30px;
    padding:0 12px;
    border:2px solid #4F63FF;
    border-radius:999px;
    background:rgba(79,99,255,.08);
    font-weight:800;
}

.sub-in{
    color:#16a34a;
    font-weight:700;
}

.sub-out{
    color:#dc2626;
    font-weight:700;
}

.timeline-break{
    height:1px;
    background:var(--divider);
    margin:10px 0;
}

.event-home{
    text-align:right;
}

.event-away{
    text-align:left;
}

.event-home .event-icon{
    float:right;
    margin-left:4px;
    margin-right:0;
}

.event-away .event-icon{
    margin-right:4px;
}

.event-box::after{
    content:"";
    display:block;
    clear:both;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:
        linear-gradient(
            135deg,
            #004D98,
            #A50044
        );
    color:white;
    text-decoration:none;
    padding:14px 22px;
    border-radius:999px;
    font-weight:700;
    box-shadow:
        0 10px 25px rgba(0,0,0,.25);
}

.lineup-tabs{
    display:none;
}

.content-sections{
    display:block;
}

@media(min-width:901px){

    .left-column,
    .right-column{
        display:flex;
        flex-direction:column;
        gap:8px;
    }

    .right-column{
        position:sticky;
        top:10px;
    }

    .match-tabs{
        display:none;
    }

    .content-sections{
        display:grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap:10px;
        align-items:start;
    }

    .match-section{
        display:block !important;
    }

}

@media(max-width:900px){

    .lineup-tabs{
        display:flex;
        margin-bottom:15px;
        gap:8px;
    }

    .lineup-tab{
        flex:1;
        border:none;
        background:#e5e7eb;
        padding:10px;
        border-radius:10px;
        font-weight:600;
        cursor:pointer;
    }

    .lineup-tab.active{
        background:#004D98;
        color:white;
    }

    .content-grid{
        grid-template-columns:1fr;
    }
    
    .mobile-hidden,
    .team-card h3{
        display:none;
    }

.teams{
    grid-template-columns:1fr;
    gap:8px;
}

    .team-name{
    text-align:center !important;
    font-size:16px;
}
.score{
    font-size:18px;
}


    .lineups{
        display:block;
    }

    #lineup-barca,
    #lineup-opp{
    margin-bottom:15px;
}

}

</style>
</head>

<body>

<button id="themeToggle" class="theme-toggle">
    🌙
</button>

<div class="container">

<div id="app">
Loading...
</div>

</div>

<a href="index.html" class="back-btn">
← Matches
</a>

<script>

(function(){

    if(!localStorage.getItem("theme")){

        const systemTheme =
            window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

        document.documentElement.setAttribute(
            "data-theme",
            systemTheme
        );

    }else{

        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("theme")
        );

    }

})();

const params = new URLSearchParams(location.search);
const matchId = params.get("id");

fetch("data.json")
    .then(r => {

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        return r.json();
    })
    .then(data => {

        const match =
            data.find(
                row =>
                    String(row.ID).trim() ===
                    String(matchId).trim()
            );

if (!match) {

    document.getElementById("app").innerHTML =
        "<div class='card'>Match not found</div>";

    return;
}

renderMatch(match);

    })

.catch(error => {

    console.error(error);

    document.getElementById("app").innerHTML = `
        <div class="card">
            Error:<br>
            ${error.message}
        </div>
    `;

});

function showMatchSection(section){

    if(window.innerWidth > 900){
        return;
    }

    document
        .querySelectorAll(".match-section")
        .forEach(el => el.classList.remove("active"));

    document
        .querySelectorAll(".match-tab")
        .forEach(el => el.classList.remove("active"));

    document
        .getElementById(section)
        .classList.add("active");

    document
        .querySelector(`[data-section="${section}"]`)
        .classList.add("active");

}
    
function escapeHtml(str) {

    if (str === null || str === undefined) {
        return "";
    }

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getPlayerIcons(match, playerName, prefix = "") {

    const icons = [];

    // Góly
    for (let i = 1; i <= 12; i++) {
        if (
            String(match[`${prefix}Goal Player ${i}`] || "").trim() ===
            String(playerName).trim()
        ) {
            icons.push("⚽");
        }
    }

    // Asistencie
    for (let i = 1; i <= 12; i++) {
        if (
            String(match[`${prefix}Assist Player ${i}`] || "").trim() ===
            String(playerName).trim()
        ) {
            icons.push("🅰️");
        }
    }

    // Žlté karty
    for (let i = 1; i <= 12; i++) {
        if (
            String(match[`${prefix}Yellow player ${i}`] || "").trim() ===
            String(playerName).trim()
        ) {
            icons.push("🟨");
        }
    }

    // Červené karty
    for (let i = 1; i <= 5; i++) {
        if (
            String(match[`${prefix}Red player ${i}`] || "").trim() ===
            String(playerName).trim()
        ) {
            icons.push("🟥");
        }
    }

    return icons.join(" ");
}

function getPlayers(match,prefix=""){

    const captain = match[`${prefix}Captain`] || "";

    const subbedOff = [];

    for(let i=1;i<=6;i++){

        const player = match[`${prefix}Sub off ${i}`];

if(player){
    subbedOff.push(String(player).trim());
    }
}

    let html="";

    for(let i=1;i<=11;i++){

        const player =
            match[`${prefix}Player name ${i}`];

        const number =
            match[`${prefix}Player number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${escapeHtml(number || "")}
                </div>

        <span class="player-name">
            ${escapeHtml(player)}
            <span class="player-icons">
                ${getPlayerIcons(match, player, prefix)}
            </span>
    ${
        String(player).trim() === String(captain).trim()
            ? ' <strong>(C)</strong>'
            : ''
    }
    ${
        subbedOff.includes(String(player).trim())
            ? ' <strong style="color:#dc2626;">⬇</strong>'
            : ''
    }
</span>
            </div>
            `;
        }
    }

    return html;
}

function getBench(match,prefix=""){

    const subbedOn = [];

for(let i=1;i<=6;i++){

    const player = match[`${prefix}Sub on ${i}`];

if(player){
    subbedOn.push(String(player).trim());
}
}

    let html="";

    for(let i=1;i<=12;i++){

        const player =
            match[`${prefix}On the bench name ${i}`];

        const number =
            match[`${prefix}On the bench number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${number || ""}
                </div>

                ${escapeHtml(player)}
${
    subbedOn.includes(String(player).trim())
        ? ' <strong style="color:#16a34a;">⬆</strong>'
        : ''
}
            </div>
            `;
        }
    }

    return html;
}

function getTimeline(match){

    const events = [];

    let homeScore = 0;
    let awayScore = 0;

    const homeMatch =
        String(match["Home/Away"] || "").trim() === "Home";

    function sortByMinute(arr){

    arr.sort((a,b) => {
    
        const aCheck = String(a.minute).trim() === "✔";
        const bCheck = String(b.minute).trim() === "✔";
    
        if (aCheck && !bCheck) return 1;
        if (!aCheck && bCheck) return -1;
        if (aCheck && bCheck) return 0;
    
        const ma =
            parseInt(String(a.minute).match(/\d+/)?.[0] || 0);
    
        const mb =
            parseInt(String(b.minute).match(/\d+/)?.[0] || 0);
    
        return ma - mb;
    
    });

    }

    // GOALS

    for(let i=1;i<=12;i++){

        if(match[`Goal Player ${i}`]){

            if(homeMatch){
                homeScore++;
            }else{
                awayScore++;
            }

            events.push({
                minute: match[`Goal min ${i}`],
                side: homeMatch ? "left" : "right",
                player: match[`Goal Player ${i}`],
                assist: match[`Assist Player ${i}`] || "",
                score: `${homeScore} - ${awayScore}`, 
                penalty:
                    match[`Penalty player ${i}`] &&
                    String(match[`Penalty scored ${i}`] || "")
                        .trim()
                        .toLowerCase() !== "not in"
            });

        }

        if(match[`Opp. Goal Player ${i}`]){

            if(homeMatch){
                awayScore++;
            }else{
                homeScore++;
            }

            events.push({
                minute: match[`Opp. Goal min ${i}`],
                side: homeMatch ? "right" : "left",
                player: match[`Opp. Goal Player ${i}`],
                assist: match[`Opp. Assist player ${i}`] || "",
                score: `${homeScore} - ${awayScore}`, 
                penalty:
                    match[`Opp. Penalty player ${i}`] &&
                    String(match[`Opp. Penalty scored ${i}`] || "")
                        .trim()
                        .toLowerCase() !== "not in"
            });

        }

    }

    // MISSED PENALTIES

for(let i=1;i<=12;i++){

    if(
        match[`Penalty player ${i}`] &&
        String(match[`Penalty scored ${i}`] || "")
            .trim()
            .toLowerCase() === "not in"
    ){

        events.push({
            minute: match[`Penalty min ${i}`],
            side: homeMatch ? "left" : "right",
            player: match[`Penalty player ${i}`],
            missedPenalty: true
        });

    }

    if(
        match[`Opp. Penalty player ${i}`] &&
        String(match[`Opp. Penalty scored ${i}`] || "")
            .trim()
            .toLowerCase() === "not in"
    ){

        events.push({
            minute: match[`Opp. Penalty min ${i}`],
            side: homeMatch ? "right" : "left",
            player: match[`Opp. Penalty player ${i}`],
            missedPenalty: true
        });

    }

}
    // SUBSTITUTIONS

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]){

            events.push({
                minute: match[`Sub min ${i}`],
                side: homeMatch ? "left" : "right",
                on: match[`Sub on ${i}`],
                off: match[`Sub off ${i}`]
            });

        }

        if(match[`Opp. Sub on ${i}`]){

            events.push({
                minute: match[`Opp. Sub min ${i}`],
                side: homeMatch ? "right" : "left",
                on: match[`Opp. Sub on ${i}`],
                off: match[`Opp. Sub off ${i}`]
            });

        }

    }

    // YELLOW CARDS

    for(let i=1;i<=12;i++){

        if(match[`Yellow player ${i}`]){

            events.push({
                minute: match[`Yellow min ${i}`],
                side: homeMatch ? "left" : "right",
                icon: "🟨",
                player: match[`Yellow player ${i}`]
            });

        }

        if(match[`Opp. Yellow player ${i}`]){

            events.push({
                minute: match[`Opp. Yellow min ${i}`],
                side: homeMatch ? "right" : "left",
                icon: "🟨",
                player: match[`Opp. Yellow player ${i}`]
            });

        }

    }

    // RED CARDS

    for(let i=1;i<=5;i++){

        if(match[`Red player ${i}`]){

            events.push({
                minute: match[`Red min ${i}`],
                side: homeMatch ? "left" : "right",
                icon: "🟥",
                player: match[`Red player ${i}`]
            });

        }

        if(match[`Opp. Red player ${i}`]){

            events.push({
                minute: match[`Opp. Red min ${i}`],
                side: homeMatch ? "right" : "left",
                icon: "🟥",
                player: match[`Opp. Red player ${i}`]
            });

        }

    }

    sortByMinute(events);

function eventRow(side, minute, content){

    return `
        <div class="timeline-row">

            ${
                side === "left"
                ? `
                    <div class="timeline-home">
                        <div class="timeline-minute">${minute}'</div>
                        <div class="timeline-event">${content}</div>
                    </div>
                `
                : `
                    <div class="timeline-away">
                        <div class="timeline-event">${content}</div>
                        <div class="timeline-minute">${minute}'</div>
                    </div>
                `
            }

        </div>
    `;
}

let timelineHtml = `
<div class="card">

    <div class="timeline-modern">
`;

events.forEach(event => {

    let content = "";

if(event.assist !== undefined){

    content = `
<span class="timeline-score">
    ⚽ ${event.score}
</span>

<strong>${escapeHtml(event.player)}</strong>

${
    event.assist
        ? ` <small>(🅰 ${escapeHtml(event.assist)})</small>`
        : ""
}
`;

    }else if(event.on){

content = `
<span class="sub-out">⬅</span>
${escapeHtml(event.off)}

<span class="sub-in" style="margin-left:8px;">➡</span>
${escapeHtml(event.on)}
`;

}else if(event.icon){

    content = `
        <div class="timeline-event">
            ${event.icon}
            ${escapeHtml(event.player)}
        </div>
    `;
}

    timelineHtml += eventRow(
        event.side,
        event.minute,
        content
    );

});

timelineHtml += `
    </div>
</div>
`;

return {
    timelineHtml
};
}
function hasStartingXI(match,prefix=""){

    for(let i=1;i<=11;i++){

        if(match[`${prefix}Player name ${i}`]){
            return true;
        }

    }

    return false;

}

function hasBench(match,prefix=""){

    for(let i=1;i<=12;i++){

        if(match[`${prefix}On the bench name ${i}`]){
            return true;
        }

    }

    return false;

}

function showLineup(team){

    const barca =
        document.getElementById("lineup-barca");

    const opp =
        document.getElementById("lineup-opp");

    const tabs =
        document.querySelectorAll(".lineup-tab");

    tabs.forEach(tab =>
        tab.classList.remove("active")
    );

    if(team === "barca"){

        barca.classList.remove("mobile-hidden");
        opp.classList.add("mobile-hidden");

        tabs[0].classList.add("active");

    }else{

        opp.classList.remove("mobile-hidden");
        barca.classList.add("mobile-hidden");

        tabs[1].classList.add("active");

    }

}

function isHomeMatch(match){
    return String(match["Home/Away"] || "").trim() === "Home";
}
    
function renderMatch(match){

const homeMatch = isHomeMatch(match);

const teamA = homeMatch
    ? "Barcelona"
    : (match["Opp. Team"] || "");

const teamB = homeMatch
    ? (match["Opp. Team"] || "")

document.getElementById("app").innerHTML = `

if(window.innerWidth <= 900){

    const opp =
        document.getElementById("lineup-opp");

    if(opp){
        opp.classList.add("mobile-hidden");
    }

}

}

window.addEventListener("resize", () => {

    const barca =
        document.getElementById("lineup-barca");

    const opp =
        document.getElementById("lineup-opp");

    if (!barca || !opp) {
        return;
    }

    if (window.innerWidth > 900) {

        barca.classList.remove("mobile-hidden");
        opp.classList.remove("mobile-hidden");

    } else {

        if (
            !barca.classList.contains("mobile-hidden") &&
            !opp.classList.contains("mobile-hidden")
        ) {
            opp.classList.add("mobile-hidden");
        }

    }

});

(function(){

    const savedTheme =
        localStorage.getItem("theme");

    const systemTheme =
        window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";

    const theme =
        savedTheme || systemTheme;

    document.documentElement.setAttribute(
        "data-theme",
        theme
    );

    const button =
        document.getElementById("themeToggle");

    button.textContent =
        theme === "dark"
            ? "☀️"
            : "🌙";

    button.addEventListener("click", () => {

        const current =
            document.documentElement.getAttribute("data-theme");

        const next =
            current === "dark"
                ? "light"
                : "dark";

        document.documentElement.setAttribute(
            "data-theme",
            next
        );

        localStorage.setItem(
            "theme",
            next
        );

        button.textContent =
            next === "dark"
                ? "☀️"
                : "🌙";

    });

})();
</script>

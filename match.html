<body>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

<div class="container">

    <div class="header">
        <h1 id="seasonTitle">FC Barcelona</h1>

        <div class="hero-subtitle">
            Statistics & Historical Database
        </div>
    </div>

    <div id="app">
        Loading...
    </div>

</div>

<script>

console.log("SCRIPT STARTED");

(function(){

if(!localStorage.getItem("theme")){

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

document.documentElement.setAttribute(
"data-theme",
systemTheme
);

}else{

document.documentElement.setAttribute(
"data-theme",
localStorage.getItem("theme")
);

}

})();

const params = new URLSearchParams(location.search);
const matchId = params.get("id");

console.log("ID:", matchId);

if (!matchId) {
    document.getElementById("app").innerHTML =
        "<div class='card'>Missing ID in URL</div>";
    throw new Error("Missing id parameter");
}

fetch("./data.json")
.then(r => {

if (!r.ok) {
throw new Error(`HTTP ${r.status}`);
}

return r.json();
})
.then(data => {

    console.log("DATA LOADED");
    console.log(data);

    if (!Array.isArray(data)) {
        throw new Error("data.json is not an array");
    }

console.log("Looking for ID:", matchId);

const match =
data.find(
row =>
String(row.ID).trim() ===
String(matchId).trim()
);

if (!match) {

document.getElementById("app").innerHTML =
"<div class='card'>Match not found</div>";

return;
}

renderMatch(match, data);

})

.catch(error => {

console.error(error);

document.getElementById("app").innerHTML = `
       <div class="card">
           Error:<br>
           ${error.message}
       </div>
   `;

});

function showMatchSection(section){

if(window.innerWidth > 900){
return;
}

const current =
document.querySelector(".match-section.active");

const next =
document.getElementById(section);

const isLineups =
section === "squads-section";

current?.classList.remove("active");

next.classList.remove("slide-left","slide-right");
next.classList.add(
isLineups ? "slide-right" : "slide-left"
);

next.classList.add("active");

document
.querySelectorAll(".match-tab")
.forEach(el => el.classList.remove("active"));

document
.querySelector(`[data-section="${section}"]`)
.classList.add("active");
}

function escapeHtml(str){

    if(str === null || str === undefined){
        return "";
    }

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
}

function getPlayerIcons(match, playerName, prefix="") {

    const events = [];

    // Góly
    for(let i=1; i<=12; i++){
        if(
            String(match[`${prefix}Goal Player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Goal min ${i}`],
                icon: "⚽"
            });
        }
    }

    // Asistencie
    for(let i=1; i<=12; i++){
        if(
            String(match[`${prefix}Assist Player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Goal min ${i}`],
                icon: "🅰️"
            });
        }
    }

    // Žlté karty
    for(let i=1; i<=12; i++){
        if(
            String(match[`${prefix}Yellow player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Yellow min ${i}`],
                icon: "🟨"
            });
        }
    }

    // Červené karty
    for(let i=1; i<=5; i++){
        if(
            String(match[`${prefix}Red player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Red min ${i}`],
                icon: "🟥"
            });
        }
    }

    // Striedanie IN
    for(let i=1; i<=6; i++){
        if(
            String(match[`${prefix}Sub on ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Sub min ${i}`],
                icon: '<span style="color:#16a34a;font-weight:700;">⬆</span>'
            });
        }
    }

    // Striedanie OUT
    for(let i=1; i<=6; i++){
        if(
            String(match[`${prefix}Sub off ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Sub min ${i}`],
                icon: '<span style="color:#dc2626;font-weight:700;">⬇</span>'
            });
        }
    }

    events.sort((a,b) => {

        const ma =
            parseInt(String(a.minute).match(/\d+/)?.[0] || 0);

        const mb =
            parseInt(String(b.minute).match(/\d+/)?.[0] || 0);

        return ma - mb;
    });

    return events.map(e => e.icon).join(" ");
}

function getPlayers(match,prefix=""){

const captain = match[`${prefix}Captain`] || "";

const subbedOff = [];

for(let i=1;i<=6;i++){

const player = match[`${prefix}Sub off ${i}`];

if(player){
subbedOff.push(String(player).trim());
}
}

let html="";

for(let i=1;i<=11;i++){

const player =
match[`${prefix}Player name ${i}`];

const number =
match[`${prefix}Player number ${i}`];

if(player && String(player).trim()){

html += `
           <div class="player">
               <div class="number">
                   ${escapeHtml(number || "")}
               </div>

       <span class="player-name">
           ${escapeHtml(player)}
           ${
               String(player).trim() === String(captain).trim()
                   ? '<strong style="margin-left:2px;">(C)</strong>'
                   : ''
           }
           <span class="player-icons">
               ${getPlayerIcons(match, player, prefix)}
           </span>
</span>
           </div>
           `;
}

function getBench(match, prefix="") {

}

function getTimeline(match){

const events = [];

let homeScore = 0;
let awayScore = 0;

const homeMatch =
String(match["Home/Away"] || "").trim() === "Home";

function sortByMinute(arr){

arr.sort((a,b) => {

const aCheck = String(a.minute).trim() === "✔";
const bCheck = String(b.minute).trim() === "✔";

if (aCheck && !bCheck) return 1;
if (!aCheck && bCheck) return -1;
if (aCheck && bCheck) return 0;

const ma =
parseInt(String(a.minute).match(/\d+/)?.[0] || 0);

const mb =
parseInt(String(b.minute).match(/\d+/)?.[0] || 0);

return ma - mb;

});

}

// GOALS

for(let i=1;i<=12;i++){

if(match[`Goal Player ${i}`]){

events.push({
minute: match[`Goal min ${i}`],
side: homeMatch ? "left":"right",
player: match[`Goal Player ${i}`],
assist: match[`Assist Player ${i}`] || "",
penalty:
match[`Penalty player ${i}`] &&
String(match[`Penalty scored ${i}`] || "")
.trim()
.toLowerCase() !== "not in"
});

}

if(match[`Opp. Goal Player ${i}`]){

events.push({
minute: match[`Opp. Goal min ${i}`],
side: homeMatch ? "right":"left",
player: match[`Opp. Goal Player ${i}`],
assist: match[`Opp. Assist player ${i}`] || "",
penalty:
match[`Opp. Penalty player ${i}`] &&
String(match[`Opp. Penalty scored ${i}`] || "")
.trim()
.toLowerCase() !== "not in"
});

}

}

// MISSED PENALTIES

for(let i=1;i<=12;i++){

if(
match[`Penalty player ${i}`] &&
String(match[`Penalty scored ${i}`] || "")
.trim()
.toLowerCase() === "not in"
){

events.push({
minute: match[`Penalty min ${i}`],
side: homeMatch ? "left":"right",
player: match[`Penalty player ${i}`],
missedPenalty: true
});

}

if(
match[`Opp. Penalty player ${i}`] &&
String(match[`Opp. Penalty scored ${i}`] || "")
.trim()
.toLowerCase() === "not in"
){

events.push({
minute: match[`Opp. Penalty min ${i}`],
side: homeMatch ? "right":"left",
player: match[`Opp. Penalty player ${i}`],
missedPenalty: true
});

}

}
// SUBSTITUTIONS

for(let i=1;i<=6;i++){

if(match[`Sub on ${i}`]){

events.push({
minute: match[`Sub min ${i}`],
side: homeMatch ? "left":"right",
on: match[`Sub on ${i}`],
off: match[`Sub off ${i}`]
});

}

if(match[`Opp. Sub on ${i}`]){

events.push({
minute: match[`Opp. Sub min ${i}`],
side: homeMatch ? "right":"left",
on: match[`Opp. Sub on ${i}`],
off: match[`Opp. Sub off ${i}`]
});

}

}

// YELLOW CARDS

for(let i=1;i<=12;i++){

if(match[`Yellow player ${i}`]){

events.push({
minute: match[`Yellow min ${i}`],
side: homeMatch ? "left":"right",
icon: "🟨",
player: match[`Yellow player ${i}`]
});

}

if(match[`Opp. Yellow player ${i}`]){

events.push({
minute: match[`Opp. Yellow min ${i}`],
side: homeMatch ? "right":"left",
icon: "🟨",
player: match[`Opp. Yellow player ${i}`]
});

}

}

// RED CARDS

for(let i=1;i<=5;i++){

if(match[`Red player ${i}`]){

events.push({
minute: match[`Red min ${i}`],
side: homeMatch ? "left":"right",
icon: "🟥",
player: match[`Red player ${i}`]
});

}

if(match[`Opp. Red player ${i}`]){

events.push({
minute: match[`Opp. Red min ${i}`],
side: homeMatch ? "right":"left",
icon: "🟥",
player: match[`Opp. Red player ${i}`]
});

}

}

sortByMinute(events);

let currentHome = 0;
let currentAway = 0;

events.forEach(event => {

if(event.assist !== undefined){

if(event.side === "left"){
currentHome++;
}else{
currentAway++;
}

event.score = `${currentHome}:${currentAway}`;
}

});

function eventRow(side, minute, content){

const minuteLabel =
/^\d+(\+\d+)?$/.test(String(minute).trim())
? `${minute}'`
: escapeHtml(minute);

return `
       <div class="timeline-row">

           ${
               side === "left"
               ? `
                   <div class="timeline-home">
                       <div class="timeline-minute">${minuteLabel}</div>
                       <div class="timeline-event">${content}</div>
                   </div>
               `
               : `
                   <div class="timeline-away">
                       <div class="timeline-event">${content}</div>
                       <div class="timeline-minute">${minuteLabel}</div>
                   </div>
               `
           }

       </div>
   `;
}

let timelineHtml = `
<div class="card">

   <div class="timeline-modern">
`;

events.forEach(event => {

let content = "";

if(event.assist !== undefined){

if(event.side === "right"){

content = `
           ${
               event.assist
                   ? `<span style="color:#d3d3d3;">${escapeHtml(event.assist)}</span>`
                   : ""
           }

           <strong>${escapeHtml(event.player)}</strong>

           <span class="timeline-score">
               ${event.score}
           </span>

           <span class="event-icon">⚽</span>
       `;

}else{

content = `
           <span class="event-icon">⚽</span>

           <span class="timeline-score">
               ${event.score}
           </span>

           <strong>${escapeHtml(event.player)}</strong>

           ${
               event.assist
                   ? `<span style="color:#d3d3d3;">${escapeHtml(event.assist)}</span>`
                   : ""
           }
       `;

}

}else if(event.on){

if(event.side === "right"){

content = `
           <strong>${escapeHtml(event.on)}</strong>
           for
           ${escapeHtml(event.off)}
           <span class="event-icon">🔄</span>
       `;

}else{

content = `
           <span class="event-icon">🔄</span>
           <strong>${escapeHtml(event.on)}</strong>
           for
           ${escapeHtml(event.off)}
       `;

}

}else if(event.icon){

if(event.side === "right"){

content = `
           ${escapeHtml(event.player)}
           <span class="event-icon">${event.icon}</span>
       `;

}else{

content = `
           <span class="event-icon">${event.icon}</span>
           ${escapeHtml(event.player)}
       `;

}
}

timelineHtml += eventRow(
event.side,
event.minute,
content
);

});

timelineHtml += `
   </div>
</div>
`;

return {
timelineHtml
};
}

function isHomeMatch(match){
return String(match["Home/Away"] || "").trim() === "Home";
}

function getH2H(match, allMatches){

const opponent =
String(match["Opp. Team"] || "").trim();

const currentMatchDate =
new Date(
match.Date.split(".").reverse().join("-")
);

const allH2H = allMatches
.filter(row => {

const sameOpponent =
String(row["Opp. Team"] || "").trim() === opponent;

const playedMatch =
String(row.Result || "").trim() !== "-:-";

const matchDate =
new Date(
row.Date.split(".").reverse().join("-")
);

const olderMatch =
matchDate < currentMatchDate;

return (
sameOpponent &&
playedMatch &&
olderMatch
);

});

const wins =
allH2H.filter(
row => row["Result type"] === "W"
).length;

const draws =
allH2H.filter(
row => row["Result type"] === "D"
).length;

const losses =
allH2H.filter(
row => row["Result type"] === "L"
).length;

const h2hMatches = [...allH2H]
.sort((a,b) =>
new Date(b.Date.split(".").reverse().join("-")) -
new Date(a.Date.split(".").reverse().join("-"))
)
.slice(0,10);

                       <div class="h2h-label">
                           Losses
                       </div>
                   </div>
           
               </div>
               
               <div class="h2h-last10">
                   Last 10 Matches

               <table class="matches-table">
   
                   <thead>
                       <tr>
                           <th>Date</th>

                       </tr>
                   </thead>

       `;

h2hMatches.forEach(row => {

let resultClass = "result-empty";

switch(row["Result type"]){

case "W":
resultClass = "result-win";
break;

case "D":
resultClass = "result-draw";
break;

case "L":
resultClass = "result-loss";
break;
}

html += `
           <tr onclick="location.href='match.html?id=${row.ID}'">

               <td>
                   ${row.Date || ""}
               </td>

               <td>
                   ${row.Matchday || ""}
               </td>

               <td>
                   ${row.Competition || ""}
               </td>

               <td>
                   ${row["Home/Away"] || ""}
               </td>

               <td>
                   <span class="result-badge ${resultClass}">
                       ${row.Result || "-:-"}
                   </span>
               </td>

           </tr>
       `;
});

html += `
               </tbody>

           </table>

       </div>
   `;

return html;
}

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --barca-blue:#004D98;
    --barca-red:#A50044;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f9;
    color:#1f2937;
    font-family:'Roboto',sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.hero{
    background:linear-gradient(
        135deg,
        var(--barca-blue),
        var(--barca-red)
    );
    color:white;
    border-radius:24px;
    padding:40px;
    margin-bottom:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.score{
    font-size:72px;
    font-weight:700;
    margin:10px 0;
}

.teams{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.team-name{
    font-size:28px;
    font-weight:700;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.section-title{
    margin-top:0;
}

.meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.meta{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

.meta-label{
    font-size:11px;
    text-transform:uppercase;
    color:#6b7280;
}

.meta-value{
    margin-top:4px;
    font-weight:700;
}

.lineups{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.team-card{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

.player{
    display:flex;
    gap:10px;
    align-items:center;
    padding:6px 0;
}

.number{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--barca-blue);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
    font-weight:700;
}

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:24px;
    width:3px;
    background:#e5e7eb;
}

.timeline-item{
    display:flex;
    gap:15px;
    margin-bottom:18px;
}

.timeline-minute{
    width:48px;
    text-align:center;
    font-weight:700;
}

.timeline-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

.timeline-content{
    flex:1;
    background:#f8fafc;
    padding:12px;
    border-radius:12px;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--barca-blue);
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:999px;
}

@media(max-width:900px){

    .teams{
        flex-direction:column;
        gap:15px;
    }

    .lineups{
        grid-template-columns:1fr;
    }

    .score{
        font-size:48px;
    }

}

</style>
</head>

<body>

<div class="container">

<div id="app">
Načítavam...
</div>

</div>

<a href="index.html" class="back-btn">
← Matches
</a>

<script>

const params = new URLSearchParams(location.search);
const matchId = params.get("id");

fetch("data.json")
.then(r => r.json())
.then(data => {

    const match =
    data.find(
        row =>
            String(row.ID).trim() ===
            String(matchId).trim()
    );

    if(!match){

        document.getElementById("app").innerHTML =
            "<div class='card'>Match not found</div>";

        return;
    }

    renderMatch(match);

});

function getPlayers(match,prefix=""){

    let html="";

    for(let i=1;i<=11;i++){

        const player =
            match[`${prefix}Player name ${i}`];

        const number =
            match[`${prefix}Player number ${i}`];

        if(player){

            html += `
            <div class="player">
                <div class="number">
                    ${number || ""}
                </div>

                ${player}
            </div>
            `;
        }
    }

    return html;
}

function getBench(match,prefix=""){

    let html="";

    for(let i=1;i<=12;i++){

        const player =
            match[`${prefix}On the bench name ${i}`];

        const number =
            match[`${prefix}On the bench number ${i}`];

        if(player){

            html += `
            <div class="player">
                <div class="number">
                    ${number || ""}
                </div>

                ${player}
            </div>
            `;
        }
    }

    return html;
}

function getTimeline(match){

    const events = [];

    function addEvent(
        minute,
        icon,
        text,
        team
    ){

        if(!minute) return;

        events.push({
            minute,
            icon,
            text,
            team
        });

    }
    for(let i=1;i<=12;i++){

        if(match[`Goal Player ${i}`]){

            addEvent(
                match[`Goal min ${i}`],
                "⚽",
                `${match[`Goal Player ${i}`]}`,
                "barca"
            );
        }

        if(match[`Opp. Goal Player ${i}`]){

            addEvent(
                match[`Opp. Goal min ${i}`],
                "⚽",
                `${match[`Opp. Goal Player ${i}`]}`,
                "opp"
            );
        }

        if(match[`Yellow player ${i}`]){

            addEvent(
                match[`Yellow min ${i}`],
                "🟨",
                match[`Yellow player ${i}`],
                "barca"
            );
        }

        if(match[`Opp. Yellow player ${i}`]){

            addEvent(
                match[`Opp. Yellow min ${i}`],
                "🟨",
                match[`Opp. Yellow player ${i}`],
                "opp"
            );
        }
    }

    for(let i=1;i<=5;i++){

        if(match[`Red player ${i}`]){

            addEvent(
                match[`Red min ${i}`],
                "🟥",
                match[`Red player ${i}`],
                "barca"
            );
        }

        if(match[`Opp. Red player ${i}`]){

            addEvent(
                match[`Opp. Red min ${i}`],
                "🟥",
                match[`Opp. Red player ${i}`],
                "opp"
            );
        }
    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]){

            addEvent(
                match[`Sub min ${i}`],
                "🔄",
                `${match[`Sub on ${i}`]} ⇢ ${match[`Sub off ${i}`]}`,
                "barca"
            );
        }

        if(match[`Opp. Sub on ${i}`]){

            addEvent(
                match[`Opp. Sub min ${i}`],
                "🔄",
                `${match[`Opp. Sub on ${i}`]} ⇢ ${match[`Opp. Sub off ${i}`]}`,
                "opp"
            );
        }
    }

    events.sort((a,b)=>{

        const ma =
            parseInt(String(a.minute).match(/\d+/)?.[0] || 0);

        const mb =
            parseInt(String(b.minute).match(/\d+/)?.[0] || 0);

        return ma - mb;

    });

    let html = "";

    events.forEach(event => {

        html += `
        <div class="timeline-item">

            <div class="timeline-minute">
                ${event.minute}'
            </div>

            <div class="timeline-icon">
                ${event.icon}
            </div>

            <div
                class="timeline-content"
                style="
                    border-left:4px solid ${
                        event.team === "barca"
                        ? "#004D98"
                        : "#A50044"
                    };
                "
            >
                ${event.text}
            </div>

        </div>
        `;
    });

    return html || "";
}

function renderMatch(match){

document.getElementById("app").innerHTML = `

<div class="hero">

    <div class="teams">

        <div class="team-name">
            FC Barcelona
        </div>

        <div class="score">
            ${match["Result"] || "-:-"}
        </div>

        <div class="team-name">
            ${match["Opp. Team"] || ""}
        </div>

    </div>

    <div style="margin-top:15px;">
        ${match["Competition"] || ""}
        • Matchday ${match["Matchday"] || ""}
        <br>
        ${match["Date"] || ""}
    </div>

</div>

<div class="card">

<h2 class="section-title">
Match Information
</h2>

<div class="meta-grid">

<div class="meta">
<div class="meta-label">Venue</div>
<div class="meta-value">
${match["Venue"] || "-"}
</div>
</div>

<div class="meta">
<div class="meta-label">Referee</div>
<div class="meta-value">
${match["Referee"] || "-"}
</div>
</div>

<div class="meta">
<div class="meta-label">Manager</div>
<div class="meta-value">
${match["Manager"] || "-"}
</div>
</div>

<div class="meta">
<div class="meta-label">Opponent Manager</div>
<div class="meta-value">
${match["Opp. Manager"] || "-"}
</div>
</div>

</div>

</div>

<div class="card">

<h2 class="section-title">
Starting XI
</h2>

<div class="lineups">

<div class="team-card">
<h3>FC Barcelona</h3>
${getPlayers(match)}
</div>

<div class="team-card">
<h3>${match["Opp. Team"]}</h3>
${getPlayers(match,"Opp. ")}
</div>

</div>

</div>

<div class="card">

<h2 class="section-title">
Bench
</h2>

<div class="lineups">

<div class="team-card">
${getBench(match)}
</div>

<div class="team-card">
${getBench(match,"Opp. ")}
</div>

</div>

</div>

<div class="card">

<h2 class="section-title">
Match Timeline
</h2>

<div class="timeline">
${getTimeline(match)}
</div>

</div>

`;

}

</script>

</body>
</html>

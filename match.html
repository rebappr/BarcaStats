<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

    <link rel="icon.png
    <linkicon-16x16.png
    <linkle-touch-icon.png
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" rel="stylesheet">
<link href="s.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
    
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;

    background:
        radial-gradient(circle at top left,#004D98 0%,transparent 35%),
        radial-gradient(circle at top right,#A50044 0%,transparent 35%),
        var(--bg);

    color:var(--text);
    min-height:100vh;
}

.theme-toggle{
    position:fixed;
    left:20px;
    bottom:20px;

    width:52px;
    height:52px;

    border:none;
    border-radius:50%;

    cursor:pointer;

    background:#A50044;
    color:white;

    font-size:20px;
    font-weight:700;

    z-index:9999;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:10px;
}

.hero{
    background:
        linear-gradient(
            135deg,
            rgba(0,77,152,.95),
            rgba(165,0,68,.95)
        );
    
    color:white;
    border-radius:28px;
    padding:10px 18px;
    margin-bottom:10px;
    font-size: 14px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.score{
    font-size:30px;
    font-weight:700;
    margin:4px 0;
    text-align:center;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-bottom: 6px;
}

.teams .team-name:first-of-type{
    text-align:left;
}

.teams .team-name:last-of-type{
    text-align:right;
}

.team-name{
    font-size:22px;
    font-weight:700;
    text-transform:uppercase;
}

.match-section{
    display:none;
}

.match-section.active{
    display:block;
    animation:slideContent .3s ease;
}

.slide-right{
    animation:slideRight .25s ease;
}

.slide-left{
    animation:slideLeft .25s ease;
}

@keyframes slideRight{
    from{
        opacity:0;
        transform:translateX(20px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }

@keyframes slideLeft{
    from{
        opacity:0;
        transform:translateX(-20px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

}

.matches-table{
    width:100%;
    border-collapse:collapse;
}

.matches-table th{
    background:var(--meta-bg);
    color:var(--muted);
    text-align:left;
    padding:10px;
}

.matches-table td{
    padding:10px;
    border-bottom:1px solid var(--meta-border);
}

.matches-table tbody tr:hover{
    background:var(--meta-bg);
    cursor:pointer;
}

.matches-table th:nth-child(1),
.matches-table td:nth-child(1){
width:1%;
text-align:center;
}

.matches-table th:nth-child(2),
.matches-table td:nth-child(2){
width:auto;
}

.matches-table th:nth-child(3),
.matches-table td:nth-child(3){
width:1%;
}

.matches-table th:nth-child(4),
.matches-table td:nth-child(4){
width:1%;
text-align:center;
}

.matches-table th:nth-child(5),
.matches-table td:nth-child(5){
width:1%;
text-align:center;
}

th:first-child,
td:first-child{
padding-left:16px;
}

th:last-child,
td:last-child{
padding-right:16px;
}

th,
td{
padding:5px;
font-size:13px;
}

th{
background:var(--meta-bg);
color:var(--muted);
text-align:left;
padding:12px;
position:sticky;
top:0;
z-index:10;
}

td{
padding:8px;
border-bottom:1px solid var(--meta-border);
}

tbody tr{
transition:.25s;
}

.matches-table tbody tr:hover{
background:var(--meta-bg);
cursor:pointer;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:999px;
background:#dbeafe;
color:#1e40af;
font-weight:600;
}

.result-badge{
display:inline-block;
min-width:52px;
text-align:center;
border-radius:999px;
padding:4px 10px;
font-weight:700;
}

.result-win{
background:var(--result-win-bg);
border:1px solid var(--result-win);
color:var(--result-win);
}

.result-draw{
background:var(--result-draw-bg);
border:1px solid var(--result-draw);
color:var(--result-draw);
}

.result-loss{
background:var(--result-loss-bg);
border:1px solid var(--result-loss);
color:var(--result-loss);
}


.result-empty{
background:var(--card-bg);
color:var(--muted);
}

.card{
    background:var(--card-bg);
    backdrop-filter:blur(20px);

    border:1px solid var(--card-border);

    border-radius:24px;

    padding:8px 14px;
    margin-bottom:8px;

    transition:.3s;
}

.section-title{
    color:var(--text);
    font-size:14px;
    font-weight:800;
    margin-bottom:3px;
}

.meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:6px;
}

.meta{
    background:var(--meta-bg);
    border:1px solid var(--meta-border);
    padding:8px;
    border-radius:16px;
}

.meta-label{
    font-size:11px;
    text-transform:uppercase;
    color:var(--muted);
}

.meta-value{
    margin-top:4px;
    font-weight:700;
    font-size:13px;
}

.timeline-title{
    margin:10px 0 5px;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.5px;
}

.lineups{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.content-grid{
    display:block;
}

.left-column,
.right-column{
    display:flex;
    flex-direction:column;
    gap:6px;
    position:sticky;
    top:10px;
}

.team-card{
    padding:0;
}

.team-card h3{
    font-size:15px;
    margin-bottom:10px;
}

.team-card h4{
    font-size:13px;
    margin:10px 0 6px;
}

.team-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.team-header.home{
    justify-content:center;
}

.team-header.away{
    justify-content:center;
}
    
.player{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 0;
    font-size:13px;
}

.player-name{
    flex:1;
}

.player-icons{
    margin-left:6px;
}

.sub-off{
    color:#dc2626;
    font-weight:700;
}

.number{
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--barca-red);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:700;
}

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:24px;
    width:3px;
    background:var(--divider);
}

.timeline-item{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.timeline-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

.timeline-content{
    flex:1;
    background:var(--surface);
    padding:6px;
    border-radius:12px;
}

.timeline-modern{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.timeline-row{
    display:flex;
    width:100%;
    margin-bottom:8px;
}

.timeline-row:last-child{
    border-bottom:none;
}

.timeline-home{
    display:flex;
    align-items:center;
    gap:5px;
}

.timeline-away{
    display:flex;
    align-items:center;
    gap:4px;
    margin-left:auto;
    justify-content:flex-end;
}

.timeline-away .timeline-event{
    display:flex;
    align-items:center;
    gap:4px;
}

.timeline-home{
    flex-shrink:0;
}

.timeline-away{
    flex-shrink:0;
}

.timeline-event{
    font-size:12px;
    line-height:1.3;
    max-width:none;
}

.timeline-minute{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    min-width:auto;
    opacity:.8;
}

.timeline-away .timeline-event{
    text-align:right;
}

.timeline-event{
    font-size:13px;
    line-height:1.6;
}

.timeline-score{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:30px;
    padding:0;
    font-weight:800;
}

.sub-in{
    color:#16a34a;
    font-weight:700;
}

.sub-out{
    color:#dc2626;
    font-weight:700;
}

.timeline-break{
    height:1px;
    background:var(--divider);
    margin:10px 0;
}

.event-home{
    text-align:right;
}

.event-away{
    text-align:left;
}

.event-home .event-icon{
    float:right;
    margin-left:4px;
    margin-right:0;
}

.event-away .event-icon{
    margin-right:4px;
}

.event-box::after{
    content:"";
    display:block;
    clear:both;
}

.event-icon{
    display:inline-block;
    margin:0 4px;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:
        linear-gradient(
            135deg,
            #004D98,
            #A50044
        );
    color:white;
    text-decoration:none;
    padding:14px 22px;
    border-radius:999px;
    font-weight:700;
    box-shadow:
        0 10px 25px rgba(0,0,0,.25);
}

.content-sections{
    display:block;
}

@media(min-width:901px){

    .left-column,
    .right-column{
        display:flex;
        flex-direction:column;
        gap:8px;
    }

    .right-column{
        position:sticky;
        top:10px;
    }

    .match-tabs,
    .lineup-tabs{
        display:none;
    }

    .content-sections{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap:10px;
        align-items:start;
    }

    .match-section{
        display:block !important;
    }

}

@media(max-width:900px){

    .theme-toggle{
        display:none;
    }

    .match-tabs,
    .lineup-tabs{
        display:flex;
        flex-wrap:wrap;
        display:flex;
        gap:10px;
        margin:10px 0;
    }

    .match-tab,
    .lineup-tab{
        position:relative;
        flex:none;
        width:auto;
        height:auto;
        padding:6px 10px;


        background:transparent;
        border:none;
        border-radius:0;

        color:var(--tabs-text);
        font-size:13px;
        font-weight:700;
    }

    .match-tab:hover,
    .lineup-tab:hover{
        background:transparent;
        cursor:pointer;
    }

    .match-tab.active, 
     .lineup-tab.active{
        background:transparent;
        color:var(--tabs-active);
    }

    .match-tab.active::after,
    .lineup-tab.active::after
        {
        position:absolute;
        left:0;
        right:0;
        bottom:0;
        content:"";
        display:block;
        height:2px;
        margin-top:4px;
        margin-bottom:0;
        background:var(--tabs-active);
        border-radius:999px;
    }

    .timeline-event{
        font-size:12px;
    }
    
    .timeline-score{
        font-size:12px;
    }

    .content-grid{
        grid-template-columns:1fr;
    }
    
    .mobile-hidden,
    .team-card h3{
        display:none;
    }

    .hero{
        font-size:13px;
    }

    .match-header{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:12px;
        flex-direction:row;
        text-align:center;
    }

    .teams{
        display:flex;
        align-items:center;
        justify-content:center;
        padding: 10 0;
        gap:12px;
    }
    
    .team-name{
        text-align:center !important;
        font-size:13px;
    }
    .score{
        font-size:13px;
    }

    .lineups{
        display:block;
    }

    #lineup-barca,
    #lineup-opp{
    margin-bottom:15px;
    }

    .sticky-header{
        position:sticky;
        top:0;
        z-index:1000;
    }

.sticky-header::before{
    content:"";

    position:absolute;

    top:-20px;
    left:50%;
    right:0;
    bottom:0;

    transform:translateX(-50%);

    width:100vw;

    background:var(--bg);

    z-index:-1;
}

}

</style>
</head>

<body>

<button id="themeToggle" class="theme-toggle">
    🌙
</button>

<div class="container">

<div id="app">
Loading...
</div>

</div>

<a href="index.html" class="back-btn">
← Matches
</a>

<script>

(function(){

    if(!localStorage.getItem("theme")){

        const systemTheme =
            window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

        document.documentElement.setAttribute(
            "data-theme",
            systemTheme
        );

    }else{

        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("theme")
        );

    }

})();

const params = new URLSearchParams(location.search);
const matchId = params.get("id");

fetch("data.json")
    .then(r => {

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        return r.json();
    })
    .then(data => {

        const match =
            data.find(
                row =>
                    String(row.ID).trim() ===
                    String(matchId).trim()
            );

if (!match) {

    document.getElementById("app").innerHTML =
        "<div class='card'>Match not found</div>";

    return;
}

renderMatch(match, data);

    })

.catch(error => {

    console.error(error);

    document.getElementById("app").innerHTML = `
        <div class="card">
            Error:<br>
            ${error.message}
        </div>
    `;

});

function showMatchSection(section){

    if(window.innerWidth > 900){
        return;
    }

    const current =
        document.querySelector(".match-section.active");

    const next =
        document.getElementById(section);

    const isLineups =
        section === "squads-section";

    current?.classList.remove("active");

    next.classList.remove("slide-left","slide-right");
    next.classList.add(
        isLineups ? "slide-right" : "slide-left"
    );

    next.classList.add("active");

    document
        .querySelectorAll(".match-tab")
        .forEach(el => el.classList.remove("active"));

    document
        .querySelector(`[data-section="${section}"]`)
        .classList.add("active");
}
    
function escapeHtml(str) {

    if (str === null || str === undefined) {
        return "";
    }

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getPlayerIcons(match, playerName, prefix = "") {

    const icons = [];

    // Góly
    for (let i = 1; i <= 12; i++) {
        if (
            String(match[`${prefix}Goal Player ${i}`] || "").trim() ===
            String(playerName).trim()
        ) {
            icons.push("⚽");
        }
    }

    // Žlté karty
    for (let i = 1; i <= 12; i++) {
        if (
            String(match[`${prefix}Yellow player ${i}`] || "").trim() ===
            String(playerName).trim()
        ) {
            icons.push("🟨");
        }
    }

    // Červené karty
    for (let i = 1; i <= 5; i++) {
        if (
            String(match[`${prefix}Red player ${i}`] || "").trim() ===
            String(playerName).trim()
        ) {
            icons.push("🟥");
        }
    }

    return icons.join(" ");
}

function getPlayers(match,prefix=""){

    const captain = match[`${prefix}Captain`] || "";

    const subbedOff = [];

    for(let i=1;i<=6;i++){

        const player = match[`${prefix}Sub off ${i}`];

if(player){
    subbedOff.push(String(player).trim());
    }
}

    let html="";

    for(let i=1;i<=11;i++){

        const player =
            match[`${prefix}Player name ${i}`];

        const number =
            match[`${prefix}Player number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${escapeHtml(number || "")}
                </div>

        <span class="player-name">
            ${escapeHtml(player)}
            ${
                String(player).trim() === String(captain).trim()
                    ? '<strong style="margin-left:2px;">(C)</strong>'
                    : ''
            }
            <span class="player-icons">
                ${getPlayerIcons(match, player, prefix)}
            </span>
    ${
        subbedOff.includes(String(player).trim())
            ? ' <strong style="color:#dc2626;">⬇</strong>'
            : ''
    }
</span>
            </div>
            `;
        }
    }

    return html;
}

function getBench(match,prefix=""){

    const subbedOn = [];

for(let i=1;i<=6;i++){

    const player = match[`${prefix}Sub on ${i}`];

if(player){
    subbedOn.push(String(player).trim());
}
}

    let html="";

    for(let i=1;i<=12;i++){

        const player =
            match[`${prefix}On the bench name ${i}`];

        const number =
            match[`${prefix}On the bench number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${number || ""}
                </div>

                ${escapeHtml(player)}
${
    subbedOn.includes(String(player).trim())
        ? ' <strong style="color:#16a34a;">⬆</strong>'
        : ''
}
            </div>
            `;
        }
    }

    return html;
}

function getTimeline(match){

    const events = [];

    let homeScore = 0;
    let awayScore = 0;

    const homeMatch =
        String(match["Home/Away"] || "").trim() === "Home";

    function sortByMinute(arr){

    arr.sort((a,b) => {
    
        const aCheck = String(a.minute).trim() === "✔";
        const bCheck = String(b.minute).trim() === "✔";
    
        if (aCheck && !bCheck) return 1;
        if (!aCheck && bCheck) return -1;
        if (aCheck && bCheck) return 0;
    
        const ma =
            parseInt(String(a.minute).match(/\d+/)?.[0] || 0);
    
        const mb =
            parseInt(String(b.minute).match(/\d+/)?.[0] || 0);
    
        return ma - mb;
    
    });

    }

    // GOALS

    for(let i=1;i<=12;i++){

        if(match[`Goal Player ${i}`]){
        
            events.push({
                minute: match[`Goal min ${i}`],
                side: homeMatch ? "left":"right",
                player: match[`Goal Player ${i}`],
                assist: match[`Assist Player ${i}`] || "",
                penalty:
                    match[`Penalty player ${i}`] &&
                    String(match[`Penalty scored ${i}`] || "")
                        .trim()
                        .toLowerCase() !== "not in"
            });

        }

        if(match[`Opp. Goal Player ${i}`]){
        
            events.push({
                minute: match[`Opp. Goal min ${i}`],
                side: homeMatch ? "right":"left",
                player: match[`Opp. Goal Player ${i}`],
                assist: match[`Opp. Assist player ${i}`] || "",
                penalty:
                    match[`Opp. Penalty player ${i}`] &&
                    String(match[`Opp. Penalty scored ${i}`] || "")
                        .trim()
                        .toLowerCase() !== "not in"
            });

        }

    }

    // MISSED PENALTIES

for(let i=1;i<=12;i++){

    if(
        match[`Penalty player ${i}`] &&
        String(match[`Penalty scored ${i}`] || "")
            .trim()
            .toLowerCase() === "not in"
    ){

        events.push({
            minute: match[`Penalty min ${i}`],
            side: homeMatch ? "left":"right",
            player: match[`Penalty player ${i}`],
            missedPenalty: true
        });

    }

    if(
        match[`Opp. Penalty player ${i}`] &&
        String(match[`Opp. Penalty scored ${i}`] || "")
            .trim()
            .toLowerCase() === "not in"
    ){

        events.push({
            minute: match[`Opp. Penalty min ${i}`],
            side: homeMatch ? "right":"left",
            player: match[`Opp. Penalty player ${i}`],
            missedPenalty: true
        });

    }

}
    // SUBSTITUTIONS

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]){

            events.push({
                minute: match[`Sub min ${i}`],
                side: homeMatch ? "left":"right",
                on: match[`Sub on ${i}`],
                off: match[`Sub off ${i}`]
            });

        }

        if(match[`Opp. Sub on ${i}`]){

            events.push({
                minute: match[`Opp. Sub min ${i}`],
                side: homeMatch ? "right":"left",
                on: match[`Opp. Sub on ${i}`],
                off: match[`Opp. Sub off ${i}`]
            });

        }

    }

    // YELLOW CARDS

    for(let i=1;i<=12;i++){

        if(match[`Yellow player ${i}`]){

            events.push({
                minute: match[`Yellow min ${i}`],
                side: homeMatch ? "left":"right",
                icon: "🟨",
                player: match[`Yellow player ${i}`]
            });

        }

        if(match[`Opp. Yellow player ${i}`]){

            events.push({
                minute: match[`Opp. Yellow min ${i}`],
                side: homeMatch ? "right":"left",
                icon: "🟨",
                player: match[`Opp. Yellow player ${i}`]
            });

        }

    }

    // RED CARDS

    for(let i=1;i<=5;i++){

        if(match[`Red player ${i}`]){

            events.push({
                minute: match[`Red min ${i}`],
                side: homeMatch ? "left":"right",
                icon: "🟥",
                player: match[`Red player ${i}`]
            });

        }

        if(match[`Opp. Red player ${i}`]){

            events.push({
                minute: match[`Opp. Red min ${i}`],
                side: homeMatch ? "right":"left",
                icon: "🟥",
                player: match[`Opp. Red player ${i}`]
            });

        }

    }

    sortByMinute(events);

    let currentHome = 0;
let currentAway = 0;

events.forEach(event => {

    if(event.assist !== undefined){

        if(event.side === "left"){
            currentHome++;
        }else{
            currentAway++;
        }

        event.score = `${currentHome}:${currentAway}`;
    }

});

function eventRow(side, minute, content){

    const minuteLabel =
        /^\d+(\+\d+)?$/.test(String(minute).trim())
            ? `${minute}'`
            : escapeHtml(minute);

    return `
        <div class="timeline-row">

            ${
                side === "left"
                ? `
                    <div class="timeline-home">
                        <div class="timeline-minute">${minuteLabel}</div>
                        <div class="timeline-event">${content}</div>
                    </div>
                `
                : `
                    <div class="timeline-away">
                        <div class="timeline-event">${content}</div>
                        <div class="timeline-minute">${minuteLabel}</div>
                    </div>
                `
            }

        </div>
    `;
}

let timelineHtml = `
<div class="card">

    <div class="timeline-modern">
`;

events.forEach(event => {

    let content = "";

if(event.assist !== undefined){

    if(event.side === "right"){

        content = `
            ${
                event.assist
                    ? `<small>${escapeHtml(event.assist)}</small>`
                    : ""
            }

            <strong>${escapeHtml(event.player)}</strong>

            <span class="timeline-score">
                ${event.score}
            </span>

            <span class="event-icon">⚽</span>
        `;

    }else{

        content = `
            <span class="event-icon">⚽</span>

            <span class="timeline-score">
                ${event.score}
            </span>

            <strong>${escapeHtml(event.player)}</strong>

            ${
                event.assist
                    ? `<small>${escapeHtml(event.assist)}</small>`
                    : ""
            }
        `;

    }

}else if(event.on){

    if(event.side === "right"){

        content = `
            <strong>${escapeHtml(event.on)}</strong>
            for
            ${escapeHtml(event.off)}
            <span class="event-icon">🔄</span>
        `;

    }else{

        content = `
            <span class="event-icon">🔄</span>
            <strong>${escapeHtml(event.on)}</strong>
            for
            ${escapeHtml(event.off)}
        `;

    }

}else if(event.icon){

    if(event.side === "right"){

        content = `
            ${escapeHtml(event.player)}
            <span class="event-icon">${event.icon}</span>
        `;

    }else{

        content = `
            <span class="event-icon">${event.icon}</span>
            ${escapeHtml(event.player)}
        `;

    }
}

    timelineHtml += eventRow(
        event.side,
        event.minute,
        content
    );

});

timelineHtml += `
    </div>
</div>
`;

return {
    timelineHtml
};
}
function hasStartingXI(match,prefix=""){

    for(let i=1;i<=11;i++){

        if(match[`${prefix}Player name ${i}`]){
            return true;
        }

    }

    return false;

}

function hasBench(match,prefix=""){

    for(let i=1;i<=12;i++){

        if(match[`${prefix}On the bench name ${i}`]){
            return true;
        }

    }

    return false;

}

function hasSquads(match){

    return (
        hasStartingXI(match) ||
        hasStartingXI(match,"Opp. ") ||
        hasBench(match) ||
        hasBench(match,"Opp. ")
    );

}

function hasTimeline(match){

    for(let i=1;i<=12;i++){

        if(
            match[`Goal Player ${i}`] ||
            match[`Opp. Goal Player ${i}`] ||
            match[`Yellow player ${i}`] ||
            match[`Opp. Yellow player ${i}`] ||
            match[`Red player ${i}`] ||
            match[`Opp. Red player ${i}`] ||
            match[`Sub on ${i}`] ||
            match[`Opp. Sub on ${i}`]
        ){
            return true;
        }

    }

    return false;
}

function showLineup(team){

    const barca =
        document.getElementById("lineup-barca");

    const opp =
        document.getElementById("lineup-opp");

    const tabs =
        document.querySelectorAll(".lineup-tab");

    tabs.forEach(tab =>
        tab.classList.remove("active")
    );

    if(team === "barca"){

        barca.classList.remove("mobile-hidden");
        opp.classList.add("mobile-hidden");

        tabs[0].classList.add("active");

    }else{

        opp.classList.remove("mobile-hidden");
        barca.classList.add("mobile-hidden");

        tabs[1].classList.add("active");

    }

}

function isHomeMatch(match){
    return String(match["Home/Away"] || "").trim() === "Home";
}

function getH2H(match, allMatches){

    const opponent =
        String(match["Opp. Team"] || "").trim();

const currentMatchDate =
    new Date(
        match.Date.split(".").reverse().join("-")
    );

const h2hMatches = allMatches
    .filter(row => {

        const sameOpponent =
            String(row["Opp. Team"] || "").trim() === opponent;

        const notCurrentMatch =
            String(row.ID) !== String(match.ID);

        const playedMatch =
            String(row.Result || "").trim() !== "-:-";

        const matchDate =
            new Date(
                row.Date.split(".").reverse().join("-")
            );

        const olderMatch =
            matchDate < currentMatchDate;

        return (
            sameOpponent &&
            notCurrentMatch &&
            playedMatch &&
            olderMatch
        );

    })
    .sort((a,b) =>
        new Date(b.Date.split(".").reverse().join("-")) -
        new Date(a.Date.split(".").reverse().join("-"))
    )
    .slice(0,10);

    let html = `
        <div class="card">

            <table class="matches-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Competition</th>
                            <th>MD</th>
                            <th>V</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                <tbody>
    `;

    h2hMatches.forEach(row => {

        let resultClass = "result-empty";

        switch(row["Result type"]){

            case "W":
                resultClass = "result-win";
                break;

            case "D":
                resultClass = "result-draw";
                break;

            case "L":
                resultClass = "result-loss";
                break;
        }

                html += `
                <tr onclick="location.href='match.html?id=${row.ID}'">
                
                    <td>
                        ${row.Date || ""}
                    </td>
                
                    <td>
                        ${row.Competition || ""}
                    </td>
                
                    <td>
                        ${row.Matchday || ""}
                    </td>
                
                    <td>
                        ${row["Home/Away"] === "Home" ? "H" : "A"}
                    </td>
                
                    <td>
                        <span class="result-badge ${resultClass}">
                            ${row.Result || "-:-"}
                        </span>
                    </td>
                
                </tr>
                `;
    });

                html += `
                            </tbody>
                        </table>
            
                    </div>
                `;

    return html;
}

(function(){

    const savedTheme =
        localStorage.getItem("theme");

    const systemTheme =
        window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";

    const theme =
        savedTheme || systemTheme;

    document.documentElement.setAttribute(
        "data-theme",
        theme
    );

    const button =
        document.getElementById("themeToggle");

    button.textContent =
        theme === "dark"
            ? "☀️"
            : "🌙";

    button.addEventListener("click", () => {

        const current =
            document.documentElement.getAttribute("data-theme");

        const next =
            current === "dark"
                ? "light"
                : "dark";

        document.documentElement.setAttribute(
            "data-theme",
            next
        );

        localStorage.setItem(
            "theme",
            next
        );

        button.textContent =
            next === "dark"
                ? "☀️"
                : "🌙";

    });

})();

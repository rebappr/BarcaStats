<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"red:#A50044;
    --success:#22c55e;
    --warning:#facc15;
    --danger:#ef4444;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f6fa;
    font-family:'Roboto',sans-serif;
    color:#1f2937;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.hero{
    background:linear-gradient(
        135deg,
        var(--barca-blue),
        var(--barca-red)
    );

    color:white;
    border-radius:24px;
    padding:40px;
    margin-bottom:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.teams{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    text-align:center;
}

.team{
    flex:1;
}

.team-name{
    font-size:28px;
    font-weight:700;
}

.score{
    font-size:70px;
    font-weight:900;
    line-height:1;
}

.match-meta{
    margin-top:20px;
    text-align:center;
    opacity:.9;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.section-title{
    margin:0 0 15px;
    font-size:22px;
}

.meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.meta{
    background:#f8fafc;
    border-radius:14px;
    padding:15px;
}

.meta-label{
    font-size:11px;
    text-transform:uppercase;
    color:#6b7280;
    margin-bottom:5px;
}

.meta-value{
    font-weight:700;
}

.lineups{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.team-card{
    background:#f8fafc;
    border-radius:16px;
    padding:15px;
}

.team-card h3{
    margin-top:0;
}

.player{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    border-radius:10px;
}

.player:hover{
    background:white;
}

.number{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--barca-blue);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
}

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    left:24px;
    top:0;
    bottom:0;
    width:3px;
    background:#e5e7eb;
}

.timeline-item{
    display:flex;
    gap:15px;
    margin-bottom:18px;
    position:relative;
}

.timeline-minute{
    width:50px;
    font-weight:700;
    text-align:center;
}

.timeline-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    z-index:2;
}

.timeline-content{
    flex:1;
    background:#f8fafc;
    border-radius:12px;
    padding:10px 14px;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--barca-blue);
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:999px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.loading{
    text-align:center;
    padding:50px;
}

@media(max-width:900px){

    .teams{
        flex-direction:column;
    }

    .score{
        font-size:50px;
    }

    .lineups{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div id="app" class="loading">
        Načítavam zápas...
    </div>

</div>

<a href="index.html" class="back-btn">← Matches</a>

<script>

const params =
    new URLSearchParams(window.location.search);

const matchId =
    params.get("id");

fetch("data.json")
.then(response => response.json())
.then(data => {

    const match =
        data.find(
            row => String(row.ID) === String(matchId)
        );

    if(!match){

        document.getElementById("app").innerHTML =
            "<div class='card'>Zápas nebol nájdený.</div>";

        return;

    }

    renderMatch(match);

});

function getPlayers(match,prefix=""){

    let html = "";

    for(let i=1;i<=11;i++){

        const player =
            match[`${prefix}Player name ${i}`];

        const number =
            match[`${prefix}Player number ${i}`];

        if(player){

            html += `
            <div class="player">
                <div class="number">${number||""}</div>
                ${player}
            </div>`;
        }
    }

    return html;

}

function getBench(match,prefix=""){

    let html = "";

    for(let i=1;i<=12;i++){

        const player =
            match[`${prefix}On the bench name ${i}`];

        const number =
            match[`${prefix}On the bench number ${i}`];

        if(player){

            html += `
            <div class="player">
                <div class="number">${number||""}</div>
                ${player}
            </div>`;
        }
    }

    return html;

}

function renderMatch(match){

    document.getElementById("app").innerHTML = `

    <div class="hero">

        <div class="teams">

            <div class="team">
                <div class="team-name">
                    FC Barcelona
                </div>
            </div>

            <div class="team">

                <div class="score">
                    ${match["Result"] || "-:-"}
                </div>

            </div>

            <div class="team">
                <div class="team-name">
                    ${match["Opp. Team"] || ""}
                </div>
            </div>

        </div>

        <div class="match-meta">

            ${match["Competition"] || ""}
            • Matchday ${match["Matchday"] || ""}

            <br>

            ${match["Date"] || ""}

        </div>

    </div>

    <div class="card">

        <h2 class="section-title">
            Match Information
        </h2>

        <div class="meta-grid">

            <div class="meta">
                <div class="meta-label">Venue</div>
                <div class="meta-value">
                    ${match["Venue"] || "-"}
                </div>
            </div>

            <div class="meta">
                <div class="meta-label">Referee</div>
                <div class="meta-value">
                    ${match["Referee"] || "-"}
                </div>
            </div>

            <div class="meta">
                <div class="meta-label">
                    Barcelona Manager
                </div>
                <div class="meta-value">
                    ${match["Manager"] || "-"}
                </div>
            </div>

            <div class="meta">
                <div class="meta-label">
                    Opponent Manager
                </div>
                <div class="meta-value">
                    ${match["Opp. Manager"] || "-"}
                </div>
            </div>

        </div>

    </div>

    <div class="card">

        <h2 class="section-title">
            Starting XI
        </h2>

        <div class="lineups">

            <div class="team-card">
                <h3>FC Barcelona</h3>
                ${getPlayers(match)}
            </div>

            <div class="team-card">
                <h3>${match["Opp. Team"] || ""}</h3>
                ${getPlayers(match,"Opp. ")}
            </div>

        </div>

    </div>

    <div class="card">

        <h2 class="section-title">
            Bench
        </h2>

        <div class="lineups">

            <div class="team-card">
                ${getBench(match)}
            </div>

            <div class="team-card">
                ${getBench(match,"Opp. ")}
            </div>

        </div>

    </div>

    <div class="card">

        <h2 class="section-title">
            Match Timeline
        </h2>

        <div class="timeline">
            Timeline bude doplnená z Goal min,
            Yellow min, Red min,
            Sub min, Penalty min a
            Penalty Shoot-out scored.
        </div>

    </div>

    `;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

    <link rel="icon.png
    <linkicon-16x16.png
    <linkle-touch-icon.png
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

<style>

:root{
    --barca-blue:#004D98;
    --barca-red:#A50044;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f9;
    color:#1f2937;
    font-family:'Roboto',sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.hero{
    background:linear-gradient(
        135deg,
        var(--barca-blue),
        var(--barca-red)
    );
    color:white;
    border-radius:24px;
    padding:10px;
    margin-bottom:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.score{
    font-size:30px;
    font-weight:700;
    margin:10px 0;
    text-align:center;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.teams .team-name:first-of-type{
    text-align:left;
}

.teams .team-name:last-of-type{
    text-align:right;
}

.team-name{
    font-size:18px;
    font-weight:700;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.section-title{
    margin:0 0 4px 0;
    font-size: 16px;
    padding: 0;
}

.meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.meta{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

.meta-label{
    font-size:11px;
    text-transform:uppercase;
    color:#6b7280;
}

.meta-value{
    margin-top:4px;
    font-weight:700;
    font-size:13px;
}

.lineups{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.team-card{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

.team-card h3{
    font-size:15px;
    margin-bottom:10px;
}

.team-card h4{
    font-size:13px;
    margin:10px 0 6px;
}

.team-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.team-header.home{
    justify-content:flex-start;
}

.team-header.away{
    justify-content:flex-end;
}
    
.player{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 0;
    font-size:13px;
}

.player-name{
    flex:1;
}

.sub-off{
    color:#dc2626;
    font-weight:700;
}

.number{
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--barca-blue);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:700;
}

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:24px;
    width:3px;
    background:#e5e7eb;
}

.timeline-item{
    display:flex;
    gap:15px;
    margin-bottom:18px;
}

.timeline-minute{
    width:48px;
    text-align:center;
    font-weight:700;
}

.timeline-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

.timeline-content{
    flex:1;
    background:#f8fafc;
    padding:12px;
    border-radius:12px;
}

.timeline-section{
    margin-bottom:30px;
}

.timeline-section .event-row:last-child{
    margin-bottom:0;
}

.timeline-section h3{
    font-size:16px;
    margin-bottom:15px;
    color:#004D98;
}

.event-row{
    display:grid;
    grid-template-columns:1fr 50px 1fr;
    gap: 2px;
    align-items:center;
    margin-bottom: 2px;
}

.event-box{
    background:#f8fafc;
    padding:6px 10px;
    border-radius:10px;
    display:inline-block;
    font-size:13px;
    line-height:1.1;
}

.event-minute{
    text-align:center;
    font-weight:700;
    font-size:15px;
}

.event-home{
    text-align:right;
}

.event-away{
    text-align:left;
}

.event-home .event-icon{
    float:right;
    margin-left:4px;
    margin-right:0;
}

.event-away .event-icon{
    margin-right:4px;
}

.event-box::after{
    content:"";
    display:block;
    clear:both;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--barca-blue);
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:999px;
}

.lineup-tabs{
    display:none;
}


@media(max-width:900px){

    .lineup-tabs{
        display:flex;
        margin-bottom:15px;
        gap:8px;
    }

    .lineup-tab{
        flex:1;
        border:none;
        background:#e5e7eb;
        padding:10px;
        border-radius:10px;
        font-weight:600;
        cursor:pointer;
    }

    .lineup-tab.active{
        background:#004D98;
        color:white;
    }

    .mobile-hidden{
        display:none;
    }

.teams{
    grid-template-columns:1fr;
    gap:15px;
}

    .team-name{
    text-align:center !important;
}

    .lineups{
        display:block;
    }

    #lineup-barca,
    #lineup-opp{
    margin-bottom:15px;
}

    .score{
        font-size:30px;
    }

}

</style>
</head>

<body>

<div class="container">

<div id="app">
Loading...
</div>

</div>

<a href="index.html" class="back-btn">
← Matches
</a>

<script>

const params = new URLSearchParams(location.search);
const matchId = params.get("id");

fetch("data.json")
    .then(r => {

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        return r.json();
    })
    .then(data => {

        const match =
            data.find(
                row =>
                    String(row.ID).trim() ===
                    String(matchId).trim()
            );

if (!match) {

    document.getElementById("app").innerHTML =
        "<div class='card'>Match not found</div>";

    return;
}

renderMatch(match);

    })

.catch(error => {

    console.error(error);

    document.getElementById("app").innerHTML = `
        <div class="card">
            Error:<br>
            ${error.message}
        </div>
    `;

});
    
function escapeHtml(str) {

    if (str === null || str === undefined) {
        return "";
    }

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getPlayers(match,prefix=""){

    const captain = match[`${prefix}Captain`] || "";

    const subbedOff = [];

    for(let i=1;i<=6;i++){

        const player = match[`${prefix}Sub off ${i}`];

        if(player){
            subbedOff.push(String(player).trim());
    }
}

    let html="";

    for(let i=1;i<=11;i++){

        const player =
            match[`${prefix}Player name ${i}`];

        const number =
            match[`${prefix}Player number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${escapeHtml(number || "")}
                </div>

                <span class="player-name">
    ${escapeHtml(player)}
    ${
        String(player).trim() === String(captain).trim()
            ? ' <strong>(C)</strong>'
            : ''
    }
    ${
        subbedOff.includes(String(player).trim())
            ? ' <strong style="color:#dc2626;">⬇</strong>'
            : ''
    }
</span>
            </div>
            `;
        }
    }

    return html;
}

function getBench(match,prefix=""){

    const subbedOn = [];

for(let i=1;i<=6;i++){

    const player = match[`${prefix}Sub on ${i}`];

    if(player){
        subbedOn.push(String(player).trim());
    }
}

    let html="";

    for(let i=1;i<=12;i++){

        const player =
            match[`${prefix}On the bench name ${i}`];

        const number =
            match[`${prefix}On the bench number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${number || ""}
                </div>

                ${escapeHtml(player)}
${
    subbedOn.includes(String(player).trim())
        ? ' <strong style="color:#16a34a;">⬆</strong>'
        : ''
}
            </div>
            `;
        }
    }

    return html;
}

function getTimeline(match){

    const goals = [];
    const substitutions = [];
    const cards = [];

    const homeMatch =
        String(match["Home/Away"] || "").trim() === "Home";

    function sortByMinute(arr){

        arr.sort((a,b) => {

            const ma =
                parseInt(String(a.minute).match(/\d+/)?.[0] || 0);

            const mb =
                parseInt(String(b.minute).match(/\d+/)?.[0] || 0);

            return ma - mb;

        });

    }

    // GOALS

    for(let i=1;i<=12;i++){

        if(match[`Goal Player ${i}`]){

            goals.push({
                minute: match[`Goal min ${i}`],
                side: homeMatch ? "left" : "right",
                player: match[`Goal Player ${i}`],
                assist: match[`Assist Player ${i}`] || "",
                penalty:
                    match[`Penalty player ${i}`] &&
                    String(match[`Penalty scored ${i}`] || "")
                        .trim()
                        .toLowerCase() !== "not in"
            });

        }

        if(match[`Opp. Goal Player ${i}`]){

            goals.push({
                minute: match[`Opp. Goal min ${i}`],
                side: homeMatch ? "right" : "left",
                player: match[`Opp. Goal Player ${i}`],
                assist: match[`Opp. Assist player ${i}`] || "",
                penalty:
                    match[`Opp. Penalty player ${i}`] &&
                    String(match[`Opp. Penalty scored ${i}`] || "")
                        .trim()
                        .toLowerCase() !== "not in"
            });

        }

    }

    // MISSED PENALTIES

for(let i=1;i<=12;i++){

    if(
        match[`Penalty player ${i}`] &&
        String(match[`Penalty scored ${i}`] || "")
            .trim()
            .toLowerCase() === "not in"
    ){

        goals.push({
            minute: match[`Penalty min ${i}`],
            side: homeMatch ? "left" : "right",
            player: match[`Penalty player ${i}`],
            missedPenalty: true
        });

    }

    if(
        match[`Opp. Penalty player ${i}`] &&
        String(match[`Opp. Penalty scored ${i}`] || "")
            .trim()
            .toLowerCase() === "not in"
    ){

        goals.push({
            minute: match[`Opp. Penalty min ${i}`],
            side: homeMatch ? "right" : "left",
            player: match[`Opp. Penalty player ${i}`],
            missedPenalty: true
        });

    }

}
    // SUBSTITUTIONS

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]){

            substitutions.push({
                minute: match[`Sub min ${i}`],
                side: homeMatch ? "left" : "right",
                on: match[`Sub on ${i}`],
                off: match[`Sub off ${i}`]
            });

        }

        if(match[`Opp. Sub on ${i}`]){

            substitutions.push({
                minute: match[`Opp. Sub min ${i}`],
                side: homeMatch ? "right" : "left",
                on: match[`Opp. Sub on ${i}`],
                off: match[`Opp. Sub off ${i}`]
            });

        }

    }

    // YELLOW CARDS

    for(let i=1;i<=12;i++){

        if(match[`Yellow player ${i}`]){

            cards.push({
                minute: match[`Yellow min ${i}`],
                side: homeMatch ? "left" : "right",
                icon: "🟨",
                player: match[`Yellow player ${i}`]
            });

        }

        if(match[`Opp. Yellow player ${i}`]){

            cards.push({
                minute: match[`Opp. Yellow min ${i}`],
                side: homeMatch ? "right" : "left",
                icon: "🟨",
                player: match[`Opp. Yellow player ${i}`]
            });

        }

    }

    // RED CARDS

    for(let i=1;i<=5;i++){

        if(match[`Red player ${i}`]){

            cards.push({
                minute: match[`Red min ${i}`],
                side: homeMatch ? "left" : "right",
                icon: "🟥",
                player: match[`Red player ${i}`]
            });

        }

        if(match[`Opp. Red player ${i}`]){

            cards.push({
                minute: match[`Opp. Red min ${i}`],
                side: homeMatch ? "right" : "left",
                icon: "🟥",
                player: match[`Opp. Red player ${i}`]
            });

        }

    }

    sortByMinute(goals);
    sortByMinute(substitutions);
    sortByMinute(cards);

    function eventRow(side, minute, content){

        return `
            <div class="event-row">

                ${
                    side === "left"
                    ? `
                        <div class="event-home">
                            <div class="event-box">
                                ${content}
                            </div>
                        </div>
                    `
                    : `<div></div>`
                }

                <div class="event-minute">
                    ${escapeHtml(minute)}'
                </div>

                ${
                    side === "right"
                    ? `
                        <div class="event-away">
                            <div class="event-box">
                                ${content}
                            </div>
                        </div>
                    `
                    : `<div></div>`
                }

            </div>
        `;
    }

    let goalsHtml = "";
    let substitutionsHtml = "";
    let cardsHtml = "";

    // GOALS

    if(goals.length){

        goalsHtml += `
            <div class="card">
                <h2 class="section-title">
                    Goals
                </h2>
        `;

        goals.forEach(goal => {

           let content = "";

if(goal.missedPenalty){

    content = `
        <span class="event-icon">❌</span>
        <strong>${escapeHtml(goal.player)}</strong>
        <span style="font-weight:normal;">
            (missed penalty)
        </span>
    `;

}else{

    content = `
        <span class="event-icon">⚽</span>
        <strong>${escapeHtml(goal.player)}</strong>
        ${
            goal.penalty
                ? ' <span style="font-weight:normal;">(penalty)</span>'
                : ''
        }
    `;

}

            if(goal.assist){

                content += `
                    <br>
                    <small>
                        Assist: ${escapeHtml(goal.assist)}
                    </small>
                `;

            }

            goalsHtml += eventRow(
                goal.side,
                goal.minute,
                content
            );

        });

        goalsHtml += `
            </div>
        `;

    }

    // SUBSTITUTIONS

    if(substitutions.length){

        substitutionsHtml += `
            <div class="card">
                <h2 class="section-title">
                    Substitutions
                </h2>
        `;

        substitutions.forEach(sub => {

            substitutionsHtml += eventRow(
                sub.side,
                sub.minute,
                `
                <span class="event-icon">🔄</span>
                <strong>${escapeHtml(sub.on)}</strong>
                <br>
                <small>
                    for ${escapeHtml(sub.off || "")}
                </small>
                `
            );

        });

        substitutionsHtml += `
            </div>
        `;

    }

    // CARDS

    if(cards.length){

        cardsHtml += `
            <div class="card">
                <h2 class="section-title">
                   Cards
                </h2>
        `;

        cards.forEach(card => {

            cardsHtml += eventRow(
                card.side,
                card.minute,
                `
                <span class="event-icon">
                    ${card.icon}
                </span>
                ${escapeHtml(card.player)}
                `
            );

        });

        cardsHtml += `
            </div>
        `;

    }

    return {
        goalsHtml,
        substitutionsHtml,
        cardsHtml
    };
}

function hasStartingXI(match,prefix=""){

    for(let i=1;i<=11;i++){

        if(match[`${prefix}Player name ${i}`]){
            return true;
        }

    }

    return false;

}

function hasBench(match,prefix=""){

    for(let i=1;i<=12;i++){

        if(match[`${prefix}On the bench name ${i}`]){
            return true;
        }

    }

    return false;

}

function showLineup(team){

    const barca =
        document.getElementById("lineup-barca");

    const opp =
        document.getElementById("lineup-opp");

    const tabs =
        document.querySelectorAll(".lineup-tab");

    tabs.forEach(tab =>
        tab.classList.remove("active")
    );

    if(team === "barca"){

        barca.classList.remove("mobile-hidden");
        opp.classList.add("mobile-hidden");

        tabs[0].classList.add("active");

    }else{

        opp.classList.remove("mobile-hidden");
        barca.classList.add("mobile-hidden");

        tabs[1].classList.add("active");

    }

}

function isHomeMatch(match){
    return String(match["Home/Away"] || "").trim() === "Home";
}
    
function renderMatch(match){

const homeMatch = isHomeMatch(match);

const teamA = homeMatch
    ? "FC Barcelona"
    : (match["Opp. Team"] || "");

const teamB = homeMatch
    ? (match["Opp. Team"] || "")
    : "FC Barcelona";

const barcaTitle = homeMatch
    ? "FC Barcelona"
    : (match["Opp. Team"] || "");

const oppTitle = homeMatch
    ? (match["Opp. Team"] || "")
    : "FC Barcelona";

const barcaPlayers = homeMatch
    ? getPlayers(match)
    : getPlayers(match,"Opp. ");

const oppPlayers = homeMatch
    ? getPlayers(match,"Opp. ")
    : getPlayers(match);

const barcaBench = homeMatch
    ? getBench(match)
    : getBench(match,"Opp. ");

const oppBench = homeMatch
    ? getBench(match,"Opp. ")
    : getBench(match);

const timeline = getTimeline(match);

document.getElementById("app").innerHTML = `

<div class="hero">

    <div style="text-transform:uppercase;">
        ${escapeHtml(match["Date"] || "")}
        |
        ${escapeHtml(match["Competition"] || "")}
        |
        ${
            String(match["Competition"] || "")
                .trim()
                .toLowerCase() === "la liga"
                ? `${match["Matchday"] || ""}. Matchday`
                : `Matchday ${match["Matchday"] || ""}`
        }
    </div>

</div>

<div class="card">

<h2 class="section-title">
Match Information
</h2>

<div class="teams">

    <div class="team-header home">
        <div class="team-name">
            ${escapeHtml(teamA)}
        </div>
    </div>

    <div class="score">
        ${escapeHtml(match["Result"] || "-:-")}
    </div>

    <div class="team-header away">
        <div class="team-name">
            ${escapeHtml(teamB)}
        </div>
    </div>

</div>

<div class="meta-grid">

<div class="meta">
<div class="meta-label">Date</div>
<div class="meta-value">
${escapeHtml(match["Date"] || "")}
</div>
</div>

<div class="meta">
<div class="meta-label">Competition</div>
<div class="meta-value">
${escapeHtml(match["Competition"] || "")}
</div>
</div>

<div class="meta">
<div class="meta-label">Matchday</div>
<div class="meta-value">
${escapeHtml(match["Matchday"] || "")}
</div>
</div>

<div class="meta">
<div class="meta-label">Venue</div>
<div class="meta-value">
${escapeHtml(match["Venue"] || "-")}
</div>
</div>

<div class="meta">
<div class="meta-label">Referee</div>
<div class="meta-value">
${escapeHtml(match["Referee"] || "-")}
</div>
</div>

</div>

</div>

${timeline.goalsHtml}

${
    hasStartingXI(match) ||
    hasStartingXI(match,"Opp. ") ||
    hasBench(match) ||
    hasBench(match,"Opp. ")
    ? `
    <div class="card">

        <h2 class="section-title">
            Squads
        </h2>

<div class="lineup-tabs">

    <button
        class="lineup-tab active"
        onclick="showLineup('barca')">

        ${escapeHtml(barcaTitle)}

    </button>

    <button
        class="lineup-tab"
        onclick="showLineup('opp')">

        ${escapeHtml(oppTitle)}

    </button>

</div>

<div class="lineups">

    <div
        id="lineup-barca"
        class="team-card">

        <h3>${escapeHtml(barcaTitle)}</h3>

${barcaPlayers}

<h4>Bench</h4>
${barcaBench}

<h4>Manager</h4>

<div class="player">
    ${escapeHtml(
        homeMatch
            ? (match["Manager"] || "-")
            : (match["Opp. Manager"] || "-")
    )}
</div>

    </div>

    <div
        id="lineup-opp"
        class="team-card">

<h3>${escapeHtml(oppTitle)}</h3>

${oppPlayers}

<h4>Bench</h4>
${oppBench}

<h4>Manager</h4>

<div class="player">
    ${escapeHtml(
        homeMatch
            ? (match["Opp. Manager"] || "-")
            : (match["Manager"] || "-")
    )}
</div>

    </div>

</div>

</div>

`
: ""
}

${timeline.substitutionsHtml}
${timeline.cardsHtml}
`;

if(window.innerWidth <= 900){

    const opp =
        document.getElementById("lineup-opp");

    if(opp){
        opp.classList.add("mobile-hidden");
    }

}

}

window.addEventListener("resize", () => {

    const barca =
        document.getElementById("lineup-barca");

    const opp =
        document.getElementById("lineup-opp");

    if (!barca || !opp) {
        return;
    }

    if (window.innerWidth > 900) {

        barca.classList.remove("mobile-hidden");
        opp.classList.remove("mobile-hidden");

    } else {

        if (
            !barca.classList.contains("mobile-hidden") &&
            !opp.classList.contains("mobile-hidden")
        ) {
            opp.classList.add("mobile-hidden");
        }

    }

});
</script>

</body>
</html>

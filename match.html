<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

<style>

:root{
    --barca-blue:#004D98;
    --barca-red:#A50044;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f9;
    color:#1f2937;
    font-family:'Roboto',sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.hero{
    background:linear-gradient(
        135deg,
        var(--barca-blue),
        var(--barca-red)
    );
    color:white;
    border-radius:24px;
    padding:40px;
    margin-bottom:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.score{
    font-size:30px;
    font-weight:700;
    margin:10px 0;
    text-align:center;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.teams .team-name:first-of-type{
    text-align:left;
}

.teams .team-name:last-of-type{
    text-align:right;
}

.team-name{
    font-size:18px;
    font-weight:700;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.section-title{
    margin-top:0;
}

.meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.meta{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

.meta-label{
    font-size:11px;
    text-transform:uppercase;
    color:#6b7280;
}

.meta-value{
    margin-top:4px;
    font-weight:700;
}

.lineups{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.team-card{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

.player{
    display:flex;
    gap:10px;
    align-items:center;
    padding:6px 0;
}

.number{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--barca-blue);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
    font-weight:700;
}

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:24px;
    width:3px;
    background:#e5e7eb;
}

.timeline-item{
    display:flex;
    gap:15px;
    margin-bottom:18px;
}

.timeline-minute{
    width:48px;
    text-align:center;
    font-weight:700;
}

.timeline-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

.timeline-content{
    flex:1;
    background:#f8fafc;
    padding:12px;
    border-radius:12px;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--barca-blue);
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:999px;
}

.lineup-tabs{
    display:none;
}

@media(max-width:900px){

    .lineup-tabs{
        display:flex;
        margin-bottom:15px;
        gap:8px;
    }

    .lineup-tab{
        flex:1;
        border:none;
        background:#e5e7eb;
        padding:10px;
        border-radius:10px;
        font-weight:600;
        cursor:pointer;
    }

    .lineup-tab.active{
        background:#004D98;
        color:white;
    }

    .mobile-hidden{
        display:none;
    }

.teams{
    grid-template-columns:1fr;
    gap:15px;
}

    .team-name{
    text-align:center !important;
}

    .lineups{
        display:block;
    }

    #lineup-barca,
    #lineup-opp{
    margin-bottom:15px;
}

    .score{
        font-size:30px;
    }

}

</style>
</head>

<body>

<div class="container">

<div id="app">
Loading...
</div>

</div>

<a href="index.html" class="back-btn">
← Matches
</a>

<script>

const params = new URLSearchParams(location.search);
const matchId = params.get("id");

fetch("data.json")
    .then(r => {

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        return r.json();
    })
    .then(data => {

        const match =
            data.find(
                row =>
                    String(row.ID).trim() ===
                    String(matchId).trim()
            );

        if (!match) {

            document.getElementById("app").innerHTML =
                "<div class='card'>Match not found</div>";

            return;
        }

        renderMatch(match);

    })
.catch(error => {

    console.error(error);

    document.getElementById("app").innerHTML = `
        <div class="card">
            Error:<br>
            ${error.message}
        </div>
    `;

});

function escapeHtml(str) {

    if (str === null || str === undefined) {
        return "";
    }

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getPlayers(match,prefix=""){

    let html="";

    for(let i=1;i<=11;i++){

        const player =
            match[`${prefix}Player name ${i}`];

        const number =
            match[`${prefix}Player number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${escapeHtml(number || "")}
                </div>

                ${escapeHtml(player)}
            </div>
            `;
        }
    }

    return html;
}

function getBench(match,prefix=""){

    let html="";

    for(let i=1;i<=12;i++){

        const player =
            match[`${prefix}On the bench name ${i}`];

        const number =
            match[`${prefix}On the bench number ${i}`];

        if(player && String(player).trim()){

            html += `
            <div class="player">
                <div class="number">
                    ${number || ""}
                </div>

                ${player}
            </div>
            `;
        }
    }

    return html;
}

function getTimeline(match){

    const events = [];

    function addEvent(
        minute,
        icon,
        text,
        team
    ){

        if (
    minute === null ||
    minute === undefined ||
    String(minute).trim() === ""
){
    return;
}

        events.push({
            minute,
            icon,
            text,
            team
        });

    }
    for(let i=1;i<=12;i++){

        if(match[`Goal Player ${i}`]){

            addEvent(
                match[`Goal min ${i}`],
                "⚽",
                `${match[`Goal Player ${i}`]}`,
                "barca"
            );
        }

        if(match[`Opp. Goal Player ${i}`]){

            addEvent(
                match[`Opp. Goal min ${i}`],
                "⚽",
                `${match[`Opp. Goal Player ${i}`]}`,
                "opp"
            );
        }

        if(match[`Yellow player ${i}`]){

            addEvent(
                match[`Yellow min ${i}`],
                "🟨",
                match[`Yellow player ${i}`],
                "barca"
            );
        }

        if(match[`Opp. Yellow player ${i}`]){

            addEvent(
                match[`Opp. Yellow min ${i}`],
                "🟨",
                match[`Opp. Yellow player ${i}`],
                "opp"
            );
        }
    }

    for(let i=1;i<=5;i++){

        if(match[`Red player ${i}`]){

            addEvent(
                match[`Red min ${i}`],
                "🟥",
                match[`Red player ${i}`],
                "barca"
            );
        }

        if(match[`Opp. Red player ${i}`]){

            addEvent(
                match[`Opp. Red min ${i}`],
                "🟥",
                match[`Opp. Red player ${i}`],
                "opp"
            );
        }
    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]){

            addEvent(
                match[`Sub min ${i}`],
                "🔄",
                `${match[`Sub on ${i}`]} ⇢ ${match[`Sub off ${i}`]}`,
                "barca"
            );
        }

        if(match[`Opp. Sub on ${i}`]){

            addEvent(
                match[`Opp. Sub min ${i}`],
                "🔄",
                `${match[`Opp. Sub on ${i}`]} ⇢ ${match[`Opp. Sub off ${i}`]}`,
                "opp"
            );
        }
    }

    events.sort((a,b)=>{

        const ma =
            parseInt(String(a.minute).match(/\d+/)?.[0] || 0);

        const mb =
            parseInt(String(b.minute).match(/\d+/)?.[0] || 0);

        return ma - mb;

    });

    let html = "";

    events.forEach(event => {

        html += `
        <div class="timeline-item">

            <div class="timeline-minute">
                ${escapeHtml(event.minute)}'
            </div>

            <div class="timeline-icon">
                ${event.icon}
            </div>

            <div
                class="timeline-content"
                style="
                    border-left:4px solid ${
                        event.team === "barca"
                        ? "#004D98"
                        : "#A50044"
                    };
                "
            >
                ${escapeHtml(event.text)}
            </div>

        </div>
        `;
    });

    return html;
}

function hasStartingXI(match,prefix=""){

    for(let i=1;i<=11;i++){

        if(match[`${prefix}Player name ${i}`]){
            return true;
        }

    }

    return false;

}

function hasBench(match,prefix=""){

    for(let i=1;i<=12;i++){

        if(match[`${prefix}On the bench name ${i}`]){
            return true;
        }

    }

    return false;

}

function showLineup(team){

    const barca =
        document.getElementById("lineup-barca");

    const opp =
        document.getElementById("lineup-opp");

    const tabs =
        document.querySelectorAll(".lineup-tab");

    tabs.forEach(tab =>
        tab.classList.remove("active")
    );

    if(team === "barca"){

        barca.classList.remove("mobile-hidden");
        opp.classList.add("mobile-hidden");

        tabs[0].classList.add("active");

    }else{

        opp.classList.remove("mobile-hidden");
        barca.classList.add("mobile-hidden");

        tabs[1].classList.add("active");

    }

}
    
function renderMatch(match){

const timelineHtml = getTimeline(match);

document.getElementById("app").innerHTML = `

<div class="hero">

    <div class="teams">

        <div class="team-name">
            FC Barcelona
        </div>

        <div class="score">
            ${escapeHtml(match["Result"] || "-:-")}
        </div>

        <div class="team-name">
            ${escapeHtml(match["Opp. Team"] || "")}
        </div>

    </div>

    <div style="margin-top:15px;">
        ${escapeHtml(match["Competition"] || "")}
        • Matchday ${match["Matchday"] || ""}
        <br>
        ${escapeHtml(match["Date"] || "")}
    </div>

</div>

<div class="card">

<h2 class="section-title">
Match Information
</h2>

<div class="meta-grid">

<div class="meta">
<div class="meta-label">Venue</div>
<div class="meta-value">
${escapeHtml(match["Venue"] || "-")}
</div>
</div>

<div class="meta">
<div class="meta-label">Referee</div>
<div class="meta-value">
${escapeHtml(match["Referee"] || "-")}
</div>
</div>

<div class="meta">
<div class="meta-label">Manager</div>
<div class="meta-value">
${escapeHtml(match["Manager"] || "-")}
</div>
</div>

<div class="meta">
<div class="meta-label">Opponent Manager</div>
<div class="meta-value">
${escapeHtml(match["Opp. Manager"] || "-")}
</div>
</div>

</div>

</div>

${
    hasStartingXI(match) ||
    hasStartingXI(match,"Opp. ") ||
    hasBench(match) ||
    hasBench(match,"Opp. ")
    ? `
    <div class="card">

        <h2 class="section-title">
            Squads
        </h2>

<div class="lineup-tabs">

    <button
        class="lineup-tab active"
        onclick="showLineup('barca')">

        FC Barcelona

    </button>

    <button
        class="lineup-tab"
        onclick="showLineup('opp')">

        ${match["Opp. Team"] || ""}

    </button>

</div>

<div class="lineups">

    <div
        id="lineup-barca"
        class="team-card">

        <h3>FC Barcelona</h3>

<h4>Starting XI</h4>
${getPlayers(match)}

<h4>Bench</h4>
${getBench(match)}

    </div>

    <div
        id="lineup-opp"
        class="team-card">

<h3>${match["Opp. Team"] || ""}</h3>

<h4>Starting XI</h4>
${getPlayers(match,"Opp. ")}

<h4>Bench</h4>
${getBench(match,"Opp. ")}

    </div>

</div>

</div>

`
: ""
}

${
    timelineHtml
    ? `
    <div class="card">

        <h2 class="section-title">
            Match Timeline
        </h2>

        <div class="timeline">
            ${timelineHtml}
        </div>

    </div>
    `
    : ""
}
`;
``
if(window.innerWidth <= 900){

    const opp =
        document.getElementById("lineup-opp");

    if(opp){
        opp.classList.add("mobile-hidden");
    }

}

}

window.addEventListener("resize", () => {

    const barca =
        document.getElementById("lineup-barca");

    const opp =
        document.getElementById("lineup-opp");

    if (!barca || !opp) {
        return;
    }

    if (window.innerWidth > 900) {

        barca.classList.remove("mobile-hidden");
        opp.classList.remove("mobile-hidden");

    } else {

        if (
            !barca.classList.contains("mobile-hidden") &&
            !opp.classList.contains("mobile-hidden")
        ) {
            opp.classList.add("mobile-hidden");
        }

    }

});
</script>

</body>
</html>

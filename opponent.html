<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<title>Opponent Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/theme.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#004D98 0%,transparent 35%),
radial-gradient(circle at top right,#A50044 0%,transparent 35%),
var(--bg);

color:var(--text);
min-height:100vh;
}

.theme-toggle{
position:fixed;
bottom:20px;
left:20px;

width:52px;
height:52px;

border:none;
border-radius:50%;

cursor:pointer;

background:#A50044;
color:white;

font-size:20px;
font-weight:700;

z-index:9999;
display:none;
}

.container{
max-width:1500px;
margin:auto;
padding:10px;
}

.header{
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

padding:24px;
border-radius:28px;
color:white;
margin-bottom:10px;
}

.header h1{
margin:0;
font-size:22px;
font-weight:700;
}

.hero-subtitle{
margin-top:8px;
font-size:16px;
font-weight:500;
color:rgba(255,255,255,.85);
}

.manager-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:20px;
display:flex;
align-items:center;
gap:20px;
margin-bottom:10px;
}

.manager-photo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #004D98;
display:none;
}

.manager-info h1{
margin:0;
font-size:22px;
}

.manager-meta{
margin-top:12px;

display:flex;
flex-direction:column;
align-items:flex-start;

gap:6px;

font-size:14px;
color:var(--muted);
}

.manager-meta div{
white-space:normal;
display:block;
width:100%;
}

.manager-meta a{
font-weight:600;
text-decoration:none;
color:var(--link-color);
}

.manager-meta a:hover{
text-decoration:underline;
}

.widget-title{
margin:8px 0 6px;
padding:8px 14px;
background:linear-gradient(
135deg,
rgba(0,77,152,.95),
rgba(165,0,68,.95)
);

color:white;
font-size:14px;
font-weight:700;
border-radius:18px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:8px;
}

.summary-box{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:18px;
padding:12px;
text-align:center;
}

.summary-box b{
display:block;
font-size:26px;
margin-bottom:4px;
}

.widget-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:14px;
}

.stats-table{
width:100%;
border-collapse:collapse;
}

.stats-table th,
.stats-table td{
padding:8px;
border-bottom:1px solid var(--meta-border);
font-size:13px;
}

.stats-table th{
text-align:left;
}

.season-link{
cursor:pointer;
font-weight:700;
color:#004D98;
}

.season-link:hover{
text-decoration:underline;
}

.season-row{
transition:.2s;
}

.season-row:hover{
background:var(--meta-bg);
}

.opponent-season{
    background:#fff8c4;
    transition:.2s;
}

.opponent-season:hover{
    background:#fff2a3;
}

[data-theme="dark"] .opponent-season{
    background:#5b5420;
}

[data-theme="dark"] .opponent-season:hover{
    background:#746923;
}

.opponent-career .summary-box{
    background:#fff8c4;
    border:1px solid #eab308;
    color:#000;
}

.opponent-career .summary-box b{
    color:#92400e;
}

[data-theme="dark"] .opponent-career .summary-box{
    background:#5b5420;
    border:1px solid #eab308;
    color:#fff;
}

[data-theme="dark"] .opponent-career .summary-box b{
    color:#fde68a;
}

.stats-table th:first-child,
.stats-table td:first-child{
    text-align:left;
}

.stats-table th:not(:first-child),
.stats-table td:not(:first-child){
    text-align:center;
}

.manager-match:hover{
background:var(--card-bg);
}

.manager-match:last-child{
border-bottom:none;
}

.bench-label{
font-size:11px;
font-weight:700;
color:#f59e0b;
margin-left:6px;
}

.result-badge{
display:inline-block;
min-width:60px;
text-align:center;
border-radius:999px;
padding:4px 10px;
font-weight:700;
}

.result-win{
background:var(--result-win-bg);
border:1px solid var(--result-win);
color:var(--result-win);
}

.result-draw{
background:var(--result-draw-bg);
border:1px solid var(--result-draw);
color:var(--result-draw);
}

.result-loss{
background:var(--result-loss-bg);
border:1px solid var(--result-loss);
color:var(--result-loss);
}

.competition-cell{
display:flex;
align-items:center;
gap:8px;
font-weight:600;
}

.competition-logo{
width:20px;
height:20px;
object-fit:contain;
flex-shrink:0;
}

.manager-club{
    margin-top:6px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
}

.club-title{
    background:#dbeafe;
    color:#1e3a8a;
    border:1px solid #93c5fd;
}

[data-theme="dark"] .club-title{
    background:#1e3a5f;
    color:#dbeafe;
    border:1px solid #3b82f6;
}

.manager-clubs{
    margin-top:6px;
    font-size:14px;
    color:var(--muted);
    font-weight:600;
}

.season-block{
    margin-bottom:8px;
}

.season-header{
    padding:10px 14px;
    background:var(--meta-bg);
    border:1px solid var(--meta-border);
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

.season-header:hover{
    background:var(--card-bg);
}

.season-matches{
    margin-top:6px;
}

.matches-list{
    display:block;
    padding:8px;
    background:var(--meta-bg);
    border-radius:12px;
    max-width:1000px;
    margin:8px 0 0 0;
}

.matches-header{
    display:grid;
    grid-template-columns:
        35px
        90px
        70px
        1fr
        90px
        45px
        45px;

    gap:6px;

    font-size:12px;
    font-weight:700;
    text-transform:uppercase;

    padding:8px;
    margin-bottom:6px;

    opacity:.7;
}

.manager-match{
    display:grid;
    grid-template-columns:
        35px
        100px
        70px
        1fr
        90px
        45px
        45px;

    gap:6px;
    align-items:center;
    padding:8px;
    border-bottom:1px solid var(--meta-border);
    transition:.2s;
}

.manager-match:hover{
    background:var(--card-bg);
}

.manager-match:last-child{
    border-bottom:none;
}

.back-btn{
    position:fixed;
    right:20px;
    bottom:20px;

    background:
        linear-gradient(
            135deg,
            #004D98,
            #A50044
        );

    color:white;
    text-decoration:none;

    padding:14px 22px;

    border-radius:999px;

    font-weight:700;
    font-size:13px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);

    z-index:9999;
}

.main-menu{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:6px;

    margin-bottom:12px;
    padding-left:0;
}

.main-menu a{
    display:flex;
    align-items:center;
    justify-content:center;

    min-width:120px;
    padding:12px 20px;

    border-radius:14px;

    text-decoration:none;

    background:#004D98;
    border-color:#0a5fb3;

    color:white;

    font-size:14px;
    font-weight:700;

    transition:.2s;

    box-shadow:
        0 4px 12px rgba(0,77,152,.25);
}

.main-menu a:hover{
    transform:translateY(-2px);

    background:#0a5fb3;

    box-shadow:
        0 8px 20px rgba(0,77,152,.35);
}

.main-menu a.active{
    background:#A50044;
    border-color:#8b0038;
    color:white;
}

.main-menu a img{
    display:none;
}

.player-search-results{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.search-type{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
}

.search-type.player{
    background:rgba(0,77,152,.15);
    color:#3b82f6;
}

.search-type.manager{
    background:rgba(165,0,68,.15);
    color:#e11d48;
}

.player-search-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    border-radius:10px;
    text-decoration:none;
    color:var(--text);
    font-size:13px;
    font-weight:600;
}

.player-search-item:hover{
    background:var(--meta-bg);
}

.search-hero{
    margin:12px 0 0 0;
    display:none;
}

.search-hero.show{
    display:block;
}

.player-search-input{
    width:100%;
    height:58px;
    padding:0 20px;

    font-size:16px;
    color:var(--text);

    border-radius:20px;
    border:2px solid var(--card-border);

    background:var(--card-bg);

    box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    transition:.2s;

    margin-bottom:6px;
}

.search-hero .player-search-input:focus{
    outline:none;
    border-color:#3b82f6;

    box-shadow:
        0 0 0 4px rgba(59,130,246,.15);
}

@media(max-width:750px){

    .main-menu{
        position:fixed;

        left:12px;
        right:12px;
        bottom:10px;

        z-index:9999;

        display:flex;
        justify-content:space-around;
        align-items:center;

        margin:0;
        padding:4px 6px;

        border-radius:22px;

        background:rgba(255,255,255,.14);

        backdrop-filter:blur(25px);
        -webkit-backdrop-filter:blur(25px);

        border:1px solid rgba(255,255,255,.18);

        box-shadow:
            0 8px 24px rgba(0,0,0,.16),
            inset 0 1px 0 rgba(255,255,255,.25);
    }

    .main-menu a{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
    
        gap:3px;
    
        min-width:58px;
    
        padding:6px 8px;
    
        border-radius:18px;
    
        background:#0A5FB3;
    
        backdrop-filter:blur(15px);
    }

    .main-menu a:hover{
        background:#004D98;
    
        backdrop-filter:blur(15px);
        -webkit-backdrop-filter:blur(15px);
    }
    
    .main-menu a.active{
        background:#A50044;
        color:white;
    
        box-shadow:
            0 4px 12px rgba(0,77,152,.35);
    
        backdrop-filter:blur(15px);
        -webkit-backdrop-filter:blur(15px);
    }

    .main-menu a img{
        display:block;
        width:28px;
        height:28px;
        object-fit:contain;
    }

    .main-menu a span{
        font-size:9px;
        font-weight:600;
        line-height:1;
    }

    body{
        padding-bottom:65px;
    }

.back-btn{
    right:10px;
    bottom:10px;

    padding:10px 14px;

    font-size:12px;
    font-weight:600;
}
   
.matches-header div:nth-child(3),
.manager-match div:nth-child(3){
    display:none;
}

.manager-match, 
.matches-header{
    grid-template-columns:
        30px
        90px
        1fr
        90px
        35px
        35px;

    row-gap:8px;
}

.competition-logo{
width:18px;
height:18px;
}

.manager-card{
    flex-direction:column;
    align-items:flex-start;
}

.manager-info{
    width:100%;
}

.manager-info h1{
    text-align:left;
}

.summary-grid{
grid-template-columns:repeat(4,1fr);
}

.summary-box{
font-size:11px;
}

}

</style>
</head>

<div class="container">

<div class="header">
<h1>Barça - Historical Database</h1>

Opponent Profile
</div>
</div>

<nav class="main-menu">

</nav>

<div class="search-hero">

</div>

<script>

const params =
new URLSearchParams(location.search);

const opponentName =
params.get("team");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronacion": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de Espana": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

let allMatches = [];
let allPlayers = [];

Promise.all([
    fetch("data.json").then(r=>r.json()),
    fetch("managers.json").then(r=>r.json())
])
.then(([data, managers])=>{

    allMatches = data;

    renderOpponent(opponentName, data);

    initPersonSearch();

});

function statValue(value){
    return value === 0 ? "-" : value;
}

function renderOpponent(team,data){

    const matches = data.filter(
        match => match["Opp. Team"] === team
    );

    if(!matches.length){

        document.getElementById("managerProfile").innerHTML =
            "<h2>Opponent not found</h2>";

        return;
    }

    matches.sort((a,b)=>{

        const da =
            new Date(a.Date.split(".").reverse().join("-"));

        const db =
            new Date(b.Date.split(".").reverse().join("-"));

        return da - db;

    });

    const firstMatch = matches[0];
    const lastMatch = matches[matches.length - 1];

    let wins = 0;
    let draws = 0;
    let losses = 0;

    matches.forEach(match=>{

        if(match["Result type"] === "W") wins++;
        if(match["Result type"] === "D") draws++;
        if(match["Result type"] === "L") losses++;

    });

    const winPct =
        ((wins / matches.length) * 100).toFixed(1);

    document.getElementById("managerProfile").innerHTML = `

    <div class="manager-card">

        <div class="manager-info">

            <h1>${team}</h1>

            <div class="manager-meta">

                <div>
                    <b>Matches:</b>
                    ${matches.length}
                </div>

                <div>
                    <b>First Match:</b>

                    match.html?id=${firstMatch.ID}
                        ${firstMatch.Date}
                    </a>
                </div>

                <div>
                    <b>Last Match:</b>

                    <a href="match.html?id=${lastMatch.ID}">
                        ${lastMatch.Date}
                    </a>
                </div>

            </div>

        </div>

    </div>

    <div class="widget-title">
        Statistics
    </div>

    <div class="summary-grid">

        <div class="summary-box">
            <b>${matches.length}</b>
            Matches
        </div>

        <div class="summary-box">
            <b>${statValue(wins)}</b>
            Wins
        </div>

        <div class="summary-box">
            <b>${statValue(draws)}</b>
            Draws
        </div>

        <div class="summary-box">
            <b>${statValue(losses)}</b>
            Losses
        </div>

        <div class="summary-box">
            <b>${winPct}%</b>
            Win %
        </div>

    </div>

    <div class="widget-title">
        Season Breakdown
    </div>

    <div class="widget-card">

        <table class="stats-table">

            <thead>
                <tr>
                    <th>Season</th>
                    <th>Matches</th>
                    <th>Wins</th>
                    <th>Draws</th>
                    <th>Losses</th>
                    <th>Win %</th>
                </tr>
            </thead>

            <tbody id="seasonRows"></tbody>

        </table>

    </div>

    `;

    renderOpponentStats(team,data);

}

function renderOpponentStats(team,data){

    const stats = {};

    data.forEach(match=>{

        if(match["Opp. Team"] !== team) return;

        const season = match.Season;

        if(!stats[season]){
            stats[season] = {
                matches:0,
                wins:0,
                draws:0,
                losses:0
            };
        }

        stats[season].matches++;

        if(match["Result type"]==="W") stats[season].wins++;
        if(match["Result type"]==="D") stats[season].draws++;
        if(match["Result type"]==="L") stats[season].losses++;

    });

    let html="";

    Object.keys(stats)
    .sort()
    .reverse()
    .forEach(season=>{

        const s = stats[season];

        const winPct =
            ((s.wins/s.matches)*100).toFixed(1);

        html += `

        <tr
        class="season-row"
        onclick="toggleSeason('season-${season.replace(/\//g,'-')}')">

            <td><strong>${season}</strong></td>

            <td>${s.matches}</td>

            <td>${statValue(s.wins)}</td>
            <td>${statValue(s.draws)}</td>
            <td>${statValue(s.losses)}</td>

            <td>${winPct}%</td>

        </tr>

        <tr
        id="season-${season.replace(/\//g,'-')}"
        style="display:none">

            <td colspan="6">

                ${buildOpponentMatches(team,season,data)}

            </td>

        </tr>

        `;

    });

    document.getElementById("seasonRows").innerHTML =
    html;
}

function toggleSeason(id){

    const el = document.getElementById(id);

    if(!el) return;

    el.style.display =
        el.style.display === "none"
        ? "table-row"
        : "none";
}

function buildOpponentMatches(team, season, data){

        const matches = data.filter(match =>
        
            match["Opp. Team"] === team &&
            match.Season === season
        
        );

        let html = `
            <div class="matches-list">
        
            <div class="matches-header">
            
                <div></div>
                <div>Date</div>
                <div>Venue</div>
                <div>Opponent</div>
                <div>Result</div>            
            </div>
        `;

    matches.forEach(match => {
    
        let resultClass = "result-draw";
    
        let resultType;
    
        if(match.Manager === manager){
    
            resultType = match["Result type"];
    
        }else{
    
            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";
        }
    
        if(resultType === "W") resultClass = "result-win";
        if(resultType === "L") resultClass = "result-loss";
    
html += `

<a
    href="match.html?id=${match.ID}"
    style="
        text-decoration:none;
        color:inherit;
    ">

    <div class="manager-match">

        <div class="competition-cell">
            <img
            src="logos/${competitionLogos[match.Competition] || 'default.png'}"
            class="competition-logo"
            alt="${match.Competition}"
            title="${match.Competition}">
        </div>
        
        <div>
            ${match.Date}
        </div>
        
        <div>
            ${match["Home/Away"] || ""}
        </div>
        
        <div>
            ${match["Opp. Team"]}
        </div>
        
        <div>
            <span class="result-badge ${resultClass}">
                ${match.Result}
            </span>
        </div>

    </div>

</a>

`;
    });
    
    html += `
        </div>
    `;

    return html;
}

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){
            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );
        }

        if(match["Opp. Manager"]){
            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );
        }

        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){
                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );
            }

            if(match[`Opp. Player name ${i}`]){
                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );
            }

        }

        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){
                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );
            }

            if(match[`Opp. On the bench name ${i}`]){
                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );
            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    const input =
        document.getElementById("personSearch");

    const results =
        document.getElementById("personSearchResults");

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";
            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

            results.innerHTML = `
            <div class="player-search-results">
            ${filtered.map(item => `
            <a
                class="player-search-item"
                href="${
                    item.type === 'Manager'
                    ? `manager.html?name=${encodeURIComponent(item.name)}`
                    : `player.html?name=${encodeURIComponent(item.name)}`
                }">
            ${item.name}
            <span class="search-type ${item.type.toLowerCase()}">
               ${item.type}
            </span>
            </a>
            `).join("")}
            </div>
            `;
    });

}

(function(){

const savedTheme =
localStorage.getItem("theme");

const systemTheme =
window.matchMedia("(prefers-color-scheme: dark)").matches
? "dark"
: "light";

const theme =
savedTheme || systemTheme;

document.documentElement.setAttribute(
"data-theme",
theme
);

const button =
document.getElementById("themeToggle");

if(button){

    button.textContent =
    theme === "dark"
    ? "☀️"
    : "🌙";

    button.addEventListener("click", () => {

        const current =
        document.documentElement.getAttribute("data-theme");

        const next =
        current === "dark"
        ? "light"
        : "dark";

        document.documentElement.setAttribute(
            "data-theme",
            next
        );

        localStorage.setItem(
            "theme",
            next
        );

        button.textContent =
        next === "dark"
        ? "☀️"
        : "🌙";

    });

}

})();

const searchToggle =
    document.getElementById("searchToggle");

if(searchToggle){

    searchToggle.addEventListener("click", e => {

        e.preventDefault();

        const searchBox =
            document.querySelector(".search-hero");

        const results =
            document.getElementById("personSearchResults");

        const input =
            document.getElementById("personSearch");

        searchBox.classList.toggle("show");

        if(searchBox.classList.contains("show")){

            input.focus();

        }else{

            input.value = "";
            results.innerHTML = "";

        }

    });

}

</script>

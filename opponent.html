<style>

.left-panel{
flex:1.1;
min-width:0;
}

.right-panel{
flex:.9;
min-width:0;
}

.opponent-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:20px;
display:flex;
align-items:center;
gap:20px;
margin-bottom:10px;
}

.opponent-photo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #004D98;
display:none;
}

.opponent-info h1{
margin:0;
font-size:22px;
}

.opponent-meta{
margin-top:12px;

display:flex;
flex-direction:column;
align-items:flex-start;

gap:6px;

font-size:14px;
color:var(--muted);
}

.opponent-meta div{
white-space:normal;
display:block;
width:100%;
}

.opponent-meta a{
font-weight:600;
text-decoration:none;
color:var(--link-color);
}

.opponent-meta a:hover{
text-decoration:underline;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.summary-box{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:18px;
padding:12px;
text-align:center;
}

.summary-box b{
display:block;
font-size:22px;
margin-bottom:4px;
}

.summary-box.wins{
    background:var(--result-win-bg);
    border:1px solid var(--result-win);
    color:var(--result-win);
}

.summary-box.draws{
    background:var(--result-draw-bg);
    border:1px solid var(--result-draw);
    color:var(--result-draw);
}

.summary-box.losses{
    background:var(--result-loss-bg);
    border:1px solid var(--result-loss);
    color:var(--result-loss);
}

.summary-box.matches,
.summary-box.goals{
    background:rgba(0,77,152,.10);
    border:1px solid rgba(0,77,152,.25);
    color:#004D98;
}

.summary-box.matches b,
.summary-box.goals b{
    color:#004D98;
}

@media (prefers-color-scheme: dark){
      
.opponent-match:hover{
    background:var(--card-bg);
}
      
.club-title{
    background:#1e3a5f;
    color:#dbeafe;
    border:1px solid #3b82f6;
}
      
.opponent-career .summary-box{
    background:#5b5420;
    border:1px solid #eab308;
    color:#fff;
}

.opponent-career .summary-box b{
    color:#fde68a;
}
      
.opponent-season{
    background:#5b5420;
}

.opponent-season:hover{
    background:#746923;
}

.summary-box.matches,
.summary-box.goals{
    background:rgba(0,77,152,.20);
    border:1px solid #004D98;
    color:#ffffff;
}

.summary-box.matches b,
.summary-box.goals b{
    color:#ffffff;
}}

.widget-card{
background:var(--card-bg);
border:1px solid var(--card-border);
border-radius:24px;
padding:14px;
}

.stats-table{
width:100%;
border-collapse:collapse;
}

.stats-table th,
.stats-table td{
padding:8px;
border-bottom:1px solid var(--meta-border);
font-size:13px;
}

.stats-table th{
text-align:left;
}

.season-link{
cursor:pointer;
font-weight:700;
color:#004D98;
}

.season-link:hover{
text-decoration:underline;
}

.season-row{
transition:.2s;
}

.season-row:hover{
background:var(--meta-bg);
}

.opponent-season{
    background:#fff8c4;
    transition:.2s;
}

.opponent-season:hover{
    background:#fff2a3;
}

.opponent-career .summary-box{
    background:#fff8c4;
    border:1px solid #eab308;
    color:#000;
}

.opponent-career .summary-box b{
    color:#92400e;
}

.stats-table th:first-child,
.stats-table td:first-child{
    text-align:left;
}

.stats-table th:not(:first-child),
.stats-table td:not(:first-child){
    text-align:center;
}

.opponent-match:hover{
    background:#e5e7eb;
}

.opponent-match:last-child{
border-bottom:none;
}

.bench-label{
font-size:11px;
font-weight:700;
color:#f59e0b;
margin-left:6px;
}

.result-badge{
display:inline-block;
min-width:60px;
text-align:center;
border-radius:999px;
padding:4px 10px;
font-weight:700;
}

.result-win{
background:var(--result-win-bg);
border:1px solid var(--result-win);
color:var(--result-win);
}

.result-draw{
background:var(--result-draw-bg);
border:1px solid var(--result-draw);
color:var(--result-draw);
}

.result-loss{
background:var(--result-loss-bg);
border:1px solid var(--result-loss);
color:var(--result-loss);
}

.competition-cell{
display:flex;
align-items:center;
gap:8px;
font-weight:inherit;
}

.competition-logo{
width:20px;
height:20px;
object-fit:contain;
flex-shrink:0;
}

.opponent-club{
    margin-top:6px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
}

.club-title{
    background:#dbeafe;
    color:#1e3a8a;
    border:1px solid #93c5fd;
}

.opponent-clubs{
    margin-top:6px;
    font-size:14px;
    color:var(--muted);
    font-weight:600;
}

.season-block{
    margin-bottom:8px;
}

.season-header{
    padding:10px 14px;
    background:var(--meta-bg);
    border:1px solid var(--meta-border);
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

.season-header:hover{
    background:var(--card-bg);
}

.season-matches{
    margin-top:6px;
}

.matches-list{
    display:block;
    padding:8px;
    background:var(--meta-bg);
    border-radius:12px;
    max-width:1000px;
    margin:8px 0 0 0;
}

.matches-header{
    display:grid;
    grid-template-columns:
        80px
        1fr
        90px
        70px
        90px;

    gap:6px;

    font-size:12px;
    font-weight:700;
    text-transform:uppercase;

    padding:8px;
    margin-bottom:6px;

    opacity:.7;
}

.opponent-match{
    display:grid;
    grid-template-columns:
        80px
        1fr
        90px
        70px
        90px;

    gap:4px;
    align-items:center;
    padding:6px;
    border-bottom:1px solid var(--meta-border);
    transition:.2s;
	font-size:12px;
}

.opponent-match:last-child{
    border-bottom:none;
}

@media(max-width:820px){

	.left-panel,
	.right-panel{
		flex:none !important;
		width:100% !important;
		min-width:0;
		max-width:100%;
		margin:0;
		}

	.container{
		padding:6px;
		}

.matches-header div:nth-child(2){
    color:transparent;
}
   
.matches-header div:nth-child(4),
.opponent-match div:nth-child(4){
    display:none;
}

.matches-header div:last-child,
.opponent-match div:last-child{
    display:flex;
    justify-content:center;
    align-items:center;
}

.opponent-match, 
.matches-header{
    grid-template-columns:
        80px
        35px
        1fr
        90px;

    row-gap:4px;
}

.competition-logo{
width:18px;
height:18px;
}

.competition-cell span{
    display:none;
}

.opponent-card{
    flex-direction:column;
    align-items:flex-start;
}

.opponent-info{
    width:100%;
}

.opponent-info h1{
    text-align:left;
}

.summary-grid{
grid-template-columns:repeat(5,1fr);
}

.summary-box{
font-size:13px;
}

.summary-box b{
font-size:18px;
}

.summary-box.goals{
font-size:16px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="menu-overlay" id="menuOverlay"></div>

<div class="header">
    <div class="header-inner">
        <img src="logos/barcadb-logo.png" class="header-logo" alt="Barça DB">

        <div class="header-text">
            <h1>Barça Database</h1>
            <div class="hero-subtitle">
            Opponent profile
        </div>
    </div>

<div class="desktop-search">

    <input
        type="text"
        id="personSearch"
        placeholder="Search player, manager, opponent..."
        class="desktop-search-input">

    <div id="personSearchResults"></div>

</div>

    <button id="menuToggle" class="menu-toggle">
    	☰
    </button>

</div>
</div>

<nav class="main-menu">

    <div class="mobile-menu-search">

        <input
            type="text"
            id="mobilePersonSearch"
            placeholder="Search player, manager..."
            class="mobile-search-input">

        <div id="mobileSearchResults"></div>

    </div>

    <a href="index.html">
        <span>Home</span>
    </a>

    <a href="season.html">
        <span>Seasons</span>
    </a>

    <a href="compare.html">
        <span>Compare</span>
    </a>

    <a href="#">
        <span>Records</span>
    </a>

</nav>

<div id="opponentHeader"></div>

<div class="content-layout">

    <div class="left-panel">
        <div id="opponentProfile"></div>
    </div>

    <div class="right-panel">
		
	    <div class="widget-title">
	        Statistics
	    </div>

    </div>

</div>
</div>

<script>

const params =
new URLSearchParams(location.search);

const opponentName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronación": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de España": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

document.title = `${opponentName} | Barça Database`;

document.querySelector('meta[name="description"]')
?.setAttribute(
    "content",
    `FC Barcelona head-to-head statistics against ${opponentName}.`
);

const canonical = document.querySelector('link[rel="canonical"]');

if (canonical) {
    canonical.href = location.href;
}

let allMatches = [];

fetch("data.json")
.then(r => r.json())
.then(data => {

    allMatches = data;

    renderOpponent(opponentName, data);

    initPersonSearch();

})
.catch(error => {

    console.error(error);

});
    
function statValue(value){
    return value === 0 ? "-" : value;
}

function renderOpponent(team,data){

    const matches = data.filter(
        match => match["Opp. Team"] === team
    );

    if(!matches.length){

        document.getElementById("opponentProfile").innerHTML =
            "<h2>Opponent not found</h2>";

        return;
    }

    matches.sort((a,b)=>{

        const da =
            new Date(a.Date.split(".").reverse().join("-"));

        const db =
            new Date(b.Date.split(".").reverse().join("-"));

        return da - db;

    });

    let wins = 0;
    let draws = 0;
    let losses = 0;

    matches.forEach(match=>{

        if(match["Result type"] === "W") wins++;
        if(match["Result type"] === "D") draws++;
        if(match["Result type"] === "L") losses++;

    });

    let goalsFor = 0;
    let goalsAgainst = 0;
    
    matches.forEach(match => {
    
        const result = (match.Result || "").trim();
    
        if(result === "-:-") return;
    
        if(!result.includes(":")) return;
    
        const [homeGoals, awayGoals] =
            result.split(":").map(Number);
    
        if(
            isNaN(homeGoals) ||
            isNaN(awayGoals)
        ){
            return;
        }
    
        if(match["Home/Away"] === "Home"){
    
            goalsFor += homeGoals;
            goalsAgainst += awayGoals;
    
        }else{
    
            goalsFor += awayGoals;
            goalsAgainst += homeGoals;
    
        }
    
    });

    document.getElementById("opponentHeader").innerHTML = `

    <div class="opponent-card">
    
        <div class="opponent-info">
            <h1>${team}</h1>
        </div>
    
    </div>
    
    `;

    document.getElementById("opponentProfile").innerHTML = `

	<div class="widget-title">
	    Overview
	</div>
	
    <div class="summary-grid">

        <div class="summary-box matches">
            <b>${matches.length}</b>
            Matches
        </div>

    <div class="summary-box wins">
        <b>${statValue(wins)}</b>
        Wins
    </div>
    
    <div class="summary-box draws">
        <b>${statValue(draws)}</b>
        Draws
    </div>
    
    <div class="summary-box losses">
        <b>${statValue(losses)}</b>
        Losses
    </div>

    <div class="summary-box goals">
        <b>${goalsFor}:${goalsAgainst}</b>
        Score
    </div>

    </div>

    <div class="widget-title">
        Matches
    </div>
        
        <div class="widget-card">
            ${buildOpponentMatches(team, data)}
        </div>

    `;

}

function buildOpponentMatches(team, data){

        const matches = data.filter(match =>
        
            match["Opp. Team"] === team
        
        );

        let html = `
            <div class="matches-header">
            
                <div>Season</div>
                <div>Competition</div>
                <div>Date</div>
                <div>Venue</div>
                <div>Result</div>            
            </div>
        `;

    matches.forEach(match => {
    
        let resultClass = "result-draw";
    
        const resultType = match["Result type"];
    
        if(resultType === "W") resultClass = "result-win";
        if(resultType === "L") resultClass = "result-loss";
    
html += `

<a
    href="match.html?id=${match.ID}"
    style="
        text-decoration:none;
        color:inherit;
    ">

    <div class="opponent-match">

        <div>
            ${match.Season}
        </div>

        <div class="competition-cell">
            <img
            src="logos/${competitionLogos[match.Competition] || 'default.png'}"
            class="competition-logo"
            alt="${match.Competition}"
            title="${match.Competition}">
            <span>
            ${match.Competition}
            </span>
        </div>
        
        <div>
            ${match.Date}
        </div>
        
        <div>
            ${match["Home/Away"] || ""}
        </div>
        
        <div>
            <span class="result-badge ${resultClass}">
                ${match.Result}
            </span>
        </div>

    </div>

</a>

`;
    });
    
    html += `
    `;

    return html;
}

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}
attachSearch(
    "personSearch",
    "personSearchResults"
);

attachSearch(
    "mobilePersonSearch",
    "mobileSearchResults"
);

}

function showMobileSection(section, button){

if(window.innerWidth > 820) return;

document.querySelectorAll(
'.mobile-section-btn'
).forEach(btn =>
btn.classList.remove('active')
);

button.classList.add('active');

document.getElementById(
'mobileMatchesSection'
).style.display = 'none';

document.getElementById(
'laligaWidget'
).style.display = 'none';

document.getElementById(
'mobileDebutantsSection'
).style.display = 'none';

document.getElementById(
'mobileStatisticsSection'
).style.display = 'none';

if(section === 'matches'){
document.getElementById(
'mobileMatchesSection'
).style.display = 'block';
}

if(section === 'table'){

    document.getElementById(
        'laligaWidget'
    ).style.display = 'block';

    renderLaLigaTable();
}

if(section === 'debutants'){
document.getElementById(
'mobileDebutantsSection'
).style.display = 'block';
}

if(section === 'statistics'){
document.getElementById(
'mobileStatisticsSection'
).style.display = 'block';
}

}

document.addEventListener("DOMContentLoaded", () => {

    const menuToggle = document.getElementById("menuToggle");
    const menuOverlay = document.getElementById("menuOverlay");
    const mainMenu = document.querySelector(".main-menu");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){
        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");
        menuToggle.textContent = "☰";
    }

    function openMenu(){
        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");
        menuToggle.textContent = "✕";
    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener("click", closeMenu);

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

});

document.addEventListener("DOMContentLoaded", () => {

    if(window.innerWidth <= 820){

        document.getElementById("laligaWidget").style.display = "none";
        document.getElementById("mobileDebutantsSection").style.display = "none";
        document.getElementById("mobileStatisticsSection").style.display = "none";

        document.getElementById("mobileMatchesSection").style.display = "block";
    }

});

</script>
</body>

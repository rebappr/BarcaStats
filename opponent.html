<script>

const params =
new URLSearchParams(location.search);

const opponentName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronación": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de España": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

document.title = `${opponentName} | Barça Database`;

document.querySelector('meta[name="description"]')
?.setAttribute(
    "content",
    `FC Barcelona head-to-head statistics against ${opponentName}.`
);

const canonical = document.querySelector('link[rel="canonical"]');

if (canonical) {
    canonical.href = location.href;
}

let allMatches = [];

fetch("data.json")
.then(r => r.json())
.then(data => {

    allMatches = data;

    renderOpponent(opponentName, data);

    initPersonSearch();

})
.catch(error => {

    console.error(error);

});
    
function statValue(value){
    return value === 0 ? "-" : value;
}

function renderOpponent(team,data){

    const matches = data.filter(
        match => match["Opp. Team"] === team
    );

    if(!matches.length){

        document.getElementById("opponentProfile").innerHTML =
            "<h2>Opponent not found</h2>";

        return;
    }

    matches.sort((a,b)=>{

        const da =
            new Date(a.Date.split(".").reverse().join("-"));

        const db =
            new Date(b.Date.split(".").reverse().join("-"));

        return da - db;

    });

    let wins = 0;
    let draws = 0;
    let losses = 0;

    matches.forEach(match=>{

        if(match["Result type"] === "W") wins++;
        if(match["Result type"] === "D") draws++;
        if(match["Result type"] === "L") losses++;

    });

    let goalsFor = 0;
    let goalsAgainst = 0;
    
    matches.forEach(match => {
    
        const result = (match.Result || "").trim();
    
        if(result === "-:-") return;
    
        if(!result.includes(":")) return;
    
        const [homeGoals, awayGoals] =
            result.split(":").map(Number);
    
        if(
            isNaN(homeGoals) ||
            isNaN(awayGoals)
        ){
            return;
        }
    
        if(match["Home/Away"] === "Home"){
    
            goalsFor += homeGoals;
            goalsAgainst += awayGoals;
    
        }else{
    
            goalsFor += awayGoals;
            goalsAgainst += homeGoals;
    
        }
    
    });

    document.getElementById("opponentHeader").innerHTML = `

    <div class="opponent-card">
    
        <div class="opponent-info">
            <h1>${team}</h1>
        </div>
    
    </div>
    
    `;

    document.getElementById("opponentProfile").innerHTML = `

	<div class="widget-title">
	    Overview
	</div>
	
    <div class="summary-grid">

        <div class="summary-box matches">
            <b>${matches.length}</b>
            Matches
        </div>

    <div class="summary-box wins">
        <b>${statValue(wins)}</b>
        Wins
    </div>
    
    <div class="summary-box draws">
        <b>${statValue(draws)}</b>
        Draws
    </div>
    
    <div class="summary-box losses">
        <b>${statValue(losses)}</b>
        Losses
    </div>

    <div class="summary-box goals">
        <b>${goalsFor}:${goalsAgainst}</b>
        Score
    </div>

    </div>

    <div class="widget-title">
        Matches
    </div>
        
        <div class="widget-card">
            ${buildOpponentMatches(team, data)}
        </div>

    `;

}

function buildOpponentMatches(team, data){

        const matches = data.filter(match =>
        
            match["Opp. Team"] === team
        
        );

        let html = `
            <div class="matches-header">
            
                <div>Season</div>
                <div>Competition</div>
                <div>Date</div>
                <div>Venue</div>
                <div>Result</div>            
            </div>
        `;

    matches.forEach(match => {
    
        let resultClass = "result-draw";
    
        const resultType = match["Result type"];
    
        if(resultType === "W") resultClass = "result-win";
        if(resultType === "L") resultClass = "result-loss";
    
html += `

<a
    href="match.html?id=${match.ID}"
    style="
        text-decoration:none;
        color:inherit;
    ">

    <div class="opponent-match">

        <div>
            ${match.Season}
        </div>

        <div class="competition-cell">
            <img
            src="logos/${competitionLogos[match.Competition] || 'default.png'}"
            class="competition-logo"
            alt="${match.Competition}"
            title="${match.Competition}">
            <span>
            ${match.Competition}
            </span>
        </div>
        
        <div>
            ${match.Date}
        </div>
        
        <div>
            ${match["Home/Away"] || ""}
        </div>
        
        <div>
            <span class="result-badge ${resultClass}">
                ${match.Result}
            </span>
        </div>

    </div>

</a>

`;
    });
    
    html += `
    `;

    return html;
}

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    const input =
        document.getElementById("personSearch");

    const results =
        document.getElementById("personSearchResults");

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";
            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

            results.innerHTML = `
            <div class="player-search-results">
            ${filtered.map(item => `
            <a
                class="player-search-item"
                href="${
				    item.type === 'Manager'
				        ? `manager.html?name=${encodeURIComponent(item.name)}`
				        : item.type === 'Opponent'
				            ? `opponent.html?name=${encodeURIComponent(item.name)}`
				            : `player.html?name=${encodeURIComponent(item.name)}`
				}">
				${item.name}
				<span class="search-type ${item.type.toLowerCase()}">
				   (${item.type})
				</span>
            </a>
            `).join("")}
            </div>
            `;
});
}

const menuToggle =
    document.getElementById("menuToggle");

const menuOverlay =
    document.getElementById("menuOverlay");

const mainMenu =
    document.querySelector(".main-menu");

menuToggle.addEventListener("click", () => {

    mainMenu.classList.toggle("open");
    menuOverlay.classList.toggle("show");

    menuToggle.textContent =
        mainMenu.classList.contains("open")
        ? "✕"
        : "☰";
        
if(mainMenu.classList.contains("open")){

    setTimeout(() => {

        const input =
            document.getElementById(
                "mobilePersonSearch"
            );

        if(input){
            input.focus();
        }

    }, 250);
}

});

menuOverlay.addEventListener("click", () => {

    mainMenu.classList.remove("open");
    menuOverlay.classList.remove("show");

    menuToggle.textContent = "☰";

});

window.addEventListener("resize", () => {

    if(window.innerWidth > 820){

        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");

        menuToggle.textContent = "☰";

    }

});

document.addEventListener("DOMContentLoaded", () => {

    const mobileInput =
        document.getElementById("mobilePersonSearch");

    const desktopInput =
        document.getElementById("personSearch");

    if(!mobileInput || !desktopInput){
        return;
    }

    mobileInput.addEventListener("input", () => {

        desktopInput.value =
            mobileInput.value;

        desktopInput.dispatchEvent(
            new Event("input")
        );

        document.getElementById(
            "mobileSearchResults"
        ).innerHTML =
            document.getElementById(
                "personSearchResults"
            ).innerHTML;
    });

});

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="language" content="English">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="manifest" href="site.webmanifest">

<meta name="theme-color" content="#004D98">

<title>Compare Barça Players</title>

<meta name="robots" content="index,follow">

<meta name="author" content="RE">

<meta name="description" content="">

<link rel="canonical" href="https://barcadb.com/opponent.html">

<meta property="og:image"
      content="https://barcadb.com/logos/barcadb-logo.png">

<meta property="og:type"
      content="website">

<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:image"
      content="https://barcadb.com/logos/barcadb-logo.png">

<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/theme.css">

<style>

.left-panel{
flex:1.1;
min-width:0;
}

.right-panel{
flex:.9;
min-width:0;
}

@media(max-width:820px){
      
	.left-panel,
	.right-panel{
		flex:none !important;
		width:100% !important;
		min-width:0;
		max-width:100%;
		margin:0;
		}

	.container{
		padding:6px;
		}

}

</style>
</head>

<body>

<div class="container">

<div class="menu-overlay" id="menuOverlay"></div>

<div class="header">
    <div class="header-inner">
        <img src="logos/barcadb-logo.png" class="header-logo" alt="Barça DB">

        <div class="header-text">
            <h1>Barça Database</h1>
            <div class="hero-subtitle">
            Compare players
        </div>
    </div>

<div class="desktop-search">

    <input
        type="text"
        id="personSearch"
        placeholder="Search player, manager, opponent..."
        class="desktop-search-input">

    <div id="personSearchResults"></div>

</div>

    <button id="menuToggle" class="menu-toggle">
    	☰
    </button>

</div>
</div>

<nav class="main-menu">

    <div class="mobile-menu-search">

        <input
            type="text"
            id="mobilePersonSearch"
            placeholder="Search player, manager..."
            class="mobile-search-input">

        <div id="mobileSearchResults"></div>

    </div>

    <a href="index.html">
        <span>Home</span>
    </a>

    <a href="season.html">
        <span>Seasons</span>
    </a>

    <a href="compare.html" class="active">
        <span>Compare</span>
    </a>

    <a href="#">
        <span>Records</span>
    </a>

</nav>

<script>

let allMatches = [];

fetch("data.json")
.then(r => r.json())
.then(data => {

    allMatches = data;

    initPersonSearch();

})
.catch(error => {
    console.error(error);
});

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    const input =
        document.getElementById("personSearch");

    const results =
        document.getElementById("personSearchResults");

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";
            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

            results.innerHTML = `
            <div class="player-search-results">
            ${filtered.map(item => `
            <a
                class="player-search-item"
                href="${
				    item.type === 'Manager'
				        ? `manager.html?name=${encodeURIComponent(item.name)}`
				        : item.type === 'Opponent'
				            ? `opponent.html?name=${encodeURIComponent(item.name)}`
				            : `player.html?name=${encodeURIComponent(item.name)}`
				}">
				${item.name}
				<span class="search-type ${item.type.toLowerCase()}">
				   (${item.type})
				</span>
            </a>
            `).join("")}
            </div>
            `;
});
}

document.addEventListener("DOMContentLoaded", () => {

    const menuToggle =
        document.getElementById("menuToggle");

    const menuOverlay =
        document.getElementById("menuOverlay");

    const mainMenu =
        document.querySelector(".main-menu");

    const mobileInput =
        document.getElementById("mobilePersonSearch");

    const desktopInput =
        document.getElementById("personSearch");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){

        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");

        menuToggle.textContent = "☰";
    }

    function openMenu(){

        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");

        menuToggle.textContent = "✕";

        if(mobileInput){

            setTimeout(() => {
                mobileInput.focus();
            }, 250);

        }

    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener(
        "click",
        closeMenu
    );

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

    if(mobileInput && desktopInput){

        mobileInput.addEventListener("input", () => {

            desktopInput.value =
                mobileInput.value;

            desktopInput.dispatchEvent(
                new Event("input")
            );

            const mobileResults =
                document.getElementById(
                    "mobileSearchResults"
                );

            const desktopResults =
                document.getElementById(
                    "personSearchResults"
                );

            if(
                mobileResults &&
                desktopResults
            ){
                mobileResults.innerHTML =
                    desktopResults.innerHTML;
            }

        });

    }

});

</script>


</body>
</html>

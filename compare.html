<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="language" content="English">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="manifest" href="site.webmanifest">

<meta name="theme-color" content="#004D98">

<title>Compare Barça Players</title>

<meta name="robots" content="index,follow">

<meta name="author" content="RE">

<meta name="description" content="">

<link rel="canonical" href="https://barcadb.com/opponent.html">

<meta property="og:image"
      content="https://barcadb.com/logos/barcadb-logo.png">

<meta property="og:type"
      content="website">

<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:image"
      content="https://barcadb.com/logos/barcadb-logo.png">

<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/theme.css">

<style>

.compare-page{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.compare-header-card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px;
}

.compare-header-card h2{
    margin:0 0 8px;
}

.compare-header-card p{
    color:var(--muted);
    margin:0;
}

.compare-selector{
    display:grid;
    grid-template-columns:
        1fr auto 1fr;
    gap:16px;
    align-items:end;
}

.compare-search{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:18px;
}

.compare-search label{
    display:block;
    margin-bottom:10px;
    color:var(--muted);
    font-size:.9rem;

}

.compare-search input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--divider);
    background:var(--select-bg);
    color:var(--select-text);
}

.compare-vs{
    font-size:1.5rem;
    font-weight:700;
    color:var(--barca-red);
}

.compare-result-card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-left:4px solid var(--barca-blue);
    border-radius:16px;
    padding:20px;
}

.compare-result-title{
    font-weight:700;
    margin-bottom:8px;
}

.compare-result-text{
    color:var(--muted);
}

.compare-search{
    position:relative;
}

#compareResultsA,
#compareResultsB{
    position:absolute;
    left:18px;
    right:18px;
    top:88px;
    z-index:500;
}

.compare-search-item{
    cursor:pointer;
}

.compare-search-item:hover{
    background:var(--meta-bg);
}

#compareResultsA,
#compareResultsB{
    position:absolute;
    left:18px;
    right:18px;
    top:88px;
    z-index:500;
}

#compareResultsA .player-search-results,
#compareResultsB .player-search-results{
    background:var(--surface);
    border:1px solid var(--card-border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.compare-search-item{
    display:block;
    padding:10px 14px;
    cursor:pointer;
}

.compare-search-item:hover{
    background:var(--meta-bg);
}

.basic-info-grid{
    display:grid;
    grid-template-columns:
        1fr auto 1fr;
    gap:20px;
    align-items:start;
}

.basic-column{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.basic-column > div:first-child{
    font-size:1.15rem;
    font-weight:700;
    margin-bottom:8px;
}

.basic-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px;
    background:var(--meta-bg);
    border:1px solid var(--meta-border);
    border-radius:10px;
}

.basic-divider{
    align-self:center;
    font-weight:700;
    color:var(--barca-red);
}


@media(max-width:820px){
    .compare-selector{
        grid-template-columns:1fr;
    }

    .compare-vs{
        text-align:center;
    }

.basic-info-grid{
    grid-template-columns:1fr;
}

.basic-divider{
    text-align:center;
}

      
	.left-panel,
	.right-panel{
		flex:none !important;
		width:100% !important;
		min-width:0;
		max-width:100%;
		margin:0;
		}

	.container{
		padding:6px;
		}

}

</style>
</head>

<body>

<div class="container">

<div class="menu-overlay" id="menuOverlay"></div>

<div class="header">
    <div class="header-inner">
        <img src="logos/barcadb-logo.png" class="header-logo" alt="Barça DB">

        <div class="header-text">
            <h1>Barça Database</h1>
            <div class="hero-subtitle">
            Compare players
        </div>
    </div>

<div class="desktop-search">

    <input
        type="text"
        id="personSearch"
        placeholder="Search player, manager, opponent..."
        class="desktop-search-input">

    <div id="personSearchResults"></div>

</div>

    <button id="menuToggle" class="menu-toggle">
    	☰
    </button>

</div>
</div>

<nav class="main-menu">

    <div class="mobile-menu-search">

        <input
            type="text"
            id="mobilePersonSearch"
            placeholder="Search player, manager..."
            class="mobile-search-input">

        <div id="mobileSearchResults"></div>

    </div>

    <a href="index.html">
        <span>Home page</span>
    </a>

    <a href="season.html">
        <span>Seasons</span>
    </a>

    <a href="compare.html" class="active">
        <span>Compare</span>
    </a>

    <a href="#">
        <span>Records</span>
    </a>

</nav>

<div class="compare-page">

    <div class="compare-header-card">

        <h2>
            Compare Players
        </h2>

        <p>
            Select two players and compare their Barcelona careers.
        </p>

    </div>

    <div class="compare-selector">

        <div class="compare-search">

            <label>
                Player A
            </label>

            <input
                type="text"
                id="comparePlayerA"
                placeholder="Search player...">

            <div id="compareResultsA"></div>

        </div>

        <div class="compare-vs">
            VS
        </div>

        <div class="compare-search">

            <label>
                Player B
            </label>

            <input
                type="text"
                id="comparePlayerB"
                placeholder="Search player...">

            <div id="compareResultsB"></div>

        </div>

    </div>

    <div class="compare-result-card">

        <div class="compare-result-title">
            Comparison Result
        </div>

        <div class="compare-result-text">

            Select two players to begin comparison

        </div>

    </div>

<div
    class="compare-card"
    id="basicInfoCard"
    style="display:none;">

    <div class="compare-result-title">
        Basic Information
    </div>

    <div class="basic-info-grid">

        <div class="basic-column">

            <div id="playerAName">
                -
            </div>

            <div class="basic-row">

                <span>Debut</span>

                <strong id="playerADebut">
                    -
                </strong>

            </div>

            <div class="basic-row">

                <span>Last Match</span>

                <strong id="playerALastMatch">
                    -
                </strong>

            </div>

            <div class="basic-row">

                <span>Matches</span>

                <strong id="playerAMatches">
                    -
                </strong>

            </div>

        </div>

        <div class="basic-divider">
            VS
        </div>

        <div class="basic-column">

            <div id="playerBName">
                -
            </div>

            <div class="basic-row">

                <span>Debut</span>

                <strong id="playerBDebut">
                    -
                </strong>

            </div>

            <div class="basic-row">

                <span>Last Match</span>

                <strong id="playerBLastMatch">
                    -
                </strong>

            </div>

            <div class="basic-row">

                <span>Matches</span>

                <strong id="playerBMatches">
                    -
                </strong>

            </div>

        </div>

    </div>

</div>

</div>

<script>

let allMatches = [];

fetch("data.json")
.then(r => r.json())
.then(data => {

allMatches = data;

initPersonSearch();

initCompareSearch();

})
.catch(error => {
    console.error(error);
});

let comparePlayers = [];

let selectedPlayerA = null;
let selectedPlayerB = null;

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

comparePlayers =
    [...searchItems.values()]
    .filter(item => item.type === "Player")
    .sort((a,b) =>
        a.name.localeCompare(b.name)
    );

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

        const filtered =
            itemList
            .filter(item =>
                item.name.toLowerCase().includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}
attachSearch(
    "personSearch",
    "personSearchResults"
);

attachSearch(
    "mobilePersonSearch",
    "mobileSearchResults"
);

}

function initCompareSearch(){

    attachCompareSearch(
        "comparePlayerA",
        "compareResultsA",
        "A"
    );

    attachCompareSearch(
        "comparePlayerB",
        "compareResultsB",
        "B"
    );

}

function attachCompareSearch(
    inputId,
    resultsId,
    side
){

    const input =
        document.getElementById(inputId);

    const results =
        document.getElementById(resultsId);

    if(!input || !results){
        return;
    }

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";

            return;

        }

        const matches =
            comparePlayers
            .filter(player =>
                player.name
                .toLowerCase()
                .includes(value)
            )
            .slice(0,15);

        results.innerHTML = `

        <div class="player-search-results">

            ${matches.map(player => ` 

                <div
                    class="player-search-item compare-search-item"
                    data-name="${player.name}"
                    data-side="${side}">

                    ${player.name}

                </div>

            ` ).join("")}

        </div> `;

    });

    results.addEventListener("click", e => {

        const item =
            e.target.closest(
                ".compare-search-item"
            );

        if(!item){
            return;
        }

        const playerName =
            item.dataset.name;

        input.value =
            playerName;

        results.innerHTML = "";

        if(side === "A"){

            selectedPlayerA =
                playerName;

        }else{

            selectedPlayerB =
                playerName;

        }

        updateCompareResult();

    });

    input.addEventListener("blur", () => {

        setTimeout(() => {

            results.innerHTML = "";

        },200);

    });

}

function updateCompareResult(){

    const resultText =
        document.querySelector(
            ".compare-result-text"
        );

    if(!resultText){
        return;
    }

    if(
        !selectedPlayerA ||
        !selectedPlayerB
    ){

        resultText.textContent =
            "Select two players to begin comparison";

        return;

    }

    resultText.innerHTML = `

        <span class="player-a">
            ${selectedPlayerA}
        </span>

        vs

        <span class="player-b">
            ${selectedPlayerB}
        </span> `;

}

function getPlayerInfo(playerName){

    const matches = [];

    allMatches.forEach(match => {

        let played = false;

        for(let i=1;i<=11;i++){

            if(
                match[Player name ${i}]
                === playerName
            ){
                played = true;
            }

        }

        for(let i=1;i<=12;i++){

            if(
                match[On the bench name ${i}]
                === playerName
            ){
                played = true;
            }

        }

        if(played){
            matches.push(match);
        }

    });

    if(matches.length === 0){
        return null;
    }

    return {

        name:playerName,

        debut:
            matches[0].Date || "-",

        lastMatch:
            matches[matches.length-1].Date || "-",

        matches:
            matches.length

    };

}

resultText.innerHTML = `
<span class="player-a">
    ${selectedPlayerA}
</span>

vs

<span class="player-b">
    ${selectedPlayerB}
</span>`;

updateBasicInfo();

function updateBasicInfo(){

    if(
        !selectedPlayerA ||
        !selectedPlayerB
    ){
        return;
    }

    const playerA =
        getPlayerInfo(selectedPlayerA);

    const playerB =
        getPlayerInfo(selectedPlayerB);

    if(!playerA || !playerB){
        return;
    }

    document
        .getElementById("basicInfoCard")
        .style.display = "block";

    document.getElementById(
        "playerAName"
    ).textContent = playerA.name;

    document.getElementById(
        "playerADebut"
    ).textContent = playerA.debut;

    document.getElementById(
        "playerALastMatch"
    ).textContent = playerA.lastMatch;

    document.getElementById(
        "playerAMatches"
    ).textContent = playerA.matches;

    document.getElementById(
        "playerBName"
    ).textContent = playerB.name;

    document.getElementById(
        "playerBDebut"
    ).textContent = playerB.debut;

    document.getElementById(
        "playerBLastMatch"
    ).textContent = playerB.lastMatch;

    document.getElementById(
        "playerBMatches"
    ).textContent = playerB.matches;

}


document.addEventListener("DOMContentLoaded", () => {

    const menuToggle =
        document.getElementById("menuToggle");

    const menuOverlay =
        document.getElementById("menuOverlay");

    const mainMenu =
        document.querySelector(".main-menu");

    const mobileInput =
        document.getElementById("mobilePersonSearch");

    const desktopInput =
        document.getElementById("personSearch");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){

        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");

        menuToggle.textContent = "☰";
    }

    function openMenu(){

        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");

        menuToggle.textContent = "✕";

        if(mobileInput){

            setTimeout(() => {
                mobileInput.focus();
            }, 250);

        }

    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener(
        "click",
        closeMenu
    );

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

    if(mobileInput && desktopInput){

        mobileInput.addEventListener("input", () => {

            desktopInput.value =
                mobileInput.value;

            desktopInput.dispatchEvent(
                new Event("input")
            );

            const mobileResults =
                document.getElementById(
                    "mobileSearchResults"
                );

            const desktopResults =
                document.getElementById(
                    "personSearchResults"
                );

            if(
                mobileResults &&
                desktopResults
            ){
                mobileResults.innerHTML =
                    desktopResults.innerHTML;
            }

        });

    }

});

</script>


</body>
</html>
